server:
  ssl:
    enabled: false

spring:
  cloud:
    nacos:
      discovery:
        enabled: false
    gateway:
      routes:
        - id: wao-agent-api
          uri: ${WAO_AGENT_SERVER_URI:http://127.0.0.1:8081}
          predicates:
            - Path=/api/agent/**
        - id: wao-server-api
          uri: http://127.0.0.1:8080
          predicates:
            - Path=/api/**
