name: Source checks
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  web-stability:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            wao-web/package-lock.json
            wao-game/package-lock.json
      - run: npm ci
        working-directory: wao-game
      - run: npm ci
        working-directory: wao-web
      - run: npm run type-check
        working-directory: wao-web
      - run: npm run test:stability
        working-directory: wao-web
      - run: npm run test:resources
        working-directory: wao-web
      - run: npm run test:task-experience
        working-directory: wao-web
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Scan source and reachable history
        shell: bash
        run: |
          # Both URLs serve the v8.30.1 Linux x64 asset and use the checksum below.
          curl --fail --silent --show-error --location --output gitleaks.tar.gz https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
            || curl --fail --silent --show-error --location --header 'Accept: application/octet-stream' --output gitleaks.tar.gz https://api.github.com/repos/gitleaks/gitleaks/releases/assets/378332058
          printf '%s  gitleaks.tar.gz\n' '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb' | sha256sum --check
          mkdir -p "$RUNNER_TEMP/gitleaks"
          tar -xzf gitleaks.tar.gz -C "$RUNNER_TEMP/gitleaks" gitleaks
          rm gitleaks.tar.gz
          "$RUNNER_TEMP/gitleaks/gitleaks" git . --log-opts=--all --config .gitleaks.toml --redact=100 --no-banner
          "$RUNNER_TEMP/gitleaks/gitleaks" dir . --config .gitleaks.toml --redact=100 --no-banner
  local-install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check independent local installation
        run: python -m unittest discover -s tests/deployment -p 'test_*.py'
      - name: Check production build isolation and history mapping
        shell: pwsh
        run: |
          ./tests/deployment/WindowsBuildInputs.Tests.ps1
          ./tests/deployment/WindowsOperationsMonitor.Tests.ps1
          ./tests/deployment/WindowsOperationDelivery.Tests.ps1
