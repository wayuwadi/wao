name: WAO iOS Notes Build

on:
  push:
    branches: [main]
    paths: ['wao-mobile/**', '.github/workflows/mobile-release.yml']
  workflow_dispatch:
    inputs:
      version:
        description: '发布版本 X.Y.Z（留空仅构建当前 package.json 版本）'
        type: string
        required: false

permissions:
  contents: read

concurrency:
  group: wao-mobile-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      publish: ${{ steps.version.outputs.publish }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: wao-mobile/package-lock.json
      - name: Resolve mobile version
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          publish=false
          if [[ "$GITHUB_REF" == refs/tags/mobile-v* ]]; then
            version="${GITHUB_REF_NAME#mobile-v}"
            publish=true
          elif [[ -n "$INPUT_VERSION" ]]; then
            version="$INPUT_VERSION"
            publish=true
          else
            version=$(node -p 'require("./wao-mobile/package.json").version')
          fi
          [[ "$version" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]] || { echo '版本格式错误'; exit 1; }
          if [[ "$publish" == true ]]; then
            git merge-base --is-ancestor HEAD origin/main || { echo '只能发布已合并 main 的提交'; exit 1; }
            if gh release view "mobile-v$version" --json isDraft --jq '.isDraft' > /tmp/mobile-release-state 2>/dev/null; then
              [[ $(cat /tmp/mobile-release-state) == true ]] || { echo '该版本已经发布，请提升版本号'; exit 1; }
            fi
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "publish=$publish" >> "$GITHUB_OUTPUT"
      - run: npm ci
        working-directory: wao-mobile
      - run: npm run check
        working-directory: wao-mobile
      - name: Test public download publication
        run: node --test wao-mobile/scripts/check-download-publication.mjs
      - name: Validate native versions
        run: npm run version:native
        working-directory: wao-mobile
        env:
          IOS_ONLY: 'true'
          MOBILE_VERSION: ${{ steps.version.outputs.version }}

  android:
    # ADR-323 仅恢复 iOS 小记；保留历史配置但禁止 Android 构建和发布。
    if: false
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: wao-mobile/package-lock.json
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
      - run: npm ci && npm run build && npx cap sync android && npm run version:native
        working-directory: wao-mobile
        env:
          MOBILE_VERSION: ${{ needs.check.outputs.version }}
          VITE_MOBILE_VERSION: ${{ needs.check.outputs.version }}
      - name: Build signed Android APK and AAB
        working-directory: wao-mobile
        env:
          KEYSTORE_BASE64: ${{ secrets.MOBILE_ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.MOBILE_ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.MOBILE_ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.MOBILE_ANDROID_KEY_PASSWORD }}
          MOBILE_VERSION: ${{ needs.check.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          : "${KEYSTORE_BASE64:?缺少 Android 固定签名文件}"
          : "${ANDROID_KEYSTORE_PASSWORD:?缺少 Android 签名密码}"
          : "${ANDROID_KEY_ALIAS:?缺少 Android 签名别名}"
          : "${ANDROID_KEY_PASSWORD:?缺少 Android 私钥密码}"
          export ANDROID_KEYSTORE_PATH="$RUNNER_TEMP/wao-mobile.jks"
          trap 'rm -f "$ANDROID_KEYSTORE_PATH"' EXIT
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$ANDROID_KEYSTORE_PATH"
          chmod 600 "$ANDROID_KEYSTORE_PATH"
          cd android
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease bundleRelease lintRelease
          cd ..
          mkdir -p artifacts
          cp android/app/build/outputs/apk/release/app-release.apk "artifacts/WAO-${MOBILE_VERSION}-android.apk"
          cp android/app/build/outputs/bundle/release/app-release.aab "artifacts/WAO-${MOBILE_VERSION}-android.aab"
          apksigner=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -1)
          "$apksigner" verify --verbose --print-certs "artifacts/WAO-${MOBILE_VERSION}-android.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: wao-mobile-android-${{ needs.check.outputs.version }}
          path: wao-mobile/artifacts/*
          if-no-files-found: error
          retention-days: 30

  ios:
    needs: check
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: wao-mobile/package-lock.json
      - name: Select Xcode 26
        run: |
          test -d /Applications/Xcode_26.2.app || { echo 'Runner 缺少 Xcode 26.2'; exit 1; }
          sudo xcode-select -s /Applications/Xcode_26.2.app/Contents/Developer
          xcodebuild -version
      - run: npm ci && npm run build && npx cap sync ios
        working-directory: wao-mobile
        env:
          VITE_MOBILE_VERSION: ${{ needs.check.outputs.version }}
      - name: Build simulator and unsigned device IPA for personal signing
        run: bash scripts/build-ios.sh
        working-directory: wao-mobile
        env:
          MOBILE_VERSION: ${{ needs.check.outputs.version }}
      - uses: actions/upload-artifact@v4
        with:
          name: wao-mobile-ios-unsigned-${{ needs.check.outputs.version }}
          path: wao-mobile/artifacts/*-ios-unsigned.ipa
          if-no-files-found: error
          retention-days: 30

  publish:
    needs: [check, android, ios]
    # 未确定 Apple 签名与安装路径，不恢复公开双平台下载发布。
    if: false
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v4
        with:
          pattern: wao-mobile-*
          path: artifacts
          merge-multiple: true
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Publish private repository release with checksums
        env:
          GH_TOKEN: ${{ github.token }}
          MOBILE_VERSION: ${{ needs.check.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          cd artifacts
          sha256sum *.apk *.aab *.ipa > SHA256SUMS.txt
          cd ..
          cp wao-mobile/docs/INSTALL.md artifacts/INSTALL.md
          tag="mobile-v$MOBILE_VERSION"
          if ! gh release view "$tag" >/dev/null 2>&1; then
            gh release create "$tag" --target "$GITHUB_SHA" --draft --prerelease --title "WAO 移动端 $MOBILE_VERSION · 双人内测" --notes-file wao-mobile/docs/RELEASE-NOTES.md
          fi
          gh release upload "$tag" artifacts/* --clobber
          gh release edit "$tag" --draft=false
      - name: Prepare public mobile downloads
        env:
          MOBILE_VERSION: ${{ needs.check.outputs.version }}
        run: node wao-mobile/scripts/prepare-downloads.mjs artifacts public-downloads "$MOBILE_VERSION"
      - name: Configure deployment SSH
        env:
          DEPLOY_KEY: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_SSH_KNOWN_HOSTS }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
      - name: Publish mobile downloads atomically
        env:
          CLOUD_HOST: ${{ secrets.CLOUD_HOST }}
          CLOUD_USER: ${{ secrets.CLOUD_USER }}
          MOBILE_VERSION: ${{ needs.check.outputs.version }}
        run: |
          set -euo pipefail
          incoming="/tmp/wao-mobile-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          ssh "$CLOUD_USER@$CLOUD_HOST" "install -d '$incoming'"
          scp -r public-downloads/* "$CLOUD_USER@$CLOUD_HOST:$incoming/"
          ssh "$CLOUD_USER@$CLOUD_HOST" bash -s -- "$incoming" "$MOBILE_VERSION" < wao-mobile/scripts/publish-downloads.sh
      - name: Verify public downloads
        env:
          MOBILE_VERSION: ${{ needs.check.outputs.version }}
        run: |
          set -euo pipefail
          base=https://wao.wayuwa.cn/downloads/mobile
          curl --retry 3 -fsS "$base/latest.json" -o manifest.json
          jq -e --arg version "$MOBILE_VERSION" '.version == $version' manifest.json
          mkdir verified
          cd verified
          for name in "WAO-$MOBILE_VERSION-android.apk" "WAO-$MOBILE_VERSION-ios-unsigned.ipa" SHA256SUMS.txt; do
            curl --retry 3 -fsS "$base/$MOBILE_VERSION/$name" -o "$name"
          done
          sha256sum -c "../public-downloads/$MOBILE_VERSION/SHA256SUMS.txt"
          curl -fsSI "$base/latest.json" | grep -i 'cache-control:.*no-store'
          echo "Android and iOS $MOBILE_VERSION published at https://wao.wayuwa.cn/download" >> "$GITHUB_STEP_SUMMARY"
