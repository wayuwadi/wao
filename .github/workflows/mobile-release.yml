name: WAO Mobile Release

on:
  push:
    branches: [main]
    paths: ['wao-mobile/**', '.github/workflows/mobile-release.yml']
    tags: ['mobile-v*']
  workflow_dispatch:
    inputs:
      version:
        description: '发布版本 X.Y.Z（留空仅构建当前 package.json 版本）'
        type: string
        required: false

permissions:
  contents: read

concurrency:
  group: wao-mobile-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      publish: ${{ steps.version.outputs.publish }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: wao-mobile/package-lock.json
      - name: Resolve mobile version
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          publish=false
          if [[ "$GITHUB_REF" == refs/tags/mobile-v* ]]; then
            version="${GITHUB_REF_NAME#mobile-v}"
            publish=true
          elif [[ -n "$INPUT_VERSION" ]]; then
            version="$INPUT_VERSION"
            publish=true
          else
            version=$(node -p 'require("./wao-mobile/package.json").version')
          fi
          [[ "$version" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]] || { echo '版本格式错误'; exit 1; }
          if [[ "$publish" == true ]]; then
            git merge-base --is-ancestor HEAD origin/main || { echo '只能发布已合并 main 的提交'; exit 1; }
            if gh release view "mobile-v$version" --json isDraft --jq '.isDraft' > /tmp/mobile-release-state 2>/dev/null; then
              [[ $(cat /tmp/mobile-release-state) == true ]] || { echo '该版本已经发布，请提升版本号'; exit 1; }
            fi
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "publish=$publish" >> "$GITHUB_OUTPUT"
      - run: npm ci
        working-directory: wao-mobile
      - run: npm run check
        working-directory: wao-mobile
      - name: Validate native versions
        run: npm run version:native
        working-directory: wao-mobile
        env:
          MOBILE_VERSION: ${{ steps.version.outputs.version }}

  android:
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: wao-mobile/package-lock.json
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
      - run: npm ci && npm run build && npx cap sync android && npm run version:native
        working-directory: wao-mobile
        env:
          MOBILE_VERSION: ${{ needs.check.outputs.version }}
          VITE_MOBILE_VERSION: ${{ needs.check.outputs.version }}
      - name: Build signed Android APK and AAB
        working-directory: wao-mobile
        env:
          KEYSTORE_BASE64: ${{ secrets.MOBILE_ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.MOBILE_ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.MOBILE_ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.MOBILE_ANDROID_KEY_PASSWORD }}
          MOBILE_VERSION: ${{ needs.check.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          : "${KEYSTORE_BASE64:?缺少 Android 固定签名文件}"
          : "${ANDROID_KEYSTORE_PASSWORD:?缺少 Android 签名密码}"
          : "${ANDROID_KEY_ALIAS:?缺少 Android 签名别名}"
          : "${ANDROID_KEY_PASSWORD:?缺少 Android 私钥密码}"
          export ANDROID_KEYSTORE_PATH="$RUNNER_TEMP/wao-mobile.jks"
          trap 'rm -f "$ANDROID_KEYSTORE_PATH"' EXIT
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$ANDROID_KEYSTORE_PATH"
          chmod 600 "$ANDROID_KEYSTORE_PATH"
          cd android
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease bundleRelease lintRelease
          cd ..
          mkdir -p artifacts
          cp android/app/build/outputs/apk/release/app-release.apk "artifacts/WAO-${MOBILE_VERSION}-android.apk"
          cp android/app/build/outputs/bundle/release/app-release.aab "artifacts/WAO-${MOBILE_VERSION}-android.aab"
          apksigner=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -1)
          "$apksigner" verify --verbose --print-certs "artifacts/WAO-${MOBILE_VERSION}-android.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: wao-mobile-android-${{ needs.check.outputs.version }}
          path: wao-mobile/artifacts/*
          if-no-files-found: error
          retention-days: 30

  ios:
    needs: check
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: wao-mobile/package-lock.json
      - name: Select Xcode 26
        run: |
          test -d /Applications/Xcode_26.2.app || { echo 'Runner 缺少 Xcode 26.2'; exit 1; }
          sudo xcode-select -s /Applications/Xcode_26.2.app/Contents/Developer
          xcodebuild -version
      - run: npm ci && npm run build && npx cap sync ios
        working-directory: wao-mobile
        env:
          VITE_MOBILE_VERSION: ${{ needs.check.outputs.version }}
      - name: Build simulator and unsigned device IPA for personal signing
        run: bash scripts/build-ios.sh
        working-directory: wao-mobile
        env:
          MOBILE_VERSION: ${{ needs.check.outputs.version }}
      - uses: actions/upload-artifact@v4
        with:
          name: wao-mobile-ios-unsigned-${{ needs.check.outputs.version }}
          path: wao-mobile/artifacts/*-ios-unsigned.ipa
          if-no-files-found: error
          retention-days: 30

  publish:
    needs: [check, android, ios]
    if: needs.check.outputs.publish == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v4
        with:
          pattern: wao-mobile-*
          path: artifacts
          merge-multiple: true
      - name: Publish private repository release with checksums
        env:
          GH_TOKEN: ${{ github.token }}
          MOBILE_VERSION: ${{ needs.check.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          cd artifacts
          sha256sum *.apk *.aab *.ipa > SHA256SUMS.txt
          cd ..
          cp wao-mobile/docs/INSTALL.md artifacts/INSTALL.md
          tag="mobile-v$MOBILE_VERSION"
          if ! gh release view "$tag" >/dev/null 2>&1; then
            gh release create "$tag" --target "$GITHUB_SHA" --draft --prerelease --title "WAO 移动端 $MOBILE_VERSION · 双人内测" --notes-file wao-mobile/docs/RELEASE-NOTES.md
          fi
          gh release upload "$tag" artifacts/* --clobber
          gh release edit "$tag" --draft=false
