name: WAO Native iOS Build

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "wao-ios/**"
      - ".github/workflows/ios-build.yml"

permissions:
  contents: read

concurrency:
  group: wao-native-ios-build
  cancel-in-progress: true

jobs:
  build:
    name: Test and package unsigned native app
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v6
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate Xcode project
        run: |
          sh wao-ios/scripts/prepare-app-icon.sh
          xcodegen generate --spec wao-ios/project.yml
      - name: Test on iOS Simulator
        run: |
          set -o pipefail
          device="$(xcrun simctl list devices available -j | python3 -c 'import json,sys; data=json.load(sys.stdin); print(next(device["name"] for runtime in data["devices"].values() for device in runtime if device["name"].startswith("iPhone")))')"
          xcodebuild -project wao-ios/WAO.xcodeproj -scheme WAO \
            -destination "platform=iOS Simulator,name=$device,OS=latest" test
      - name: Build unsigned device archive
        run: |
          xcodebuild -project wao-ios/WAO.xcodeproj -scheme WAO \
            -configuration Release -sdk iphoneos \
            -archivePath "$RUNNER_TEMP/WAO.xcarchive" \
            CODE_SIGNING_ALLOWED=NO archive
          mkdir -p "$RUNNER_TEMP/Payload"
          cp -R "$RUNNER_TEMP/WAO.xcarchive/Products/Applications/WAO.app" "$RUNNER_TEMP/Payload/"
          ditto -c -k --sequesterRsrc --keepParent "$RUNNER_TEMP/Payload" "$RUNNER_TEMP/WAO-unsigned.ipa"
      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: WAO-unsigned-ipa
          path: ${{ runner.temp }}/WAO-unsigned.ipa
          if-no-files-found: error
          retention-days: 30
