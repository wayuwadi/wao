name: WAO Client Signing Key Migration

on:
  workflow_dispatch:

permissions: {}

concurrency:
  group: wao-client-signing-key-migration
  cancel-in-progress: false

jobs:
  migrate:
    if: github.repository == 'wayuwacn/wao' && github.ref == 'refs/heads/main'
    # No shared or hosted runner may receive this secret. Register an ephemeral
    # Linux2 runner with ONLY this label, then remove it after the single job.
    runs-on: wao-key-migration-linux2-20260924
    timeout-minutes: 5
    steps:
      - name: Restore the existing updater key on Linux2
        shell: bash
        env:
          TAURI_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          set +x
          test "$(hostname)" = wadihome
          test -n "$TAURI_KEY"
          umask 077
          key_file=$(mktemp "$RUNNER_TEMP/wao-updater-key.XXXXXX")
          trap 'rm -f "$key_file"' EXIT
          printf '%s' "$TAURI_KEY" > "$key_file"
          unset TAURI_KEY
          target=/etc/jenkins/secrets/tauri-updater.key
          if sudo test -s "$target"; then
            sudo cmp -s "$key_file" "$target" || { echo 'Existing key differs; refusing replacement.' >&2; exit 1; }
          else
            sudo install -o root -g jenkins -m 0640 "$key_file" "$target"
          fi
          echo 'Original key restored to restricted Linux2 file; release must verify against the existing public key.'
