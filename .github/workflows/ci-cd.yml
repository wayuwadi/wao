name: WAO CI/CD

on:
  workflow_dispatch:
  # PR 负责特性分支的验证；push 只在 main 触发（合并即部署）。
  # 这样「push 特性分支 → 开 PR → 合并 main」不再重复跑三次，只在 PR 与 main 各跑一次。
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: wao-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - run: mvn -B test

  frontend:
    name: Frontend checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: wao-web
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: wao-web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run test:unit -- --run
      - run: npm run build

  containers:
    name: Container build
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v6
      - name: Build application images
        run: |
          docker build -f deploy/Dockerfile --target server-runtime -t wao-server:latest .
          docker build -f deploy/Dockerfile --target gateway-runtime -t wao-gateway:latest .

  deploy:
    name: Deploy main
    runs-on: ubuntu-latest
    needs: [backend, frontend, containers]
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main' && vars.DEPLOY_ENABLED == 'true'
    environment: production
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: wao-web/package-lock.json
      - name: Build frontend release
        working-directory: wao-web
        run: |
          npm ci
          npm run build
      - name: Package release
        run: |
          git archive --format=tar.gz -o wao-release.tgz HEAD
          git archive --format=zip -o wao-release.zip HEAD
      - name: Configure SSH
        env:
          DEPLOY_KEY: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}
          DEPLOY_SSH_KNOWN_HOSTS: ${{ secrets.DEPLOY_SSH_KNOWN_HOSTS }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$DEPLOY_SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
      - name: Deploy master node
        env:
          HOST: ${{ secrets.MASTER_HOST }}
          USER: ${{ secrets.MASTER_USER }}
        run: |
          scp wao-release.tgz "$USER@$HOST:/tmp/wao-release.tgz"
          ssh "$USER@$HOST" 'desktop_dir="$(xdg-user-dir DESKTOP 2>/dev/null || printf "%s" "$HOME/Desktop")"; install -d "$desktop_dir/deploy/wao"; tar -xzf /tmp/wao-release.tgz -C "$desktop_dir/deploy/wao"; sh "$desktop_dir/deploy/wao/deploy/scripts/deploy-linux.sh" master'
      - name: Deploy slave node
        env:
          HOST: ${{ secrets.SLAVE_HOST }}
          USER: ${{ secrets.SLAVE_USER }}
        shell: bash
        run: |
          scp wao-release.zip "$USER@$HOST:D:/deploy/wao-release.zip"
          scp deploy/scripts/install-release-windows.ps1 "$USER@$HOST:D:/deploy/install-release-windows.ps1"
          ssh "$USER@$HOST" 'powershell.exe -NoProfile -ExecutionPolicy Bypass -File D:\deploy\install-release-windows.ps1'
      - name: Deploy cloud frontend
        env:
          HOST: ${{ secrets.CLOUD_HOST }}
          USER: ${{ secrets.CLOUD_USER }}
        run: |
          ssh "$USER@$HOST" 'mkdir -p /tmp/wao-dist'
          scp -r wao-web/dist/. "$USER@$HOST:/tmp/wao-dist/"
          ssh "$USER@$HOST" 'install -d /var/www/wao/dist && find /var/www/wao/dist -mindepth 1 -maxdepth 1 -exec rm -rf -- {} + && cp -a /tmp/wao-dist/. /var/www/wao/dist/ && nginx -t && systemctl reload nginx'
      - name: Verify production
        run: |
          response="$(curl --fail --silent --show-error --retry 6 --retry-delay 5 --retry-all-errors https://wao.wayuwa.cn/api/hello)"
          printf '%s' "$response" | grep -q '"code":0'
          printf '%s' "$response" | grep -q '"service":"wao-server"'

  notify:
    name: Feishu notification
    runs-on: ubuntu-latest
    # 只在合入 main（push）或手动触发时通知；PR/开发分支每次提交都会跑 CI，
    # 但那属于开发中的噪音，不需要每次都推送到团队群。
    if: always() && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    needs: [backend, frontend, containers, deploy]
    env:
      FEISHU_WEBHOOK_URL: ${{ secrets.FEISHU_WEBHOOK_URL }}
      BACKEND_RESULT: ${{ needs.backend.result }}
      FRONTEND_RESULT: ${{ needs.frontend.result }}
      CONTAINERS_RESULT: ${{ needs.containers.result }}
      DEPLOY_RESULT: ${{ needs.deploy.result }}
    steps:
      - name: Notify Feishu
        if: env.FEISHU_WEBHOOK_URL != ''
        env:
          REPOSITORY: ${{ github.repository }}
          ACTOR: ${{ github.actor }}
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.head_ref || github.ref_name }}
          COMMIT_SHA: ${{ github.sha }}
          COMMIT_MSG: ${{ github.event.head_commit.message || github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
          COMMIT_URL: ${{ github.event.pull_request.html_url || format('{0}/{1}/commit/{2}', github.server_url, github.repository, github.sha) }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          ci_result="success"
          for result in "$BACKEND_RESULT" "$FRONTEND_RESULT" "$CONTAINERS_RESULT"; do
            if [ "$result" != "success" ]; then
              ci_result="failure"
            fi
          done

          overall="✅ 成功"
          header_color="green"
          if [ "$ci_result" != "success" ] || { [ "$DEPLOY_RESULT" != "success" ] && [ "$DEPLOY_RESULT" != "skipped" ]; }; then
            overall="❌ 失败"
            header_color="red"
          fi

          # 把 job 结果映射成带图标的可读状态。
          status_label() {
            case "$1" in
              success) printf '✅ 成功' ;;
              failure) printf '❌ 失败' ;;
              cancelled) printf '🚫 取消' ;;
              skipped) printf '⏭️ 跳过' ;;
              *) printf '❔ %s' "$1" ;;
            esac
          }

          short_sha="$(printf '%s' "$COMMIT_SHA" | cut -c1-8)"
          # “本次改动”取完整提交信息（标题 + 正文）；PR 触发时额外附上 PR 描述。
          # 空则占位；过长做截断，避免卡片内容超出飞书限制。
          change_summary="$COMMIT_MSG"
          if [ -n "${PR_BODY:-}" ]; then
            change_summary="$(printf '%s\n\n%s' "$change_summary" "$PR_BODY")"
          fi
          [ -n "$change_summary" ] || change_summary="（无提交信息）"
          if [ "${#change_summary}" -gt 1200 ]; then
            change_summary="$(printf '%s' "$change_summary" | cut -c1-1200)…"
          fi

          # 飞书交互式卡片（msg_type=interactive）：头部按成败着色，正文突出“本次改动”，并列出各阶段状态。
          payload="$(jq -n \
            --arg title "WAO CI/CD ${overall}" \
            --arg template "$header_color" \
            --arg repo "$REPOSITORY" \
            --arg branch "$REF_NAME" \
            --arg trigger "${ACTOR} / ${EVENT_NAME}" \
            --arg sha "$short_sha" \
            --arg sha_url "$COMMIT_URL" \
            --arg change "$change_summary" \
            --arg backend "$(status_label "$BACKEND_RESULT")" \
            --arg frontend "$(status_label "$FRONTEND_RESULT")" \
            --arg containers "$(status_label "$CONTAINERS_RESULT")" \
            --arg deploy "$(status_label "$DEPLOY_RESULT")" \
            --arg run_url "$RUN_URL" \
            '{
              msg_type: "interactive",
              card: {
                config: { wide_screen_mode: true },
                header: {
                  template: $template,
                  title: { tag: "plain_text", content: $title }
                },
                elements: [
                  { tag: "div", fields: [
                    { is_short: true, text: { tag: "lark_md", content: ("**仓库**\n" + $repo) } },
                    { is_short: true, text: { tag: "lark_md", content: ("**分支**\n" + $branch) } },
                    { is_short: true, text: { tag: "lark_md", content: ("**触发**\n" + $trigger) } },
                    { is_short: true, text: { tag: "lark_md", content: ("**提交**\n[" + $sha + "](" + $sha_url + ")") } }
                  ] },
                  { tag: "hr" },
                  { tag: "div", text: { tag: "lark_md", content: ("**本次改动**\n" + $change) } },
                  { tag: "hr" },
                  { tag: "div", fields: [
                    { is_short: true, text: { tag: "lark_md", content: ("**后端**\n" + $backend) } },
                    { is_short: true, text: { tag: "lark_md", content: ("**前端**\n" + $frontend) } },
                    { is_short: true, text: { tag: "lark_md", content: ("**容器**\n" + $containers) } },
                    { is_short: true, text: { tag: "lark_md", content: ("**部署**\n" + $deploy) } }
                  ] },
                  { tag: "action", actions: [
                    { tag: "button",
                      text: { tag: "plain_text", content: "查看运行详情" },
                      url: $run_url,
                      type: "primary" }
                  ] }
                ]
              }
            }')"
          response="$(curl --fail --silent --show-error -X POST "$FEISHU_WEBHOOK_URL" -H 'Content-Type: application/json' --data "$payload")"
          printf '%s' "$response" | jq -e '(.code // .StatusCode // 0) == 0' >/dev/null
