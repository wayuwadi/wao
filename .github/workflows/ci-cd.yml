name: WAO CI/CD

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: ["**"]

permissions:
  contents: read

concurrency:
  group: wao-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - run: mvn -B test

  frontend:
    name: Frontend checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: wao-web
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: wao-web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run test:unit -- --run
      - run: npm run build

  containers:
    name: Container build
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    strategy:
      matrix:
        dockerfile: [wao-server/Dockerfile, wao-gateway/Dockerfile]
    steps:
      - uses: actions/checkout@v6
      - run: docker build -f "${{ matrix.dockerfile }}" .

  deploy:
    name: Deploy main
    runs-on: ubuntu-latest
    needs: [backend, frontend, containers]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.DEPLOY_ENABLED == 'true'
    environment: production
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: wao-web/package-lock.json
      - name: Build frontend release
        working-directory: wao-web
        run: |
          npm ci
          npm run build
      - name: Package release
        run: tar --exclude=.git --exclude=node_modules --exclude=target -czf wao-release.tgz .
      - name: Configure SSH
        env:
          DEPLOY_KEY: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}
          DEPLOY_SSH_KNOWN_HOSTS: ${{ secrets.DEPLOY_SSH_KNOWN_HOSTS }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$DEPLOY_SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
      - name: Deploy master node
        env:
          HOST: ${{ secrets.MASTER_HOST }}
          USER: ${{ secrets.MASTER_USER }}
          CLOUD_HOST: ${{ secrets.CLOUD_HOST }}
          CLOUD_USER: ${{ secrets.CLOUD_USER }}
        run: |
          proxy="$CLOUD_USER@$CLOUD_HOST"
          scp -o ProxyJump="$proxy" wao-release.tgz "$USER@$HOST:/tmp/wao-release.tgz"
          ssh -o ProxyJump="$proxy" "$USER@$HOST" 'mkdir -p "$HOME/Desktop/deploy/wao" && tar -xzf /tmp/wao-release.tgz -C "$HOME/Desktop/deploy/wao" && sh "$HOME/Desktop/deploy/wao/deploy/scripts/deploy-linux.sh" master'
      - name: Deploy slave node
        env:
          HOST: ${{ secrets.SLAVE_HOST }}
          USER: ${{ secrets.SLAVE_USER }}
          CLOUD_HOST: ${{ secrets.CLOUD_HOST }}
          CLOUD_USER: ${{ secrets.CLOUD_USER }}
        shell: bash
        run: |
          proxy="$CLOUD_USER@$CLOUD_HOST"
          scp -o ProxyJump="$proxy" wao-release.tgz "$USER@$HOST:D:/deploy/wao-release.tgz"
          scp -o ProxyJump="$proxy" deploy/scripts/install-release-windows.ps1 "$USER@$HOST:D:/deploy/install-release-windows.ps1"
          ssh -o ProxyJump="$proxy" "$USER@$HOST" 'powershell.exe -NoProfile -ExecutionPolicy Bypass -File D:\deploy\install-release-windows.ps1'
      - name: Deploy cloud frontend
        env:
          HOST: ${{ secrets.CLOUD_HOST }}
          USER: ${{ secrets.CLOUD_USER }}
        run: |
          ssh "$USER@$HOST" 'mkdir -p /tmp/wao-dist'
          scp -r wao-web/dist/. "$USER@$HOST:/tmp/wao-dist/"
          ssh "$USER@$HOST" 'install -d /var/www/wao/dist && find /var/www/wao/dist -mindepth 1 -maxdepth 1 -exec rm -rf -- {} + && cp -a /tmp/wao-dist/. /var/www/wao/dist/ && nginx -t && systemctl reload nginx'
      - name: Verify production
        run: |
          response="$(curl --fail --silent --show-error --retry 6 --retry-delay 5 --retry-all-errors https://wao.wayuwa.cn/api/hello)"
          printf '%s' "$response" | grep -q '"code":0'
          printf '%s' "$response" | grep -q '"service":"wao-server"'
