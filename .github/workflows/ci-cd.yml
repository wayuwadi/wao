name: WAO Fast CD

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: wao-main-deploy
  # V77 等需要持久化维护窗口的 migration 不能在停旧节点后被下一次 push 取消。
  cancel-in-progress: false

jobs:
  deploy:
    name: Build once and deploy with Gateway draining
    runs-on: ubuntu-latest
    if: vars.DEPLOY_ENABLED == 'true'
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: |
            wao-web/package-lock.json
            agent-web/package-lock.json
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - name: Validate Nginx DDNS rendering
        run: sh deploy/scripts/test-render-nginx-config.sh
      - name: Validate schema quiescing scripts
        run: sh deploy/scripts/test-quiesce-wao-server.sh
      - name: Validate Flyway migration versions
        run: |
          duplicates="$(find wao-server/src/main/resources/db/migration -maxdepth 1 -type f -name 'V*__*.sql' -printf '%f\n' \
            | sed -E 's/^V([^_]*)__.*$/\1/' | sort | uniq -d)"
          if [ -n "$duplicates" ]; then
            printf 'Flyway migration 版本重复：%s\n' "$duplicates"
            exit 1
          fi
          agent_duplicates="$(find agent-server/src/main/resources/db/migration -maxdepth 1 -type f -name 'V*__*.sql' -printf '%f\n' \
            | sed -E 's/^V([^_]*)__.*$/\1/' | sort | uniq -d)"
          if [ -n "$agent_duplicates" ]; then
            printf 'Agent Flyway migration 版本重复：%s\n' "$agent_duplicates"
            exit 1
          fi
      - name: Test backend reactor
        run: mvn -B test
      - name: Test and build frontend release
        run: |
          npm --prefix wao-web ci
          npm --prefix wao-web run test:unit -- --run
          npm --prefix wao-web run build
          npm --prefix agent-web ci
          npm --prefix agent-web run test:unit -- --run
          npm --prefix agent-web run build
      - name: Package release
        run: |
          git archive --format=tar.gz -o wao-release.tgz HEAD
          git archive --format=zip -o wao-release.zip HEAD
      - name: Prepare private Feishu configuration
        env:
          FEISHU_APP_ID: ${{ secrets.FEISHU_APP_ID }}
          FEISHU_APP_SECRET: ${{ secrets.FEISHU_APP_SECRET }}
          FEISHU_WEBHOOK_URL: ${{ secrets.FEISHU_WEBHOOK_URL }}
          WECHAT_APP_ID: ${{ secrets.WECHAT_APP_ID }}
          WECHAT_APP_SECRET: ${{ secrets.WECHAT_APP_SECRET }}
        run: |
          test -n "$FEISHU_APP_ID"
          test -n "$FEISHU_APP_SECRET"
          umask 077
          wechat_enabled=false
          if [ -n "$WECHAT_APP_ID" ] && [ -n "$WECHAT_APP_SECRET" ]; then wechat_enabled=true; fi
          printf '%s\n' \
            'FEISHU_LOGIN_ENABLED=true' \
            "FEISHU_APP_ID=$FEISHU_APP_ID" \
            "FEISHU_APP_SECRET=$FEISHU_APP_SECRET" \
            "FEISHU_COMMENT_WEBHOOK_URL=$FEISHU_WEBHOOK_URL" \
            'FEISHU_REDIRECT_URI=https://wao.wayuwa.cn/api/auth/feishu/callback' \
            'FEISHU_FRONTEND_URL=https://wao.wayuwa.cn' \
            'AUTH_PROTECTION_ENABLED=true' \
            'AUTH_REGISTRATION_ENABLED=true' \
            'SESSION_COOKIE_SECURE=true' \
            "WECHAT_LOGIN_ENABLED=$wechat_enabled" \
            "WECHAT_APP_ID=$WECHAT_APP_ID" \
            "WECHAT_APP_SECRET=$WECHAT_APP_SECRET" \
            'WECHAT_REDIRECT_URI=https://wao.wayuwa.cn/api/auth/wechat/callback' \
            'WECHAT_FRONTEND_URL=https://wao.wayuwa.cn' > wao-secrets.env
      - name: Configure SSH
        env:
          DEPLOY_KEY: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}
          DEPLOY_SSH_KNOWN_HOSTS: ${{ secrets.DEPLOY_SSH_KNOWN_HOSTS }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$DEPLOY_SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
      - name: Reuse the existing shared vault key
        env:
          MASTER_HOST: ${{ secrets.MASTER_HOST }}
          MASTER_USER: ${{ secrets.MASTER_USER }}
        run: |
          umask 077
          ssh "$MASTER_USER@$MASTER_HOST" 'desktop_dir="$(xdg-user-dir DESKTOP 2>/dev/null || printf "%s" "$HOME/Desktop")"; grep -m1 "^WAO_VAULT_KEY=." "$desktop_dir/deploy/wao/deploy/.env"' > wao-vault.env
          test "$(grep -c '^WAO_VAULT_KEY=.' wao-vault.env)" -eq 1
          cat wao-vault.env >> wao-secrets.env
          rm -f wao-vault.env
      - name: Reuse existing Agent platform configuration
        env:
          MASTER_HOST: ${{ secrets.MASTER_HOST }}
          MASTER_USER: ${{ secrets.MASTER_USER }}
        run: |
          umask 077
          ssh "$MASTER_USER@$MASTER_HOST" 'desktop_dir="$(xdg-user-dir DESKTOP 2>/dev/null || printf "%s" "$HOME/Desktop")"; legacy_env="$desktop_dir/deploy/wao-agent/deploy/.env"; unified_env="$desktop_dir/deploy/wao/deploy/.env.secrets"; if [ -f "$legacy_env" ]; then source_env="$legacy_env"; else source_env="$unified_env"; fi; if [ -f "$source_env" ]; then grep -E "^(AGENT_(CREDENTIAL_KEY|AI_PROVIDER|AI_BASE_URL|AI_API_KEY|AI_MODEL)|DOUYIN_(CLIENT_KEY|CLIENT_SECRET|REDIRECT_URI))=" "$source_env" || true; fi' > wao-agent.env
          if [ -s wao-agent.env ]; then
            cat wao-agent.env >> wao-secrets.env
          else
            echo '::notice title=Agent 私有配置未迁移::旧部署目录和当前统一部署中均没有 Agent 模型或平台配置；对应能力会如实显示为未接入。'
          fi
          rm -f wao-agent.env
      - name: Drain and deploy slave, cloud and master in rolling order
        env:
          MASTER_HOST: ${{ secrets.MASTER_HOST }}
          MASTER_USER: ${{ secrets.MASTER_USER }}
          SLAVE_HOST: ${{ secrets.SLAVE_HOST }}
          SLAVE_USER: ${{ secrets.SLAVE_USER }}
          CLOUD_HOST: ${{ secrets.CLOUD_HOST }}
          CLOUD_USER: ${{ secrets.CLOUD_USER }}
        shell: bash
        run: |
          set -u
          slave_deployed=false
          schema_quiesced=false
          schema_rollout_complete=false
          safe_slave_reachable=false
          safe_schema_rollout=false
          linux_only_schema_rollout=false

          retry_remote() {
            target_label="$1"
            shift
            attempt=1
            while ! "$@"; do
              if [ "$attempt" -ge 4 ]; then
                printf '%s SSH/SCP 连续 %s 次失败，停止重试\n' "$target_label" "$attempt"
                return 1
              fi
              printf '%s SSH/SCP 第 %s 次失败，10 秒后重试\n' "$target_label" "$attempt"
              attempt=$((attempt + 1))
              sleep 10
            done
          }

          deploy_master() {
            retry_remote "Linux 主节点" scp -o ConnectTimeout=15 wao-release.tgz wao-secrets.env \
              "$MASTER_USER@$MASTER_HOST:/tmp/" || return
            # 解压前先清掉上一版源码：tar 只覆盖同名文件，删除 / 改名过的文件会留在节点上，
            # 混进 Docker 构建上下文（V18 撞号那次就是被留下的旧 migration 打挂的）。
            # deploy/ 整个保留：节点私有的 .env / .env.secrets / certs / data 都在里面，
            # 其中被 git 跟踪的文件随即被这次解压整份覆盖。
            # 远程部署失败时 retry_remote 会重跑整条命令；临时 secrets 必须等部署成功后再删，
            # 否则第一次失败后的重试会因为源文件已被删除而永久失败。
            retry_remote "Linux 主节点" ssh -o ConnectTimeout=15 "$MASTER_USER@$MASTER_HOST" 'set -eu; desktop_dir="$(xdg-user-dir DESKTOP 2>/dev/null || printf "%s" "$HOME/Desktop")"; install -d "$desktop_dir/deploy/wao"; find "$desktop_dir/deploy/wao" -mindepth 1 -maxdepth 1 ! -name deploy -exec rm -rf -- {} +; tar -xzf /tmp/wao-release.tgz -C "$desktop_dir/deploy/wao"; install -m 600 /tmp/wao-secrets.env "$desktop_dir/deploy/wao/deploy/.env.secrets"; sh "$desktop_dir/deploy/wao/deploy/scripts/deploy-linux.sh" master; rm -f /tmp/wao-secrets.env'
          }

          deploy_slave() {
            # Windows 会随用户电脑关机，发布前先做一次快速探测。离线不是发布失败：
            # 本次跳过从节点，它上线后由下一次 main 发布自然补齐版本。
            if ! timeout 8s ssh -o BatchMode=yes -o ConnectTimeout=5 -o ConnectionAttempts=1 \
              "$SLAVE_USER@$SLAVE_HOST" 'exit 0'; then
              echo '::notice title=Windows 从节点已跳过::节点当前离线，本次不等待也不部署；上线后随下一次 PR 合并发布。'
              return 0
            fi

            release_suffix="${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
            remote_release="wao-release-${release_suffix}.zip"
            remote_secrets="wao-secrets-${release_suffix}.env"
            remote_installer="install-release-windows-${release_suffix}.ps1"
            retry_remote "Windows 从节点" scp -o ConnectTimeout=15 wao-release.zip "$SLAVE_USER@$SLAVE_HOST:D:/deploy/$remote_release" || return
            retry_remote "Windows 从节点" scp -o ConnectTimeout=15 wao-secrets.env "$SLAVE_USER@$SLAVE_HOST:D:/deploy/$remote_secrets" || return
            retry_remote "Windows 从节点" scp -o ConnectTimeout=15 deploy/scripts/install-release-windows.ps1 "$SLAVE_USER@$SLAVE_HOST:D:/deploy/$remote_installer" || return
            retry_remote "Windows 从节点" ssh -o ConnectTimeout=15 "$SLAVE_USER@$SLAVE_HOST" 'exit 0' || return
            retry_remote "Windows 从节点" ssh -o ConnectTimeout=15 "$SLAVE_USER@$SLAVE_HOST" "powershell.exe -NoProfile -ExecutionPolicy Bypass -File D:\\deploy\\$remote_installer -ArchivePath D:\\deploy\\$remote_release -PrivateEnvPath D:\\deploy\\$remote_secrets" || return
            slave_deployed=true
          }

          prepare_cloud_routing() {
            retry_remote "云前端路由" scp -o ConnectTimeout=15 \
              deploy/nginx/wao.wayuwa.cn.conf.template \
              deploy/scripts/activate-nginx-config.sh deploy/scripts/render-nginx-config.sh \
              deploy/scripts/set-nginx-upstream-state.sh \
              "$CLOUD_USER@$CLOUD_HOST:/tmp/" || return
            retry_remote "云前端路由" ssh -o ConnectTimeout=15 "$CLOUD_USER@$CLOUD_HOST" '
              set -eu
              install -d -m 0755 /opt/wao/deploy/nginx /opt/wao/deploy/scripts
              install -m 0644 /tmp/wao.wayuwa.cn.conf.template /opt/wao/deploy/nginx/wao.wayuwa.cn.conf.template
              install -m 0755 /tmp/activate-nginx-config.sh /opt/wao/deploy/scripts/activate-nginx-config.sh
              install -m 0755 /tmp/render-nginx-config.sh /opt/wao/deploy/scripts/render-nginx-config.sh
              install -m 0755 /tmp/set-nginx-upstream-state.sh /opt/wao/deploy/scripts/set-nginx-upstream-state.sh
              # 新主配置已经接管 /game 与 /insight；首次摘流也会渲染它，必须先移除旧片段，
              # 否则 nginx -t 会因 duplicate location 拒绝摘流，永远到不了 deploy_cloud 的清理步骤。
              install -d -m 0755 /etc/nginx/wao-external-apps.d
              rm -f /etc/nginx/wao-external-apps.d/wao-game.conf \
                /etc/nginx/wao-external-apps.d/wao-insight.conf
            '
          }

          deploy_cloud() {
            resolve_ipv4() {
              getent ahostsv4 "$1" | awk '$2 == "STREAM" { print $1; exit }'
            }
            master_gateway_ipv4="$(resolve_ipv4 "$MASTER_HOST")"
            slave_gateway_ipv4="$(resolve_ipv4 "$SLAVE_HOST")"
            test -n "$master_gateway_ipv4"
            test -n "$slave_gateway_ipv4"
            MASTER_GATEWAY_IPV4="$master_gateway_ipv4" SLAVE_GATEWAY_IPV4="$slave_gateway_ipv4" \
              WAO_NGINX_RENDER_OUTPUT=wao-nginx.conf sh deploy/scripts/render-nginx-config.sh
            retry_remote "云前端" ssh -o ConnectTimeout=15 "$CLOUD_USER@$CLOUD_HOST" '
              set -eu
              install -d /tmp/wao-dist /tmp/wao-agent-dist
              find /tmp/wao-dist -mindepth 1 -maxdepth 1 -exec rm -rf -- {} +
              find /tmp/wao-agent-dist -mindepth 1 -maxdepth 1 -exec rm -rf -- {} +
            ' || return
            retry_remote "云前端" scp -o ConnectTimeout=15 -r wao-web/dist/. "$CLOUD_USER@$CLOUD_HOST:/tmp/wao-dist/" || return
            retry_remote "云前端" scp -o ConnectTimeout=15 -r agent-web/dist/. "$CLOUD_USER@$CLOUD_HOST:/tmp/wao-agent-dist/" || return
            retry_remote "云前端" scp -o ConnectTimeout=15 wao-nginx.conf "$CLOUD_USER@$CLOUD_HOST:/tmp/wao-nginx.conf" || return
            retry_remote "云前端" scp -o ConnectTimeout=15 \
              deploy/nginx/wao.wayuwa.cn.conf.template \
              deploy/scripts/activate-nginx-config.sh deploy/scripts/render-nginx-config.sh \
              deploy/scripts/set-nginx-upstream-state.sh \
              "$CLOUD_USER@$CLOUD_HOST:/tmp/" || return
            retry_remote "云前端" ssh -o ConnectTimeout=15 "$CLOUD_USER@$CLOUD_HOST" '
              set -eu
              final=/etc/nginx/conf.d/wao.wayuwa.cn.conf
              previous="$(mktemp)"
              retired_routes_backup="$(mktemp -d)"
              cp "$final" "$previous"
              # 真正独立的第三方应用继续使用此目录；已经并入或取消的内部应用精确退役。
              install -d -m 0755 /etc/nginx/wao-external-apps.d
              for route in wao-game.conf wao-insight.conf; do
                if [ -f "/etc/nginx/wao-external-apps.d/$route" ]; then
                  cp "/etc/nginx/wao-external-apps.d/$route" "$retired_routes_backup/$route"
                fi
              done
              rm -f /etc/nginx/wao-external-apps.d/wao-game.conf /etc/nginx/wao-external-apps.d/wao-insight.conf
              install -m 0644 /tmp/wao-nginx.conf "$final"
              if ! nginx -t; then
                cp "$previous" "$final"
                for route in "$retired_routes_backup"/*; do
                  [ -f "$route" ] || continue
                  cp "$route" /etc/nginx/wao-external-apps.d/
                done
                rm -f "$retired_routes_backup/wao-game.conf" "$retired_routes_backup/wao-insight.conf"
                rmdir "$retired_routes_backup"
                rm -f "$previous" /tmp/wao-nginx.conf
                nginx -t
                exit 1
              fi
              rm -f "$retired_routes_backup/wao-game.conf" "$retired_routes_backup/wao-insight.conf"
              rmdir "$retired_routes_backup"
              rm -f "$previous" /tmp/wao-nginx.conf
              install -d -m 0755 /opt/wao/deploy/nginx /opt/wao/deploy/scripts
              install -m 0644 /tmp/wao.wayuwa.cn.conf.template /opt/wao/deploy/nginx/wao.wayuwa.cn.conf.template
              install -m 0755 /tmp/activate-nginx-config.sh /opt/wao/deploy/scripts/activate-nginx-config.sh
              install -m 0755 /tmp/render-nginx-config.sh /opt/wao/deploy/scripts/render-nginx-config.sh
              install -m 0755 /tmp/set-nginx-upstream-state.sh /opt/wao/deploy/scripts/set-nginx-upstream-state.sh
              rm -f /tmp/wao.wayuwa.cn.conf.template /tmp/activate-nginx-config.sh \
                /tmp/render-nginx-config.sh /tmp/set-nginx-upstream-state.sh
              printf "%s\n" \
                "SHELL=/bin/sh" \
                "PATH=/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin" \
                "* * * * * root /opt/wao/deploy/scripts/activate-nginx-config.sh >/dev/null 2>&1" \
                >/etc/cron.d/wao-nginx-ddns-reload
              chmod 0644 /etc/cron.d/wao-nginx-ddns-reload
              install -d /var/www/wao/dist
              find /var/www/wao/dist -mindepth 1 -maxdepth 1 -exec rm -rf -- {} +
              cp -a /tmp/wao-dist/. /var/www/wao/dist/
              install -d /var/www/wao-agent/dist
              find /var/www/wao-agent/dist -mindepth 1 -maxdepth 1 -exec rm -rf -- {} +
              cp -a /tmp/wao-agent-dist/. /var/www/wao-agent/dist/
              systemctl reload nginx
              for legacy_dist in /var/www/wao-game/dist /var/www/wao-insight/dist; do
                if [ -d "$legacy_dist" ]; then
                  find "$legacy_dist" -mindepth 1 -maxdepth 1 -exec rm -rf -- {} +
                fi
              done
            '
          }

          gateway_ready_from_cloud() {
            gateway_host="$1"
            ssh -o ConnectTimeout=15 "$CLOUD_USER@$CLOUD_HOST" \
              "curl -4 -kfsS --max-time 8 https://$gateway_host:9000/api/hello | grep -q '\"code\":0'"
          }

          set_upstream_state() {
            node="$1"
            state="$2"
            retry_remote "云前端路由" ssh -o ConnectTimeout=15 "$CLOUD_USER@$CLOUD_HOST" \
              "/opt/wao/deploy/scripts/set-nginx-upstream-state.sh $node $state"
          }

          quiesce_master() {
            action="$1"
            retry_remote "Linux 主节点" ssh -o ConnectTimeout=15 "$MASTER_USER@$MASTER_HOST" \
              "sh /tmp/wao-quiesce-server.sh master $action"
          }

          quiesce_slave() {
            action="$1"
            retry_remote "Windows 从节点" ssh -o ConnectTimeout=15 "$SLAVE_USER@$SLAVE_HOST" \
              "powershell.exe -NoProfile -ExecutionPolicy Bypass -File D:\\deploy\\wao-quiesce-server.ps1 -Action $action"
          }

          restore_upstreams() {
            if [ "$schema_quiesced" = true ] && [ "$schema_rollout_complete" != true ] && \
                [ "$linux_only_schema_rollout" != true ]; then
              if [ "$slave_deployed" = true ]; then
                set_upstream_state slave up >/dev/null 2>&1 || true
              else
                set_upstream_state slave down >/dev/null 2>&1 || true
              fi
              set_upstream_state master down >/dev/null 2>&1 || true
              return
            fi
            if [ "$slave_deployed" = true ]; then
              set_upstream_state slave up >/dev/null 2>&1 || true
            else
              set_upstream_state slave down >/dev/null 2>&1 || true
            fi
            set_upstream_state master up >/dev/null 2>&1 || true
          }

          # 是否需要 V77 维护窗口以主库持久状态为准，不依赖单次 push 的文件列表。
          # 这样 workflow_dispatch、失败重跑或人工取消后的下一次部署都会继续 fail-closed 流程。
          retry_remote "Linux 主节点" scp -o ConnectTimeout=15 \
            deploy/scripts/quiesce-wao-server.sh \
            "$MASTER_USER@$MASTER_HOST:/tmp/wao-quiesce-server.sh" || exit 1
          rollout_status_output="$(quiesce_master rollout-status)" || exit 1
          rollout_status="$(printf '%s\n' "$rollout_status_output" | tr -d '\r' | tail -n 1)"
          case "$rollout_status" in
            complete) safe_schema_rollout=false ;;
            required) safe_schema_rollout=true ;;
            *) printf '无法识别 V77 发布状态：%s\n' "$rollout_status"; exit 1 ;;
          esac

          if ! prepare_cloud_routing >routing.log 2>&1; then
            printf '\n===== cloud routing =====\n'; cat routing.log
            exit 1
          fi

          trap restore_upstreams EXIT

          # V77 首次引入带版本的飞书归档写入。旧二进制不认识新栅栏，因此该次 push
          # 用一次性维护窗口：先暂停定时同步、摘流并停掉所有在线旧 server，再允许新节点执行 migration。
          # Windows 离线时保持 slave down 与同步暂停，但继续交付 Linux；详见 ADR-092。
          if [ "$safe_schema_rollout" = true ]; then
            echo '::notice title=V77 安全升级::暂停飞书定时同步并停止旧版 API 节点后再执行 migration。'
            if ! set_upstream_state slave down || ! set_upstream_state master down; then
              echo '无法为 V77 建立全量摘流窗口。'
              exit 1
            fi
            if timeout 8s ssh -o BatchMode=yes -o ConnectTimeout=5 -o ConnectionAttempts=1 \
                "$SLAVE_USER@$SLAVE_HOST" 'exit 0'; then
              safe_slave_reachable=true
              retry_remote "Windows 从节点" scp -o ConnectTimeout=15 \
                deploy/scripts/quiesce-wao-server.sh \
                "$SLAVE_USER@$SLAVE_HOST:D:/deploy/wao-quiesce-server.sh" || exit 1
              retry_remote "Windows 从节点" scp -o ConnectTimeout=15 \
                deploy/scripts/quiesce-wao-server-windows.ps1 \
                "$SLAVE_USER@$SLAVE_HOST:D:/deploy/wao-quiesce-server.ps1" || exit 1
            else
              echo '::notice title=Windows 从节点离线::保持 slave 摘流，本次继续升级云前端和 Linux 主节点；从节点上线后由下次发布补齐。'
            fi
            if ! quiesce_master pause-feishu-sync; then
              echo '无法暂停飞书定时同步，V77 未开始。'
              exit 1
            fi
            if [ "$safe_slave_reachable" = true ] && ! quiesce_slave stop; then
              quiesce_master restore-feishu-sync || true
              echo '无法停止 Windows 旧版 server，V77 未开始。'
              exit 1
            fi
            if ! quiesce_master stop; then
              if [ "$safe_slave_reachable" = true ]; then quiesce_slave start || true; fi
              quiesce_master restore-feishu-sync || true
              echo '无法停止 Linux 旧版 server，V77 未开始。'
              exit 1
            fi
            schema_quiesced=true
          fi

          if gateway_ready_from_cloud "$SLAVE_HOST"; then
            if ! set_upstream_state slave down; then
              printf '云端未能摘流 Windows 从节点，本次不冒险重启从节点。\n' >slave.log
              printf '\n===== slave =====\n'; cat slave.log
              exit 1
            fi
          else
            echo '::notice title=Windows 从节点未摘流::节点发布前不健康，不在 Nginx 中额外标记 down。'
          fi
          if ! deploy_slave >slave.log 2>&1; then
            if [ "$safe_schema_rollout" = true ]; then
              quiesce_slave stop || true
              set_upstream_state slave down || true
              printf '\n===== slave =====\n'; cat slave.log
              echo 'V77 维护窗口中的 Windows 从节点升级失败；保持旧节点停止、定时同步暂停，等待下次部署继续。'
              exit 1
            fi
            echo '::warning title=Windows 从节点已隔离::节点发布失败并保持 down；本次继续发布云前端和 Linux 主节点，修复 WSL 后由下次发布补齐。'
            if [ "$safe_schema_rollout" = true ] && [ "$safe_slave_reachable" = true ]; then
              quiesce_slave stop || exit 1
            fi
            if ! set_upstream_state slave down; then
              printf '\n===== slave =====\n'; cat slave.log
              exit 1
            fi
          elif [ "$slave_deployed" = true ]; then
            if ! set_upstream_state slave up; then
              printf '\n===== slave =====\n'; cat slave.log
              exit 1
            fi
          elif ! set_upstream_state slave down; then
            printf '\n===== slave =====\n'; cat slave.log
            exit 1
          fi
          printf '\n===== slave =====\n'; cat slave.log

          if ! deploy_cloud >cloud.log 2>&1; then
            printf '\n===== cloud =====\n'; cat cloud.log
            exit 1
          fi
          printf '\n===== cloud =====\n'; cat cloud.log
          if [ "$slave_deployed" != true ] && ! set_upstream_state slave down; then
            echo '云前端发布后未能继续隔离 Windows 从节点。'
            exit 1
          fi

          if [ "$safe_schema_rollout" = true ]; then
            set_upstream_state master down || exit 1
          elif [ "$slave_deployed" = true ] && gateway_ready_from_cloud "$SLAVE_HOST"; then
            if ! set_upstream_state master down; then
              echo '云端未能摘流 Linux 主节点，本次不冒险重启主节点。' >master.log
              printf '\n===== master =====\n'; cat master.log
              exit 1
            fi
          else
            echo '::notice title=Linux 主节点未摘流::Windows 从节点当前不健康，保留主节点路由以避免主动制造全站中断。'
          fi
          if ! deploy_master >master.log 2>&1; then
            if [ "$safe_schema_rollout" = true ]; then
              quiesce_master stop || true
              set_upstream_state master down || true
            else
              set_upstream_state master up || true
            fi
            printf '\n===== master =====\n'; cat master.log
            exit 1
          fi
          if [ "$safe_schema_rollout" = true ]; then
            if [ "$safe_slave_reachable" = true ]; then
              if ! quiesce_master complete-v77-rollout; then
                echo 'V77 已安全部署，但飞书定时同步原状态恢复失败，保持暂停并等待人工处理。'
                exit 1
              fi
              completed_status_output="$(quiesce_master rollout-status)" || exit 1
              completed_status="$(printf '%s\n' "$completed_status_output" | tr -d '\r' | tail -n 1)"
              if [ "$completed_status" != complete ]; then
                echo 'V77 完成标记复核失败，保持全部节点摘流并等待下次部署继续。'
                exit 1
              fi
              schema_rollout_complete=true
            else
              linux_only_schema_rollout=true
              echo '::warning title=Linux 已单节点完成::Windows 从节点继续保持 down；V77 标记和飞书同步保持暂停，待从节点上线后补齐。'
            fi
          fi
          if ! set_upstream_state master up; then
            printf '\n===== master =====\n'; cat master.log
            exit 1
          fi

          trap - EXIT
          restore_upstreams
          printf '\n===== master =====\n'; cat master.log
      - name: Verify production and Feishu entry point
        run: |
          hello="$(curl --fail --silent --show-error --retry 6 --retry-delay 5 --retry-all-errors https://wao.wayuwa.cn/api/hello)"
          printf '%s' "$hello" | grep -q '"code":0'
          printf '%s' "$hello" | grep -q '"service":"wao-server"'
          agent_health="$(curl --fail --silent --show-error --retry 6 --retry-delay 5 --retry-all-errors https://wao.wayuwa.cn/api/agent/health)"
          printf '%s' "$agent_health" | grep -q '"status":"UP"'
          curl --fail --silent --show-error --retry 6 --retry-delay 5 --retry-all-errors \
            https://wao.wayuwa.cn/agent/ | grep -q 'id="app"'
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' https://wao.wayuwa.cn/game/)" = '308'
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' https://wao.wayuwa.cn/insight/)" = '410'
          ai_read_route="$(curl --silent --show-error --head https://wao.wayuwa.cn/api/ai/workflows \
            | tr -d '\r' | awk -F ': ' 'tolower($1) == "x-wao-api-route" {print $2}')"
          test "$ai_read_route" = 'dual-gateway-ai'
          goal_route="$(curl --silent --show-error --head https://wao.wayuwa.cn/api/ai/goals \
            | tr -d '\r' | awk -F ': ' 'tolower($1) == "x-wao-api-route" {print $2}')"
          test "$goal_route" = 'dual-gateway-ai'
          ai_write_route="$(curl --silent --show-error --head https://wao.wayuwa.cn/api/settings/ai-accounts \
            | tr -d '\r' | awk -F ': ' 'tolower($1) == "x-wao-api-route" {print $2}')"
          test "$ai_write_route" = 'linux-vpn-master'
          credential_route="$(curl --silent --show-error --head https://wao.wayuwa.cn/api/ai/runner/accounts \
            | tr -d '\r' | awk -F ': ' 'tolower($1) == "x-wao-api-route" {print $2}')"
          test "$credential_route" = 'linux-vpn-master'
          assistant_claim_route="$(curl --silent --show-error --head https://wao.wayuwa.cn/api/ai/runner/assistant-v2/claim \
            | tr -d '\r' | awk -F ': ' 'tolower($1) == "x-wao-api-route" {print $2}')"
          test "$assistant_claim_route" = 'linux-vpn-master'
          tianren_route="$(curl --silent --show-error --head https://wao.wayuwa.cn/api/tianren/readings/today/interpret/stream \
            | tr -d '\r' | awk -F ': ' 'tolower($1) == "x-wao-api-route" {print $2}')"
          test "$tianren_route" = 'linux-vpn-master'
          for probe in 1 2 3 4 5 6 7 8; do
            feishu="$(curl --fail --silent --show-error --retry 6 --retry-delay 5 --retry-all-errors "https://wao.wayuwa.cn/api/auth/feishu/authorize?scene=authorization&probe=$probe")"
            printf '%s' "$feishu" | grep -q '"code":0'
            printf '%s' "$feishu" | grep -q 'https://open.feishu.cn/open-apis/authen/v1/authorize'
          done
      # Codex 出口只影响 AI 账号登录 / 令牌刷新，属于主节点网络环境问题，不代表这次发布的产物有问题。
      # 探针失败降级为告警：流水线继续，主节点 VPN 掉了仍然能在 run 摘要里看到。
      - name: Probe Codex egress on Linux master (non-blocking)
        continue-on-error: true
        env:
          MASTER_HOST: ${{ secrets.MASTER_HOST }}
          MASTER_USER: ${{ secrets.MASTER_USER }}
        run: |
          if ! ssh "$MASTER_USER@$MASTER_HOST" 'set -eu; desktop_dir="$(xdg-user-dir DESKTOP 2>/dev/null || printf "%s" "$HOME/Desktop")"; sh "$desktop_dir/deploy/wao/deploy/scripts/probe-codex-egress.sh"'; then
            echo '::warning title=Codex 出站探针失败::Linux 主节点 wao-server 容器无法直连 OpenAI，Codex 登录与令牌刷新会失败，请检查主节点 VPN 出口是否被容器继承。本次部署未因此中断。'
            exit 1
          fi

  notify:
    name: Feishu deployment notification
    runs-on: ubuntu-latest
    if: always()
    needs: [deploy]
    env:
      FEISHU_WEBHOOK_URL: ${{ secrets.FEISHU_WEBHOOK_URL }}
      DEPLOY_RESULT: ${{ needs.deploy.result }}
    steps:
      - name: Notify Feishu
        if: env.FEISHU_WEBHOOK_URL != ''
        env:
          REPOSITORY: ${{ github.repository }}
          ACTOR: ${{ github.actor }}
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          COMMIT_SHA: ${{ github.sha }}
          COMMIT_MSG: ${{ github.event.head_commit.message || '手动部署当前 main' }}
          COMMIT_URL: ${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          overall='✅ 成功'
          header_color='green'
          if [ "$DEPLOY_RESULT" != 'success' ]; then
            overall='❌ 失败'
            header_color='red'
          fi
          short_sha="$(printf '%s' "$COMMIT_SHA" | cut -c1-8)"
          change_summary="${COMMIT_MSG:-（无提交信息）}"
          if [ "${#change_summary}" -gt 1800 ]; then
            change_summary="$(printf '%s' "$change_summary" | cut -c1-1800)…"
          fi
          payload="$(jq -n \
            --arg title "WAO 部署 ${overall}" \
            --arg template "$header_color" \
            --arg repo "$REPOSITORY" \
            --arg branch "$REF_NAME" \
            --arg trigger "${ACTOR} / ${EVENT_NAME}" \
            --arg sha "$short_sha" \
            --arg sha_url "$COMMIT_URL" \
            --arg change "$change_summary" \
            --arg deploy "$DEPLOY_RESULT" \
            --arg run_url "$RUN_URL" \
            '{
              msg_type: "interactive",
              card: {
                config: { wide_screen_mode: true },
                header: { template: $template, title: { tag: "plain_text", content: $title } },
                elements: [
                  { tag: "div", fields: [
                    { is_short: true, text: { tag: "lark_md", content: ("**仓库**\n" + $repo) } },
                    { is_short: true, text: { tag: "lark_md", content: ("**分支**\n" + $branch) } },
                    { is_short: true, text: { tag: "lark_md", content: ("**触发**\n" + $trigger) } },
                    { is_short: true, text: { tag: "lark_md", content: ("**提交**\n[" + $sha + "](" + $sha_url + ")") } }
                  ] },
                  { tag: "hr" },
                  { tag: "div", text: { tag: "lark_md", content: ("**本次改动**\n" + $change) } },
                  { tag: "hr" },
                  { tag: "div", text: { tag: "lark_md", content: ("**部署结果**\n" + $deploy) } },
                  { tag: "action", actions: [
                    { tag: "button", text: { tag: "plain_text", content: "查看运行详情" }, url: $run_url, type: "primary" }
                  ] }
                ]
              }
            }')"
          response="$(curl --fail --silent --show-error -X POST "$FEISHU_WEBHOOK_URL" -H 'Content-Type: application/json' --data "$payload")"
          printf '%s' "$response" | jq -e '(.code // .StatusCode // 0) == 0' >/dev/null
