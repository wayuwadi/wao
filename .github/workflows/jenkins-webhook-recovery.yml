name: Jenkins Webhook Recovery

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  recover-cloud-route:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Configure deployment SSH key
        env:
          DEPLOY_SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}
          DEPLOY_SSH_KNOWN_HOSTS: ${{ secrets.DEPLOY_SSH_KNOWN_HOSTS }}
        run: |
          set -eu
          install -d -m 0700 "$HOME/.ssh"
          install -m 0600 /dev/null "$HOME/.ssh/id_ed25519"
          printf '%s\n' "$DEPLOY_SSH_PRIVATE_KEY" >"$HOME/.ssh/id_ed25519"
          printf '%s\n' "$DEPLOY_SSH_KNOWN_HOSTS" >"$HOME/.ssh/known_hosts"

      - name: Extend the one-time legacy webhook fallback
        env:
          CLOUD_HOST: ${{ secrets.CLOUD_HOST }}
          CLOUD_USER: ${{ secrets.CLOUD_USER }}
        run: |
          set -eu
          ssh -o BatchMode=yes -o ConnectTimeout=15 "$CLOUD_USER@$CLOUD_HOST" '
            set -eu
            config=/etc/nginx/conf.d/wao.wayuwa.cn.conf
            run_root() {
              if [ "$(id -u)" -eq 0 ]; then "$@"; else sudo -n "$@"; fi
            }
            run_root grep -Fq "error_page 404 = @legacy_jenkins_webhook;" "$config"
            run_root sed -i \
              "s/error_page 404 = @legacy_jenkins_webhook;/error_page 403 404 = @legacy_jenkins_webhook;/" \
              "$config"
            run_root nginx -t
            run_root systemctl reload nginx
            run_root grep -Fq "error_page 403 404 = @legacy_jenkins_webhook;" "$config"
          '
