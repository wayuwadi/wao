server:
  port: ${SERVER_PORT:8080}
  forward-headers-strategy: framework
  servlet:
    session:
      timeout: 30d
      cookie:
        name: WAO_SESSION
        http-only: true
        secure: ${SESSION_COOKIE_SECURE:false}
        same-site: lax
        # 持久 Cookie 与服务端会话同寿命，关闭手机浏览器或主屏幕应用后不要求次日重登。
        max-age: 30d

spring:
  application:
    name: wao-server
  profiles:
    default: dev
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:127.0.0.1}:${MYSQL_PORT:3306}/${DB_NAME:wao}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: ${DB_USER:wao_app}
    password: ${DB_PASS:dev-password}
    driver-class-name: com.mysql.cj.jdbc.Driver
  servlet:
    multipart:
      # 部署请求体基线为 1GiB；普通文件业务上限 200MiB，图床仍为 10MiB
      max-file-size: 1GB
      max-request-size: 1030MB
  jackson:
    time-zone: Asia/Shanghai
    parser:
      # 聊天复盘等严格 JSON 入口不允许重复键被“后值覆盖前值”。
      strict-duplicate-detection: true
    deserialization:
      # 拒绝首个 JSON 根值之后追加的第二个对象或其他 token。
      fail-on-trailing-tokens: true
  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASS:}
      timeout: 3s
  flyway:
    # 并行新增迁移可低于当前最大版本，默认校验和校验保持有效。
    out-of-order: true
    enabled: ${FLYWAY_ENABLED:true}
    locations: classpath:db/migration
    baseline-on-migrate: true
  session:
    store-type: jdbc
    jdbc:
      initialize-schema: never
  cloud:
    nacos:
      discovery:
        enabled: ${NACOS_DISCOVERY_ENABLED:true}
        server-addr: ${NACOS_SERVER_ADDR:127.0.0.1:8848}
        username: ${NACOS_USERNAME:nacos}
        password: ${NACOS_PASSWORD:nacos}
        ip: ${NACOS_DISCOVERY_IP:}
        port: ${SERVER_PORT:8080}

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true

wao:
  codex-quota:
    enabled: ${WAO_CODEX_QUOTA_ENABLED:false}
    executable: ${WAO_CODEX_QUOTA_EXECUTABLE:codex}
    source: ${WAO_CODEX_QUOTA_SOURCE:local}
  storage:
    mode: ${WAO_STORAGE_MODE:mysql}
    retain-mysql: ${WAO_STORAGE_RETAIN_MYSQL:true}
    endpoint: ${WAO_STORAGE_ENDPOINT:}
    region: ${WAO_STORAGE_REGION:garage}
    bucket: ${WAO_STORAGE_BUCKET:}
    access-key: ${WAO_STORAGE_ACCESS_KEY:}
    secret-key: ${WAO_STORAGE_SECRET_KEY:}
  edge:
    session-enabled: ${WAO_EDGE_SESSION_ENABLED:false}
  system-report:
    # 确定性系统报告只由 Linux 主节点按数据库共享设置刷新；其它节点仍可读、保存设置和手动补齐。
    scheduler-enabled: ${WAO_SYSTEM_REPORT_SCHEDULER_ENABLED:false}
  chat-review:
    # 共享聊天复盘由所有 API 节点候选执行，数据库租约保证唯一抢占。
    # 回退时可设 WAO_CHAT_REVIEW_PROCESSING_ENABLED=false 停止新的后台推进，已归档和报告不删除。
    processing-enabled: ${WAO_CHAT_REVIEW_PROCESSING_ENABLED:true}
  ai:
    read-only:
      # 非阻塞内部任务允许等待 Runner 上线；领取后改按实际执行时间独立计时。
      queued-timeout: ${WAO_AI_READ_ONLY_QUEUED_TIMEOUT:60m}
      running-timeout: ${WAO_AI_READ_ONLY_RUNNING_TIMEOUT:30m}
      cleanup-enabled: ${WAO_AI_READ_ONLY_CLEANUP_ENABLED:true}
    evolution:
      # 额度同步必须从具备受控出口的 Linux 主节点发起；其它节点保持关闭。
      scheduler-enabled: ${WAO_AI_EVOLUTION_SCHEDULER_ENABLED:false}
    task-auto-run:
      # 最早待办只由 Linux 主节点轮询；数据库检查窗口仍阻止误配时重复派发。
      scheduler-enabled: ${WAO_AI_TASK_AUTO_RUN_SCHEDULER_ENABLED:false}
    # 首页每日建议只由 Linux 主节点预热，避免双节点重复占用本地 Codex。
    daily-guidance-warmup-enabled: ${WAO_DAILY_GUIDANCE_WARMUP_ENABLED:false}
    # 周/月/年回顾只由 Linux 主节点补齐，避免双节点重复生成同一周期。
    life-review-scheduler-enabled: ${WAO_LIFE_REVIEW_SCHEDULER_ENABLED:false}
  share:
    # 分享 Markdown 里图片的绝对地址前缀。留空则按当前请求推导（依赖 Nginx 透传
    # X-Forwarded-Proto / Host）；代理层不透传时在此写死，如 https://wao.wayuwa.cn
    base-url: ${WAO_SHARE_BASE_URL:}
  auth:
    protection-enabled: ${AUTH_PROTECTION_ENABLED:true}
    registration-enabled: ${AUTH_REGISTRATION_ENABLED:true}
    jumpserver:
      enabled: ${JUMPSERVER_SSO_ENABLED:false}
      shared-secret: ${JUMPSERVER_SSO_SHARED_SECRET:}
      login-url: ${JUMPSERVER_SSO_LOGIN_URL:https://jms.wayuwa.cn/api/v1/authentication/custom-sso/login/}
      ticket-ttl: ${JUMPSERVER_SSO_TICKET_TTL:45s}
  vault:
    # base64 编码的 32 字节 AES-256 密钥；生产环境必须通过环境变量 WAO_VAULT_KEY 覆盖，
    # 下面的默认值只用于本地 / dev 演示环境，不是真实密钥。
    encryption-key: ${WAO_VAULT_KEY:ZKp9ywcbuZOrQCrxx2kd+0N9VJfnzRNSQQZXMP/vXVw=}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

feishu:
  comment-webhook-url: ${FEISHU_COMMENT_WEBHOOK_URL:}
  login:
    enabled: ${FEISHU_LOGIN_ENABLED:false}
    app-id: ${FEISHU_APP_ID:}
    app-secret: ${FEISHU_APP_SECRET:}
    redirect-uri: ${FEISHU_REDIRECT_URI:http://localhost:8080/api/auth/feishu/callback}
    frontend-url: ${FEISHU_FRONTEND_URL:http://localhost:5173}
    open-api-base-url: ${FEISHU_OPEN_API_BASE_URL:https://open.feishu.cn}
