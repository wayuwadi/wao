server:
  compression:
    # Compress at the application before crossing the home-node/cloud link.
    # SSE, images and downloads keep their existing streaming/binary behavior.
    enabled: true
    min-response-size: 2KB
    mime-types: application/json,text/plain,text/markdown

spring:
  data:
    redis:
      sentinel:
        master: ${REDIS_MASTER_NAME:wao-master}
        nodes: ${REDIS_SENTINEL_NODES}
        password: ${REDIS_PASS}
      password: ${REDIS_PASS}
  cloud:
    nacos:
      discovery:
        namespace: ${NACOS_NAMESPACE:public}

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

logging:
  level:
    root: INFO
