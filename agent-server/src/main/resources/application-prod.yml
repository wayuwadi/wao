spring:
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:127.0.0.1}:${MYSQL_PORT:3306}/${DB_NAME:wao}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: ${DB_USER:wao_app}
    password: ${DB_PASS}
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    # WAO schema 已非空；以 0 建基线后仍要执行 Agent 的 V1。
    baseline-version: 0
    table: flyway_agent_schema_history
  sql:
    init:
      mode: never

wao-agent:
  shared-session:
    local-account-id: ""
  media:
    dir: ${AGENT_MEDIA_DIR:/var/lib/wao-agent/media}
  platform:
    douyin:
      redirect-uri: ${DOUYIN_REDIRECT_URI:https://wao.wayuwa.cn/api/agent/platforms/DOUYIN/callback}
