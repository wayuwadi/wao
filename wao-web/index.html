<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8">
    <script>
      // 分享页面在加载应用和外部配图之前关闭收录与来源地址传递。
      if (location.pathname.startsWith('/s/')) {
        for (const [name, content] of [['robots', 'noindex, nofollow, noarchive'], ['referrer', 'no-referrer']]) {
          const meta = document.createElement('meta')
          meta.name = name
          meta.content = content
          document.head.appendChild(meta)
        }
      }
    </script>
    <link rel="icon" type="image/png" sizes="64x64" href="/brand/wao-soft-loop-64-v4.png">
    <link rel="icon" type="image/svg+xml" sizes="any" href="/brand/wao-soft-loop-small-v4.svg">
    <link rel="apple-touch-icon" sizes="180x180" href="/brand/wao-soft-loop-180-v4.png">
    <link rel="manifest" href="/manifest.webmanifest">
    <meta name="theme-color" content="#5665e9">
    <meta name="application-name" content="WAO">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="WAO">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="format-detection" content="telephone=no">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>WAO Life OS</title>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
