name: wao-slave

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "20m"
    max-file: "5"

services:
  mysql-slave:
    image: mysql:9.7.0
    restart: unless-stopped
    command:
      - --server-id=2
      - --bind-address=0.0.0.0
      - --relay-log=relay-bin
      - --log-replica-updates=ON
      - --gtid-mode=ON
      - --enforce-gtid-consistency=ON
      - --replicate-wild-do-table=wao.%
      - --skip-name-resolve
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
      - --max-allowed-packet=1G
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASS}
      MYSQL_SOURCE_HOST: ${MASTER_PUBLIC_HOST:-linux2.wayuwa.cn}
      MYSQL_REPLICATION_USER: ${MYSQL_REPLICATION_USER:-wao_repl}
      MYSQL_REPLICATION_PASSWORD: ${MYSQL_REPLICATION_PASSWORD}
      DB_NAME: ${DB_NAME:-wao}
      TZ: Asia/Shanghai
    volumes:
      - mysql-slave-data:/var/lib/mysql
      - ./mysql/init-slave.sh:/docker-entrypoint-initdb.d/10-replication.sh:ro
      - ./scripts/backup-mysql.sh:/opt/wao/backup-mysql.sh:ro
      - ./scripts/restore-drill.sh:/opt/wao/restore-drill.sh:ro
      - ./backups:/backups
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "MYSQL_PWD=$$MYSQL_ROOT_PASSWORD mysql --protocol=socket -N -uroot -e 'SELECT 1'",
        ]
      interval: 10s
      timeout: 5s
      retries: 20
    deploy:
      resources:
        limits:
          cpus: "4.0"
          memory: 6G
    logging: *default-logging
    networks: [wao]

  redis-slave:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    environment:
      REDIS_MASTER_HOST: ${MASTER_PUBLIC_HOST:-linux2.wayuwa.cn}
      REDIS_PASS: ${REDIS_PASS}
      REDIS_REPLICA_ANNOUNCE_HOST: ${SLAVE_PUBLIC_HOST:-linux1.wayuwa.cn}
    command:
      - /bin/sh
      - -ec
      - exec redis-server /usr/local/etc/redis/redis.conf --replicaof "$$REDIS_MASTER_HOST" 6379 --masterauth "$$REDIS_PASS" --requirepass "$$REDIS_PASS" --replica-announce-ip "$$REDIS_REPLICA_ANNOUNCE_HOST" --replica-announce-port 6379
    volumes:
      - redis-slave-data:/data
      - ./redis/slave.conf:/usr/local/etc/redis/redis.conf:ro
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a $$REDIS_PASS ping | grep PONG"]
      interval: 10s
      timeout: 3s
      retries: 15
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2G
    logging: *default-logging
    networks: [wao]

  sentinel-slave:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "26379:26379"
    environment:
      REDIS_MASTER_HOST: ${MASTER_PUBLIC_HOST:-linux2.wayuwa.cn}
      REDIS_MASTER_NAME: ${REDIS_MASTER_NAME:-wao-master}
      REDIS_PASS: ${REDIS_PASS}
      SENTINEL_ANNOUNCE_HOST: ${SLAVE_PUBLIC_HOST:-linux1.wayuwa.cn}
    command: ["/bin/sh", "/opt/wao/start-sentinel.sh"]
    volumes:
      - ./redis/start-sentinel.sh:/opt/wao/start-sentinel.sh:ro
    depends_on:
      redis-slave:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "redis-cli --no-auth-warning -p 26379 -a $$REDIS_PASS ping | grep PONG",
        ]
      interval: 10s
      timeout: 3s
      retries: 15
    logging: *default-logging
    networks: [wao]

  ddns-go:
    image: jeessy/ddns-go:v6.17.2
    restart: unless-stopped
    ports:
      - "9876:9876"
    volumes:
      - ddns-go-data:/root
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
    logging: *default-logging
    networks: [wao]

  wao-server:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      target: server-runtime
      args:
        MAVEN_MIRROR_URL: ${MAVEN_MIRROR_URL:-https://maven.aliyun.com/repository/public}
        ALPINE_MIRROR_HOST: ${ALPINE_MIRROR_HOST:-mirrors.aliyun.com}
    image: wao-server:${WAO_IMAGE_TAG:-latest}
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SERVER_PORT: 8080
      MYSQL_HOST: ${MASTER_PUBLIC_HOST:-linux2.wayuwa.cn}
      MYSQL_PORT: 3306
      DB_NAME: ${DB_NAME:-wao}
      DB_USER: ${DB_USER:-wao_app}
      DB_PASS: ${DB_PASS}
      WAO_VAULT_KEY: ${WAO_VAULT_KEY}
      NETEASE_MUSIC_ENABLED: ${NETEASE_MUSIC_ENABLED:-false}
      NETEASE_MUSIC_APP_ID: ${NETEASE_MUSIC_APP_ID:-}
      NETEASE_MUSIC_APP_SECRET: ${NETEASE_MUSIC_APP_SECRET:-}
      NETEASE_MUSIC_PRIVATE_KEY: ${NETEASE_MUSIC_PRIVATE_KEY:-}
      NETEASE_MUSIC_REDIRECT_URI: ${NETEASE_MUSIC_REDIRECT_URI:-https://wao.wayuwa.cn/api/music/netease/callback}
      NETEASE_MUSIC_FRONTEND_URL: ${NETEASE_MUSIC_FRONTEND_URL:-https://wao.wayuwa.cn}
      NETEASE_MUSIC_CLIENT_TYPE: ${NETEASE_MUSIC_CLIENT_TYPE:-web}
      NETEASE_MUSIC_CHANNEL: ${NETEASE_MUSIC_CHANNEL:-}
      NETEASE_MUSIC_DEVICE_TYPE: ${NETEASE_MUSIC_DEVICE_TYPE:-}
      NETEASE_MUSIC_OS: ${NETEASE_MUSIC_OS:-}
      NETEASE_MUSIC_OS_VER: ${NETEASE_MUSIC_OS_VER:-}
      NETEASE_MUSIC_APP_VER: ${NETEASE_MUSIC_APP_VER:-}
      NETEASE_MUSIC_BRAND: ${NETEASE_MUSIC_BRAND:-}
      NETEASE_MUSIC_MODEL: ${NETEASE_MUSIC_MODEL:-}
      REDIS_PASS: ${REDIS_PASS}
      REDIS_MASTER_NAME: ${REDIS_MASTER_NAME:-wao-master}
      REDIS_SENTINEL_NODES: ${REDIS_SENTINEL_NODES}
      NACOS_SERVER_ADDR: ${MASTER_PUBLIC_HOST:-linux2.wayuwa.cn}:8848
      NACOS_USERNAME: ${NACOS_USERNAME:-nacos}
      NACOS_PASSWORD: ${NACOS_PASSWORD}
      NACOS_NAMESPACE: ${NACOS_NAMESPACE:-public}
      NACOS_DISCOVERY_IP: ${NODE_PUBLIC_IP}
      FEISHU_LOGIN_ENABLED: ${FEISHU_LOGIN_ENABLED:-false}
      FEISHU_APP_ID: ${FEISHU_APP_ID:-}
      FEISHU_APP_SECRET: ${FEISHU_APP_SECRET:-}
      FEISHU_REDIRECT_URI: ${FEISHU_REDIRECT_URI:-https://wao.wayuwa.cn/api/auth/feishu/callback}
      FEISHU_FRONTEND_URL: ${FEISHU_FRONTEND_URL:-https://wao.wayuwa.cn}
      WAO_SHARE_BASE_URL: ${WAO_SHARE_BASE_URL:-https://wao.wayuwa.cn}
      WAO_CHAT_REVIEW_PROCESSING_ENABLED: ${WAO_CHAT_REVIEW_PROCESSING_ENABLED:-true}
      WAO_AI_READ_ONLY_QUEUED_TIMEOUT: ${WAO_AI_READ_ONLY_QUEUED_TIMEOUT:-60m}
      WAO_AI_READ_ONLY_RUNNING_TIMEOUT: ${WAO_AI_READ_ONLY_RUNNING_TIMEOUT:-30m}
      WAO_AI_READ_ONLY_CLEANUP_ENABLED: ${WAO_AI_READ_ONLY_CLEANUP_ENABLED:-true}
      WAO_AI_TASK_AUTO_RUN_SCHEDULER_ENABLED: "false"
      FEISHU_COMMENT_WEBHOOK_URL: ${FEISHU_COMMENT_WEBHOOK_URL:-}
      AUTH_PROTECTION_ENABLED: ${AUTH_PROTECTION_ENABLED:-true}
      AUTH_REGISTRATION_ENABLED: ${AUTH_REGISTRATION_ENABLED:-true}
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-true}
      WECHAT_LOGIN_ENABLED: ${WECHAT_LOGIN_ENABLED:-false}
      WECHAT_APP_ID: ${WECHAT_APP_ID:-}
      WECHAT_APP_SECRET: ${WECHAT_APP_SECRET:-}
      WECHAT_REDIRECT_URI: ${WECHAT_REDIRECT_URI:-https://wao.wayuwa.cn/api/auth/wechat/callback}
      WECHAT_FRONTEND_URL: ${WECHAT_FRONTEND_URL:-https://wao.wayuwa.cn}
    depends_on:
      mysql-slave:
        condition: service_healthy
      redis-slave:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 45s
    deploy:
      resources:
        limits:
          cpus: "4.0"
          memory: 2G
    logging: *default-logging
    networks: [wao]

  wao-agent-server:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      target: agent-runtime
      args:
        MAVEN_MIRROR_URL: ${MAVEN_MIRROR_URL:-https://maven.aliyun.com/repository/public}
        ALPINE_MIRROR_HOST: ${ALPINE_MIRROR_HOST:-mirrors.aliyun.com}
    image: wao-agent-server:${WAO_IMAGE_TAG:-latest}
    restart: unless-stopped
    ports:
      - "8081:8081"
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SERVER_PORT: 8081
      MYSQL_HOST: ${MASTER_PUBLIC_HOST:-linux2.wayuwa.cn}
      MYSQL_PORT: 3306
      DB_NAME: ${DB_NAME:-wao}
      DB_USER: ${DB_USER:-wao_app}
      DB_PASS: ${DB_PASS}
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-true}
      AGENT_NODE_ID: ${AGENT_NODE_ID:-slave}
      AGENT_MEDIA_DIR: /var/lib/wao-agent/media
      AGENT_CREDENTIAL_KEY: ${AGENT_CREDENTIAL_KEY:-}
      AGENT_AI_PROVIDER: ${AGENT_AI_PROVIDER:-deepseek}
      AGENT_AI_BASE_URL: ${AGENT_AI_BASE_URL:-https://api.deepseek.com/v1}
      AGENT_AI_API_KEY: ${AGENT_AI_API_KEY:-}
      AGENT_AI_MODEL: ${AGENT_AI_MODEL:-deepseek-chat}
      DOUYIN_CLIENT_KEY: ${DOUYIN_CLIENT_KEY:-}
      DOUYIN_CLIENT_SECRET: ${DOUYIN_CLIENT_SECRET:-}
      DOUYIN_REDIRECT_URI: ${DOUYIN_REDIRECT_URI:-https://wao.wayuwa.cn/api/agent/platforms/DOUYIN/callback}
    volumes:
      - wao-agent-media:/var/lib/wao-agent/media
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8081/api/agent/health"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 45s
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 1G
    logging: *default-logging
    networks: [wao]

  wao-gateway:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      target: gateway-runtime
      args:
        MAVEN_MIRROR_URL: ${MAVEN_MIRROR_URL:-https://maven.aliyun.com/repository/public}
        ALPINE_MIRROR_HOST: ${ALPINE_MIRROR_HOST:-mirrors.aliyun.com}
    image: wao-gateway:${WAO_IMAGE_TAG:-latest}
    restart: unless-stopped
    ports:
      - "9000:9000"
    environment:
      SPRING_PROFILES_ACTIVE: prod
      GATEWAY_PORT: 9000
      GATEWAY_SSL_ENABLED: ${GATEWAY_SSL_ENABLED:-true}
      GATEWAY_SSL_PASS: ${GATEWAY_SSL_PASS}
      WAO_SERVER_URI: http://wao-server:8080
      WAO_AGENT_SERVER_URI: http://wao-agent-server:8081
      NACOS_SERVER_ADDR: ${MASTER_PUBLIC_HOST:-linux2.wayuwa.cn}:8848
      NACOS_USERNAME: ${NACOS_USERNAME:-nacos}
      NACOS_PASSWORD: ${NACOS_PASSWORD}
      NACOS_NAMESPACE: ${NACOS_NAMESPACE:-public}
      NACOS_DISCOVERY_IP: ${NODE_PUBLIC_IP}
    volumes:
      - ./certs/gateway.p12:/run/secrets/gateway.p12:ro
    depends_on:
      wao-server:
        condition: service_healthy
      wao-agent-server:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-kfsS", "https://127.0.0.1:9000/api/hello"]
      interval: 15s
      timeout: 5s
      retries: 15
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 1G
    logging: *default-logging
    networks: [wao]

volumes:
  mysql-slave-data:
  redis-slave-data:
  ddns-go-data:
  wao-agent-media:
    name: wao-agent-slave_wao-agent-media

networks:
  wao:
    name: wao-slave
