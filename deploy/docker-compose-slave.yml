name: wao-slave

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "20m"
    max-file: "5"

services:
  mysql-slave:
    image: mysql:9.7.0
    restart: unless-stopped
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASS}
      MYSQL_SOURCE_HOST: ${MASTER_PUBLIC_HOST:-linux2.wayuwa.cn}
      MYSQL_REPLICATION_USER: ${MYSQL_REPLICATION_USER:-wao_repl}
      MYSQL_REPLICATION_PASSWORD: ${MYSQL_REPLICATION_PASSWORD}
      DB_NAME: ${DB_NAME:-wao}
      TZ: Asia/Shanghai
    volumes:
      - mysql-slave-data:/var/lib/mysql
      - ./mysql/slave.cnf:/etc/mysql/conf.d/slave.cnf:ro
      - ./mysql/init-slave.sh:/docker-entrypoint-initdb.d/10-replication.sh:ro
      - ./scripts/backup-mysql.sh:/opt/wao/backup-mysql.sh:ro
      - ./scripts/restore-drill.sh:/opt/wao/restore-drill.sh:ro
      - ./backups:/backups
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent",
        ]
      interval: 10s
      timeout: 5s
      retries: 20
    deploy:
      resources:
        limits:
          cpus: "4.0"
          memory: 6G
    logging: *default-logging
    networks: [wao]

  redis-slave:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    environment:
      REDIS_MASTER_HOST: ${MASTER_PUBLIC_HOST:-linux2.wayuwa.cn}
      REDIS_PASS: ${REDIS_PASS}
      REDIS_REPLICA_ANNOUNCE_HOST: ${SLAVE_PUBLIC_HOST:-windows1.wayuwa.cn}
    command:
      - /bin/sh
      - -ec
      - exec redis-server /usr/local/etc/redis/redis.conf --replicaof "$$REDIS_MASTER_HOST" 6379 --masterauth "$$REDIS_PASS" --requirepass "$$REDIS_PASS" --replica-announce-ip "$$REDIS_REPLICA_ANNOUNCE_HOST" --replica-announce-port 6379
    volumes:
      - redis-slave-data:/data
      - ./redis/slave.conf:/usr/local/etc/redis/redis.conf:ro
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a $$REDIS_PASS ping | grep PONG"]
      interval: 10s
      timeout: 3s
      retries: 15
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2G
    logging: *default-logging
    networks: [wao]

  sentinel-slave:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "26379:26379"
    environment:
      REDIS_MASTER_HOST: ${MASTER_PUBLIC_HOST:-linux2.wayuwa.cn}
      REDIS_MASTER_NAME: ${REDIS_MASTER_NAME:-wao-master}
      REDIS_PASS: ${REDIS_PASS}
      SENTINEL_ANNOUNCE_HOST: ${SLAVE_PUBLIC_HOST:-windows1.wayuwa.cn}
    command: ["/bin/sh", "/opt/wao/start-sentinel.sh"]
    volumes:
      - ./redis/start-sentinel.sh:/opt/wao/start-sentinel.sh:ro
    depends_on:
      redis-slave:
        condition: service_healthy
    logging: *default-logging
    networks: [wao]

  ddns-go:
    image: jeessy/ddns-go:v6.17.2
    restart: unless-stopped
    ports:
      - "9876:9876"
    volumes:
      - ddns-go-data:/root
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
    logging: *default-logging
    networks: [wao]

  wao-server:
    build:
      context: ..
      dockerfile: wao-server/Dockerfile
    image: wao-server:${WAO_IMAGE_TAG:-latest}
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SERVER_PORT: 8080
      MYSQL_HOST: ${MASTER_PUBLIC_HOST:-linux2.wayuwa.cn}
      MYSQL_PORT: 3306
      DB_NAME: ${DB_NAME:-wao}
      DB_USER: ${DB_USER:-wao_app}
      DB_PASS: ${DB_PASS}
      REDIS_PASS: ${REDIS_PASS}
      REDIS_MASTER_NAME: ${REDIS_MASTER_NAME:-wao-master}
      REDIS_SENTINEL_NODES: ${REDIS_SENTINEL_NODES}
      NACOS_SERVER_ADDR: ${MASTER_PUBLIC_HOST:-linux2.wayuwa.cn}:8848
      NACOS_USERNAME: ${NACOS_USERNAME:-nacos}
      NACOS_PASSWORD: ${NACOS_PASSWORD}
      NACOS_NAMESPACE: ${NACOS_NAMESPACE:-public}
      NACOS_DISCOVERY_IP: ${NODE_PUBLIC_IP}
    depends_on:
      mysql-slave:
        condition: service_healthy
      redis-slave:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 45s
    deploy:
      resources:
        limits:
          cpus: "4.0"
          memory: 2G
    logging: *default-logging
    networks: [wao]

  wao-gateway:
    build:
      context: ..
      dockerfile: wao-gateway/Dockerfile
    image: wao-gateway:${WAO_IMAGE_TAG:-latest}
    restart: unless-stopped
    ports:
      - "9000:9000"
    environment:
      SPRING_PROFILES_ACTIVE: prod
      GATEWAY_PORT: 9000
      GATEWAY_SSL_ENABLED: ${GATEWAY_SSL_ENABLED:-true}
      GATEWAY_SSL_PASS: ${GATEWAY_SSL_PASS}
      NACOS_SERVER_ADDR: ${MASTER_PUBLIC_HOST:-linux2.wayuwa.cn}:8848
      NACOS_USERNAME: ${NACOS_USERNAME:-nacos}
      NACOS_PASSWORD: ${NACOS_PASSWORD}
      NACOS_NAMESPACE: ${NACOS_NAMESPACE:-public}
      NACOS_DISCOVERY_IP: ${NODE_PUBLIC_IP}
    volumes:
      - ./certs/gateway.p12:/run/secrets/gateway.p12:ro
    depends_on:
      wao-server:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-kfsS", "https://127.0.0.1:9000/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 15
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 1G
    logging: *default-logging
    networks: [wao]

volumes:
  mysql-slave-data:
  redis-slave-data:
  ddns-go-data:

networks:
  wao:
    name: wao-slave
