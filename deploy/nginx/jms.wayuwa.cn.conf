server {
    listen 80;
    listen [::]:80;
    server_name jms.wayuwa.cn;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name jms.wayuwa.cn;

    ssl_certificate /etc/letsencrypt/live/jms.wayuwa.cn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/jms.wayuwa.cn/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:JMS_SSL:10m;
    ssl_session_timeout 1d;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    # 默认仍从 WAO 新页面打开；成员显式配置为 WAO 页签时，仅允许主站嵌入。
    # JumpServer Core 自带 SAMEORIGIN，必须在反向代理边界移除后用精确 CSP 收敛。
    proxy_hide_header X-Frame-Options;
    add_header Content-Security-Policy "frame-ancestors 'self' https://wao.wayuwa.cn" always;

    client_max_body_size 4096m;
    proxy_buffering off;
    proxy_request_buffering off;

    location / { return 410; }
}
