user nginx;
worker_processes 2;
error_log /dev/stderr warn;
pid /var/run/nginx.pid;
events { worker_connections 512; }
http {
    map $uri $edge_probe_key {
        default "";
        /api/edge/ready $binary_remote_addr;
    }
    limit_req_zone $edge_probe_key zone=edge_probe:1m rate=5r/s;
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    log_format edge '$remote_addr $request_method $uri $status $body_bytes_sent';
    access_log /dev/stdout edge;
    sendfile on;
    keepalive_timeout 30;
    client_header_timeout 10;
    client_body_timeout 30;
    send_timeout 30;
    include /etc/nginx/conf.d/*.conf;
}
