server {
    listen 80;
    listen [::]:80;
    server_name wao.wayuwa.cn;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name wao.wayuwa.cn;

    ssl_certificate /etc/letsencrypt/live/wao.wayuwa.cn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/wao.wayuwa.cn/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options SAMEORIGIN always;

    root /var/www/wao/dist;
    index index.html;

    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location /api/ {
        default_type application/json;
        add_header Retry-After 300 always;
        return 503 '{"code":503,"message":"WAO backend deployment is initializing"}';
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
