# A management jump only: no shell, SFTP, agent, reverse or arbitrary forwarding.
Match User wao-recovery
    AuthenticationMethods publickey
    PubkeyAuthentication yes
    PasswordAuthentication no
    KbdInteractiveAuthentication no
    AllowTcpForwarding local
    AllowStreamLocalForwarding no
    AllowAgentForwarding no
    X11Forwarding no
    PermitTTY no
    PermitTunnel no
    PermitOpen 10.66.0.3:22 10.66.0.2:22
    MaxSessions 0
Match all
