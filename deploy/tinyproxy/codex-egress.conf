Port 18888
Listen 0.0.0.0
Timeout 600

PidFile "/run/tinyproxy/tinyproxy.pid"
LogFile "/dev/stdout"
LogLevel Info
Syslog Off

MaxClients 100
MinSpareServers 2
MaxSpareServers 5
StartServers 2
MaxRequestsPerChild 0

# 只接受主机回环和 Docker bridge 私网来源，拒绝局域网及公网客户端。
Allow 127.0.0.1
Allow 172.16.0.0/12

DisableViaHeader Yes
ViaProxyName "wao-codex-egress"
ConnectPort 443

# 不依赖桌面会话的系统 TUN。应用容器先通过 WAO bridge 访问 tinyproxy，
# tinyproxy 再显式交给宿主机上由 Compose 托管的 mihomo mixed-port。
Upstream http host.docker.internal:7897
