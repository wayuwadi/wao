Port 18888
Listen 0.0.0.0
Timeout 600

PidFile "/run/tinyproxy/tinyproxy.pid"
LogFile "/dev/stdout"
LogLevel Info
Syslog Off

MaxClients 100
MinSpareServers 2
MaxSpareServers 5
StartServers 2
MaxRequestsPerChild 0

# 只接受主机回环和 Docker bridge 私网来源，拒绝局域网及公网客户端。
Allow 127.0.0.1
Allow 172.16.0.0/12

DisableViaHeader Yes
ViaProxyName "wao-codex-egress"
ConnectPort 443

# 应用容器与 mihomo 都在 WAO bridge；只有 mihomo 的 7897 额外发布到宿主
# 仅供本机代理使用，tinyproxy 不穿越主机防火墙。
Upstream http codex-vpn:7897
