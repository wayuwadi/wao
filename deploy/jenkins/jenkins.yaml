jenkins:
  systemMessage: "WAO 自建 CI/CD。生产流水线只执行受信任的 main。\n"
  numExecutors: 1
  mode: NORMAL
  scmCheckoutRetryCount: 2
  disableRememberMe: true
  securityRealm:
    reverseProxy:
      forwardedUser: X-Forwarded-User
      forwardedEmail: X-Forwarded-Mail
      forwardedDisplayName: X-Forwarded-DisplayName
      headerGroups: X-Forwarded-Groups
      headerGroupsDelimiter: "|"
      inhibitInferRootDN: false
      disableLdapEmailResolver: true
      updateInterval: 15
  authorizationStrategy:
    globalMatrix:
      entries:
        - group:
            name: wao-admins
            permissions:
              - Overall/Administer
        - group:
            name: wao-members
            permissions:
              - Overall/Read
              - Job/Read
              - View/Read

credentials:
  system:
    domainCredentials:
      - credentials:
          - usernamePassword:
              scope: GLOBAL
              id: wao-github-pat
              username: wayuwacn
              password: "${trim:${readFile:/etc/jenkins/secrets/github-pat}}"
              description: WAO private repository contents read and commit statuses write
          - basicSSHUserPrivateKey:
              scope: GLOBAL
              id: wao-github-scm-ssh
              username: git
              description: Dedicated GitHub account SSH key used only by Jenkins SCM checkout
              privateKeySource:
                directEntry:
                  privateKey: "${readFile:/etc/jenkins/secrets/github-scm-ed25519}"
          - string:
              scope: GLOBAL
              id: wao-github-webhook-secret
              secret: "${trim:${readFile:/etc/jenkins/secrets/github-webhook-secret}}"
              description: GitHub push webhook HMAC secret
          - basicSSHUserPrivateKey:
              scope: GLOBAL
              id: wao-slave-ssh
              username: wage
              description: Jenkins deployment key for the Linux1 slave node
              privateKeySource:
                directEntry:
                  privateKey: "${readFile:/etc/jenkins/secrets/slave-ed25519}"
          - file:
              scope: GLOBAL
              id: wao-slave-known-hosts
              fileName: slave-known-hosts
              secretBytes: "${readFileBase64:/etc/jenkins/secrets/slave-known-hosts}"
              description: Verified Linux1 SSH host keys
          - basicSSHUserPrivateKey:
              scope: GLOBAL
              id: wao-cloud-ssh
              username: root
              description: Jenkins deployment key for the WAO cloud ingress
              privateKeySource:
                directEntry:
                  privateKey: "${readFile:/etc/jenkins/secrets/cloud-ed25519}"
          - file:
              scope: GLOBAL
              id: wao-cloud-known-hosts
              fileName: cloud-known-hosts
              secretBytes: "${readFileBase64:/etc/jenkins/secrets/cloud-known-hosts}"
              description: Verified cloud SSH host keys

unclassified:
  location:
    adminAddress: admin@wayuwa.cn
    url: https://wao.wayuwa.cn/jenkins/
  gitHubPluginConfig:
    hookSecretConfigs:
      - credentialsId: wao-github-webhook-secret
        signatureAlgorithm: SHA256
    configs:
      - name: wao-github
        apiUrl: https://api.github.com
        credentialsId: wao-github-pat
        manageHooks: false

appearance:
  locale:
    systemLocale: zh_CN
    ignoreAcceptLanguage: true
    allowUserPreferences: false

jobs:
  - script: >
      pipelineJob('wao-main-cd') {
        description('WAO main: collect pushes for 300 seconds, test once, build immutable SHA images, deploy Linux1 slave → Linux2 master → cloud.')
        quietPeriod(300)
        properties {
          githubProjectUrl('https://github.com/wayuwacn/wao/')
        }
        parameters {
          booleanParam('BOOTSTRAP_SLAVE', false, '仅显式启用时重建 Linux1 从库。')
          booleanParam('DEPLOY_PRODUCTION', true, '关闭时只做完整影子构建，不触碰生产节点。')
          booleanParam('ALLOW_SLAVE_OFFLINE', false, '仅在 Linux1 预检不可达时继续发布 Linux2 与云端。')
        }
        triggers {
          githubPush()
        }
        definition {
          cpsScm {
            scm {
              git {
                remote {
                  url('git@github.com:wayuwacn/wao.git')
                  credentials('wao-github-scm-ssh')
                  refspec('+refs/heads/${WAO_JENKINS_SCM_BRANCH}:refs/remotes/origin/${WAO_JENKINS_SCM_BRANCH}')
                }
                branch('*/${WAO_JENKINS_SCM_BRANCH}')
                extensions {
                  cloneOptions {
                    shallow(false)
                    noTags(true)
                    honorRefspec(true)
                    timeout(20)
                  }
                }
              }
            }
            scriptPath('Jenkinsfile')
            // Lightweight checkout uses a separate controller cache and ignores
            // cloneOptions.noTags; use the pre-warmed job workspace instead.
            lightweight(false)
          }
        }
      }
  - script: >
      pipelineJob('wao-client-release') {
        description('WAO 桌面客户端自建发布：Linux2 构建 Windows，Mac 节点构建通用包，Linux2 统一签名和原子发布。')
        quietPeriod(300)
        properties {
          githubProjectUrl('https://github.com/wayuwacn/wao/')
        }
        parameters {
          booleanParam('PUBLISH_CLIENT', false, '双端构建、原公钥验签和公开哈希核对后发布；仅 main。')
          booleanParam('BUILD_MACOS', true, '关闭时只构建 Windows，不允许发布。')
        }
        definition {
          cpsScm {
            scm {
              git {
                remote {
                  url('ssh://git@ssh.github.com:443/wayuwacn/wao.git')
                  credentials('wao-github-scm-ssh')
                  refspec('+refs/heads/main:refs/remotes/origin/main')
                }
                branch('*/main')
                extensions {
                  cloneOptions {
                    shallow(false)
                    noTags(true)
                    honorRefspec(true)
                    timeout(20)
                  }
                }
              }
            }
            scriptPath('Jenkinsfile.client')
            lightweight(false)
          }
        }
      }
