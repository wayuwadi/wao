openapi: 3.0.3
info:
  title: WAO Note Mining API
  version: 1.1.0
  description: 从当前成员近期小记生成带来源的内容与可选三视角图片候选；不改写原文，不自动启用提醒。
paths:
  /api/note-mining:
    get:
      summary: 读取当前成员最近一次挖掘及已物化产物
      responses:
        '200': { description: 没有运行时 job 为 null、artifacts 与 visuals 为空 }
  /api/note-mining/runs:
    post:
      summary: 幂等启动一次近期小记挖掘
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [requestId]
              properties: { requestId: { type: string, pattern: '^[a-f0-9]{32}$' } }
      responses:
        '200': { description: 返回排队、运行、成功或失败状态 }
        '400': { description: 请求标识无效或不足两篇有效小记 }
  /api/note-mining/runs/{id}:
    get:
      summary: 查询本人指定运行；AI 完成时幂等物化内容
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses:
        '200': { description: 运行、三类内容候选与可选三视角图片状态及来源 }
        '404': { description: 任务不存在或不属于当前成员 }
  /api/note-mining/artifacts/{id}/feedback:
    post:
      summary: 保存本人对内容候选的反馈
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status: { type: string, enum: [SAVED, NOT_ACCURATE, REMINDER_DRAFT] }
      responses:
        '200': { description: 返回更新后的产物；REMINDER_DRAFT 仍未启用 }
        '404': { description: 产物不存在或不属于当前成员 }
  /api/note-mining/runs/{id}/visuals/{lens}/retry:
    post:
      summary: 重试本人一次挖掘中失败的单张图片
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - { name: lens, in: path, required: true, schema: { type: string, enum: [PROGRESS, REFRAME, NEXT_STEP] } }
      responses:
        '200': { description: 返回重置为 PENDING 的图片候选 }
        '400': { description: 图片尚未失败，不可重复生成 }
        '404': { description: 图片不存在或不属于当前成员 }
  /api/note-mining/runs/{id}/visuals/{lens}/feedback:
    post:
      summary: 保存本人对单张已生成图片的取舍
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - { name: lens, in: path, required: true, schema: { type: string, enum: [PROGRESS, REFRAME, NEXT_STEP] } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status: { type: string, enum: [SAVED, NOT_ACCURATE] }
      responses:
        '200': { description: 返回更新后的图片候选 }
        '400': { description: 图片尚未完成或反馈类型无效 }
        '404': { description: 图片不存在或不属于当前成员 }
