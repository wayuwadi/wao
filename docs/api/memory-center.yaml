openapi: 3.0.3
info:
  title: WAO Unified Memory Center API
  version: 0.1.0
paths:
  /api/memories:
    get:
      summary: 在已授权范围内查询记忆
      parameters:
        - { in: query, name: scopeType, required: true, schema: { $ref: '#/components/schemas/ScopeType' } }
        - { in: query, name: scopeId, required: true, schema: { type: string } }
        - { in: query, name: category, schema: { type: string } }
        - { in: query, name: state, schema: { type: string } }
        - { in: query, name: query, schema: { type: string } }
      responses:
        '200': { description: 当前范围的记忆 }
        '404': { description: 范围不存在或无权访问 }
    post:
      summary: 创建个人正式记忆或组织/项目候选
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SaveMemory' }
      responses:
        '200': { description: 已创建 }
        '404': { description: 范围不存在或无权访问 }
  /api/memories/{id}:
    get:
      summary: 读取记忆当前内容
      parameters: [ { $ref: '#/components/parameters/MemoryId' } ]
      responses:
        '200': { description: 当前记忆 }
        '404': { description: 不存在或无权访问 }
  /api/memories/{id}/revisions:
    get:
      summary: 读取版本历史
      parameters: [ { $ref: '#/components/parameters/MemoryId' } ]
      responses:
        '200': { description: 不可变版本列表 }
        '404': { description: 不存在或无权访问 }
    post:
      summary: 基于 baseRevisionId 创建修订
      parameters: [ { $ref: '#/components/parameters/MemoryId' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SaveMemory' }
      responses:
        '200': { description: 已创建修订 }
        '409': { description: 基础版本已落后，客户端草稿应保留 }
  /api/memory-revisions/{id}/publish:
    post:
      summary: 发布组织或项目候选
      parameters: [ { $ref: '#/components/parameters/RevisionId' } ]
      responses:
        '200': { description: 已发布 }
        '404': { description: 不存在或无发布权限 }
  /api/memory-revisions/{id}/reject:
    post:
      summary: 驳回候选
      parameters: [ { $ref: '#/components/parameters/RevisionId' } ]
      responses:
        '200': { description: 已驳回 }
        '404': { description: 不存在或无审核权限 }
  /api/memories/{id}/archive:
    post:
      summary: 废止记忆
      parameters: [ { $ref: '#/components/parameters/MemoryId' } ]
      responses:
        '200': { description: 已废止 }
        '404': { description: 不存在或无权操作 }
  /api/memory/access-tokens/{tokenId}/grants:
    get:
      summary: 读取当前成员某枚设备令牌的范围授权
      parameters: [ { $ref: '#/components/parameters/TokenId' } ]
      responses:
        '200': { description: 个人、组织和项目授权列表 }
        '404': { description: 令牌不存在或不属于当前成员 }
    put:
      summary: 原子替换设备的组织与项目授权
      parameters: [ { $ref: '#/components/parameters/TokenId' } ]
      responses:
        '200': { description: 保存后的授权；个人授权始终保留，直接写权限不会授予共享域 }
        '404': { description: 令牌或请求范围不存在、当前成员无权访问 }
  /api/mcp/memory/personal:
    post:
      summary: 个人上下文 MCP Streamable HTTP 入口
      security: [ { bearerAuth: [] } ]
      responses:
        '200': { description: JSON-RPC 响应；提供 search/get/save/options }
        '401': { description: 设备令牌无效或已吊销 }
  /api/mcp/memory/{scopeType}/{scopeId}:
    post:
      summary: 组织或项目上下文 MCP Streamable HTTP 入口
      security: [ { bearerAuth: [] } ]
      parameters:
        - { in: path, name: scopeType, required: true, schema: { type: string, enum: [organization, project] } }
        - { in: path, name: scopeId, required: true, schema: { type: string } }
      responses:
        '200': { description: JSON-RPC 响应；提供 search/get/propose/options，不提供发布 }
        '401': { description: 设备令牌未获得该范围授权 }
components:
  securitySchemes:
    bearerAuth: { type: http, scheme: bearer }
  parameters:
    MemoryId: { in: path, name: id, required: true, schema: { type: string } }
    RevisionId: { in: path, name: id, required: true, schema: { type: string } }
    TokenId: { in: path, name: tokenId, required: true, schema: { type: string } }
  schemas:
    ScopeType: { type: string, enum: [personal, organization, project] }
    SaveMemory:
      type: object
      required: [scopeType, scopeId, category, title, content]
      properties:
        scopeType: { $ref: '#/components/schemas/ScopeType' }
        scopeId: { type: string }
        category: { type: string }
        title: { type: string, maxLength: 200 }
        content: { type: string }
        changeSummary: { type: string, maxLength: 1000 }
        evidenceLinks: { type: array, items: { type: string, format: uri } }
        expiresAt: { type: string, format: date-time }
        baseRevisionId: { type: string }
