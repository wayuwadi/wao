openapi: 3.0.3
info:
  title: WAO Function Health API
  version: 1.0.0
paths:
  /api/function-health:
    get:
      summary: 获取当前成员 30 天功能使用度与全局功能分
      responses:
        '200': { description: 功能健康快照 }
  /api/function-health/{featureId}/open:
    post:
      summary: 记录当前成员真实打开一次功能
      parameters:
        - { name: featureId, in: path, required: true, schema: { type: string } }
        - { name: source, in: query, schema: { type: string, enum: [PAGE, WORKBENCH, SIDEBAR] } }
      responses:
        '200': { description: 已记录 }
  /api/function-health/{featureId}/score:
    post:
      summary: 人工对全局功能分做一分校准
      parameters:
        - { name: featureId, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [delta]
              properties:
                delta: { type: integer, enum: [-1, 1] }
      responses:
        '200': { description: 校准后的功能健康项 }
