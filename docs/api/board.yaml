openapi: 3.0.3
info:
  title: WAO 核心域 API
  version: 0.1.0
  description: >
    组织 / 成员 / 领域 / 项目 / 任务读写接口。所有响应统一包裹 ApiResponse（code=0 成功）。
    与前端 wao-web/src/types 保持一致。
servers:
  - url: /api
paths:
  /members:
    get:
      summary: 成员列表
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/MemberListResponse' } } } }
  /org:
    get:
      summary: 组织信息
      responses:
        '200': { description: OK }
  /areas:
    get:
      summary: 人生领域列表
      responses:
        '200': { description: OK }
  /projects:
    get:
      summary: 项目列表
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/ProjectListResponse' } } } }
    post:
      summary: 新建项目
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/CreateProjectRequest' } } }
      responses:
        '200': { description: OK }
        '400': { description: 参数不合法（code=40001） }
  /projects/{id}:
    get:
      summary: 项目详情
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: OK }
        '404': { description: 不存在（code=40400） }
    patch:
      summary: 局部更新项目（名称 / 领域 / 目标 / 图标，空字段不改）
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/PatchProjectRequest' } } }
      responses:
        '200': { description: OK }
        '404': { description: 不存在（code=40400） }
    delete:
      summary: 删除项目
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: OK }
        '404': { description: 不存在（code=40400） }
  /tasks:
    get:
      summary: 任务列表（跨项目）
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/TaskListResponse' } } } }
    post:
      summary: 新建任务
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/CreateTaskRequest' } } }
      responses:
        '200': { description: OK }
        '400': { description: 参数不合法 }
  /tasks/{id}:
    get:
      summary: 任务详情
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: OK }
        '404': { description: 不存在 }
    patch:
      summary: 局部更新任务（空字段不改，改动写入活动时间线）
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/PatchTaskRequest' } } }
      responses:
        '200': { description: OK }
        '404': { description: 不存在 }
    put:
      summary: 全量替换 / 新增任务（前端本地变更后的写透，upsert）
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/Task' } } }
      responses:
        '200': { description: OK }
  # 知识库域（关系表，见 docs/database/schema.md「知识库域」）
  /kb-groups:
    get: { summary: 自建知识库分组列表, responses: { '200': { description: OK } } }
    post: { summary: 新建分组, responses: { '200': { description: OK } } }
  /kb-groups/{id}:
    patch: { summary: 重命名分组, parameters: [ { name: id, in: path, required: true, schema: { type: string } } ], responses: { '200': { description: OK }, '404': { description: 不存在 } } }
    delete: { summary: 删除分组（下属知识库回落为默认分组）, parameters: [ { name: id, in: path, required: true, schema: { type: string } } ], responses: { '200': { description: OK }, '404': { description: 不存在 } } }
  /kbs:
    get: { summary: 知识库列表, responses: { '200': { description: OK } } }
    post: { summary: 新建知识库（自带默认文件夹「文档」）, responses: { '200': { description: OK }, '400': { description: 参数不合法 } } }
  /kbs/{id}:
    get: { summary: 知识库详情, parameters: [ { name: id, in: path, required: true, schema: { type: string } } ], responses: { '200': { description: OK }, '404': { description: 不存在 } } }
    patch: { summary: 局部更新知识库（项目 / 自动化知识库的名称与简介不可改）, parameters: [ { name: id, in: path, required: true, schema: { type: string } } ], responses: { '200': { description: OK }, '404': { description: 不存在 } } }
    delete: { summary: 删除知识库（级联删除文件夹与文档）, parameters: [ { name: id, in: path, required: true, schema: { type: string } } ], responses: { '200': { description: OK }, '404': { description: 不存在 } } }
  /kbs/{id}/folders:
    post: { summary: 在知识库下新建文件夹, parameters: [ { name: id, in: path, required: true, schema: { type: string } } ], responses: { '200': { description: OK }, '404': { description: 知识库不存在 } } }
  /kbs/{id}/folders/{folderId}:
    patch: { summary: 重命名文件夹, parameters: [ { name: id, in: path, required: true, schema: { type: string } }, { name: folderId, in: path, required: true, schema: { type: string } } ], responses: { '200': { description: OK }, '404': { description: 不存在 } } }
    delete: { summary: 删除文件夹（级联删除文档）, parameters: [ { name: id, in: path, required: true, schema: { type: string } }, { name: folderId, in: path, required: true, schema: { type: string } } ], responses: { '200': { description: OK }, '404': { description: 不存在 } } }
  /docs:
    get: { summary: 文档列表（含正文块与动态计算的反向链接）, responses: { '200': { description: OK } } }
    post:
      summary: 新建文档（必须指定 kbId + folderId，创建即完成与知识库的关联）
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/CreateDocRequest' } } } }
      responses: { '200': { description: OK }, '404': { description: 知识库或文件夹不存在 } }
  /docs/{id}:
    get:
      summary: 文档详情
      parameters: [ { name: id, in: path, required: true, schema: { type: string } } ]
      responses: { '200': { description: OK }, '404': { description: 不存在 } }
    patch: { summary: 局部更新文档（标题 / 正文块 / 出链 / 所在文件夹）, parameters: [ { name: id, in: path, required: true, schema: { type: string } } ], responses: { '200': { description: OK }, '404': { description: 不存在 } } }
    delete: { summary: 删除文档, parameters: [ { name: id, in: path, required: true, schema: { type: string } } ], responses: { '200': { description: OK }, '404': { description: 不存在 } } }
  # 自动化域（关系表；cronExpr 非空的任务由服务端调度器按计划自动执行）
  /jobs:
    get: { summary: 自动化任务列表（含近 3 次运行记录）, responses: { '200': { description: OK } } }
    post: { summary: 新建自动化任务, responses: { '200': { description: OK }, '400': { description: cronExpr 不是合法 Cron 表达式 } } }
  /jobs/{id}:
    get: { summary: 任务详情, parameters: [ { name: id, in: path, required: true, schema: { type: string } } ], responses: { '200': { description: OK }, '404': { description: 不存在 } } }
    patch: { summary: 局部更新任务, parameters: [ { name: id, in: path, required: true, schema: { type: string } } ], responses: { '200': { description: OK }, '404': { description: 不存在 } } }
    delete: { summary: 删除任务（级联删除运行记录）, parameters: [ { name: id, in: path, required: true, schema: { type: string } } ], responses: { '200': { description: OK }, '404': { description: 不存在 } } }
  /jobs/{id}/run: { post: { summary: 手动触发一次运行, parameters: [ { name: id, in: path, required: true, schema: { type: string } } ], responses: { '200': { description: OK } } } }
  /jobs/{id}/pause: { post: { summary: 暂停（停止按计划自动执行）, parameters: [ { name: id, in: path, required: true, schema: { type: string } } ], responses: { '200': { description: OK } } } }
  /jobs/{id}/resume: { post: { summary: 恢复已暂停的任务, parameters: [ { name: id, in: path, required: true, schema: { type: string } } ], responses: { '200': { description: OK } } } }
  /jobs/{id}/reauth: { post: { summary: 重新授权（「待修复」恢复为「正常」）, parameters: [ { name: id, in: path, required: true, schema: { type: string } } ], responses: { '200': { description: OK } } } }
  /files: { get: { summary: 文件列表, responses: { '200': { description: OK } } } }
  /images: { get: { summary: 图床列表, responses: { '200': { description: OK } } } }
  # 密钥库域（关系表；密码以 AES-256-GCM 服务端加密存储，见 docs/adr/007-vault-server-side-encryption.md）
  /vault:
    get: { summary: 密钥库分组及条目列表（不含密码明文，仅 hasSecret 标记）, responses: { '200': { description: OK } } }
  /vault/groups:
    post: { summary: 新建分组, responses: { '200': { description: OK } } }
  /vault/groups/{id}:
    patch: { summary: 重命名分组, parameters: [ { name: id, in: path, required: true, schema: { type: string } } ], responses: { '200': { description: OK }, '404': { description: 不存在 } } }
    delete: { summary: 删除分组（级联删除条目）, parameters: [ { name: id, in: path, required: true, schema: { type: string } } ], responses: { '200': { description: OK }, '404': { description: 不存在 } } }
  /vault/items:
    post: { summary: 新建条目（secret 明文只在本次请求传输，落库前加密）, responses: { '200': { description: OK }, '404': { description: 分组不存在 } } }
  /vault/items/{id}:
    patch: { summary: 局部更新条目, parameters: [ { name: id, in: path, required: true, schema: { type: string } } ], responses: { '200': { description: OK }, '404': { description: 不存在 } } }
    delete: { summary: 删除条目, parameters: [ { name: id, in: path, required: true, schema: { type: string } } ], responses: { '200': { description: OK }, '404': { description: 不存在 } } }
  /vault/items/{id}/reveal:
    post: { summary: 解密并返回一次密码明文（未设置密码时 secret 为 null）, parameters: [ { name: id, in: path, required: true, schema: { type: string } } ], responses: { '200': { description: OK }, '404': { description: 不存在 } } }
  /calendar/events: { get: { summary: 日历事件列表, responses: { '200': { description: OK } } } }
  /schedule: { get: { summary: 今日日程列表, responses: { '200': { description: OK } } } }
  /suggestions: { get: { summary: AI 建议列表, responses: { '200': { description: OK } } } }
  /goals: { get: { summary: 目标胶囊列表, responses: { '200': { description: OK } } } }
components:
  schemas:
    ApiResponse:
      type: object
      properties:
        code: { type: integer, description: 0 为成功 }
        message: { type: string }
        data: {}
        timestamp: { type: integer, format: int64 }
    Member:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        initial: { type: string }
        color: { type: string }
        role: { type: string }
    Project:
      type: object
      description: 字段与前端 Project 一致（含 milestones/trend/blockers/activity 等嵌套）
      properties:
        id: { type: string }
        name: { type: string }
        icon: { type: string, description: remixicon 类名，如 ri-stack-line }
        area: { type: string }
        status: { type: string, enum: [进行中, 有风险, 规划中, 已完成] }
        health: { type: string }
        progress: { type: integer }
        owner: { type: string }
        members: { type: array, items: { type: string } }
        start: { type: string }
        due: { type: string }
        visibility: { type: string }
        updated: { type: string }
        goal: { type: string }
    Task:
      type: object
      description: 字段与前端 Task 一致（含 steps/subs/comments/activity 等嵌套）
      properties:
        id: { type: string }
        title: { type: string }
        project: { type: string }
        status: { type: string, enum: [待办, 进行中, 阻塞, 已完成] }
        pr: { type: string, enum: [P0, P1, P2, P3] }
        owner: { type: string }
        due: { type: string }
        images:
          type: array
          description: "内嵌图片（data: 或远程链接）"
          items:
            type: object
            properties:
              name: { type: string }
              url: { type: string }
    CreateProjectRequest:
      type: object
      required: [name]
      properties:
        name: { type: string }
        area: { type: string }
        goal: { type: string }
        visAll: { type: boolean }
    PatchProjectRequest:
      type: object
      description: 空字段不改
      properties:
        name: { type: string }
        area: { type: string }
        goal: { type: string }
        icon: { type: string }
    CreateTaskRequest:
      type: object
      required: [title, project]
      properties:
        title: { type: string }
        project: { type: string }
        pr: { type: string }
        owner: { type: string }
        due: { type: string, description: ISO 日期 }
        desc: { type: string }
        images:
          type: array
          items:
            type: object
            properties:
              name: { type: string }
              url: { type: string }
    PatchTaskRequest:
      type: object
      properties:
        title: { type: string }
        status: { type: string }
        pr: { type: string }
        owner: { type: string }
        desc: { type: string }
    CreateDocRequest:
      type: object
      required: [kbId, folderId]
      description: kbId + folderId 建立文档与知识库的关联；title/author 缺省为「未命名文档」/ wg
      properties:
        kbId: { type: string }
        folderId: { type: string }
        title: { type: string }
        author: { type: string }
    MemberListResponse:
      allOf:
        - $ref: '#/components/schemas/ApiResponse'
        - type: object
          properties: { data: { type: array, items: { $ref: '#/components/schemas/Member' } } }
    ProjectListResponse:
      allOf:
        - $ref: '#/components/schemas/ApiResponse'
        - type: object
          properties: { data: { type: array, items: { $ref: '#/components/schemas/Project' } } }
    TaskListResponse:
      allOf:
        - $ref: '#/components/schemas/ApiResponse'
        - type: object
          properties: { data: { type: array, items: { $ref: '#/components/schemas/Task' } } }
