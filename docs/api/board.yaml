openapi: 3.0.3
info:
  title: WAO 核心域 API
  version: 0.1.0
  description: >
    组织 / 成员 / 领域 / 项目 / 任务读写接口。所有响应统一包裹 ApiResponse（code=0 成功）。
    与前端 wao-web/src/types 保持一致。
servers:
  - url: /api
paths:
  /ideas:
    get:
      summary: 列出团队全部点子
      responses: { '200': { description: 按更新时间倒序的点子完整档案 } }
    post:
      summary: 快速记录点子，创建人默认成为负责人
      responses: { '200': { description: 已创建点子 }, '400': { description: 标题或优先级不合法 } }
  /ideas/{ideaId}:
    parameters: [{ name: ideaId, in: path, required: true, schema: { type: string } }]
    get:
      summary: 读取一个点子及资产、任务、迭代、调研与时间线
      responses: { '200': { description: 点子完整档案 }, '404': { description: 点子不存在 } }
    patch:
      summary: 编辑档案、转交负责人或关联项目
      responses: { '200': { description: 已保存档案 }, '400': { description: 字段或成员、项目不合法 } }
  /ideas/{ideaId}/transition:
    post:
      summary: 由团队成员显式推进或关闭点子
      responses: { '200': { description: 阶段已改变 }, '400': { description: 阶段门禁未满足 } }
  /ideas/{ideaId}/research-runs:
    get: { summary: 列出点子调研运行, responses: { '200': { description: 调研运行列表 } } }
    post: { summary: 启动新的隔离联网调研, responses: { '200': { description: 已排队 }, '400': { description: 已有活动调研 } } }
  /ideas/{ideaId}/artifacts:
    get: { summary: 列出点子知识资产, responses: { '200': { description: 资产关系列表 } } }
    post: { summary: 关联原生知识文档, responses: { '200': { description: 已建立资产关系 } } }
  /ideas/{ideaId}/tasks:
    post: { summary: 创建并关联 MVP 任务或关联已有任务, responses: { '200': { description: 已建立任务关系 } } }
  /ideas/{ideaId}/tasks/{taskId}:
    put: { summary: 关联已有任务, responses: { '200': { description: 已建立关系 } } }
    delete: { summary: 仅解除关系而不删除任务, responses: { '200': { description: 已解除关系 } } }
  /ideas/{ideaId}/iterations:
    get: { summary: 列出全部认可和未认可的迭代, responses: { '200': { description: 迭代列表 } } }
    post: { summary: 记录一轮任务和 AI Run 迭代, responses: { '200': { description: 已创建迭代 } } }
  /ideas/{ideaId}/iterations/{iterationId}:
    patch: { summary: 保存迭代结果和人工反馈, responses: { '200': { description: 已更新迭代 } } }
  /ideas/{ideaId}/convert-to-project:
    post:
      summary: 把存量独立点子无损归并到项目并生成历史文档
      responses: { '200': { description: 归并后的项目 }, '404': { description: 点子或指定项目不存在 } }
  /workspaces:
    get:
      summary: 按最近更新时间列出当前成员自己的工作空间
      responses: { '200': { description: 空间摘要列表，不包含其他成员数据 } }
    post:
      summary: 创建当前成员的工作空间和空的默认分组
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/CreateWorkspaceRequest' } } }
      responses: { '200': { description: 新空间完整快照 }, '400': { description: 名称或项目关联不合法 } }
  /workspaces/{workspaceId}:
    parameters:
      - { name: workspaceId, in: path, required: true, schema: { type: string } }
    get:
      summary: 读取当前成员一个工作空间的完整快照
      responses: { '200': { description: 空间与分组链接 }, '404': { description: 空间不存在或不属于当前成员 } }
    put:
      summary: 原子保存当前成员一个工作空间的完整快照
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/SaveWorkspaceRequest' } } }
      responses: { '200': { description: 服务端规整后的完整快照 }, '400': { description: 超出数量、字段或 URL 安全限制 }, '404': { description: 空间不存在或不属于当前成员 } }
    delete:
      summary: 删除当前成员的工作空间，不访问链接指向的系统
      responses: { '200': { description: 已删除 }, '404': { description: 空间不存在或不属于当前成员 } }
  /action-plans:
    get:
      summary: 按日期读取当前成员的行动计划和真实打卡投影
      parameters: [{ name: date, in: query, required: false, schema: { type: string, format: date } }]
      responses: { '200': { description: 当前成员私有计划列表 } }
    post:
      summary: 新建当前成员私有行动计划
      responses: { '200': { description: 已创建计划 }, '400': { description: 日期、行动或提醒设置不合法 } }
  /action-plans/{planId}:
    put:
      summary: 调整计划和当前行动版本，保留历史打卡
      parameters: [{ name: planId, in: path, required: true, schema: { type: string } }]
      responses: { '200': { description: 已保存计划 }, '404': { description: 计划不存在或不属于当前成员 } }
  /action-plans/{planId}/status:
    patch:
      summary: 完成或重新开始计划
      parameters:
        - { name: planId, in: path, required: true, schema: { type: string } }
        - { name: completed, in: query, required: true, schema: { type: boolean } }
      responses: { '200': { description: 状态已更新 } }
  /action-plans/{planId}/items/{itemId}/checkins/{date}:
    post:
      summary: 切换某日一条已安排行动的真实打卡
      responses: { '200': { description: 已返回更新后计划 }, '400': { description: 未来日期或当天未安排 } }
  /action-plans/{planId}/notes/{date}:
    put:
      summary: 自动保存或清空某日事实复盘
      responses: { '200': { description: 已返回更新后计划 } }
  /assistant/status:
    get:
      summary: 指定只读 AI 能力是否真实可用
      parameters:
        - { name: capabilityId, in: query, required: false, schema: { type: string, maxLength: 32 } }
      responses:
        '200': { description: 返回 configured、能力 id、展示名与可读状态说明 }
  /assistant/capabilities:
    get:
      summary: 列出问问 AI 与复盘可选的只读 AI 能力
      responses:
        '200': { description: 只含配置元数据与可用性，不含 Token、API Key 或 OAuth 凭据 }
  /assistant/polish:
    post:
      summary: 优先用设置页启用的受信模型网关或 DeepSeek API 润色文档选区，无配置时回退只读本地 Codex
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/PolishTextRequest' } } }
      responses:
        '200': { description: 返回可直接替换选区的 polished 文字 }
        '400': { description: 选区为空或超长、模型 API 鉴权/模型/响应失败，或 Codex 回退链路不可用 }
  /text-polish:
    get:
      summary: 读取当前成员的润色提示词与最近 50 条真实历史
      responses:
        '200': { description: 返回成员级 prompt 和包含前后文本、提示词快照的 records }
  /text-polish/prompt:
    put:
      summary: 保存当前成员的润色方法提示词
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [prompt]
              properties:
                prompt: { type: string, minLength: 1, maxLength: 4000 }
      responses:
        '200': { description: 返回已保存并去除首尾空白的提示词 }
  /text-polish/run:
    post:
      summary: 使用成员已保存提示词完成真实 AI 润色并记录前后内容
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [originalText]
              properties:
                originalText: { type: string, minLength: 1, maxLength: 12000 }
      responses:
        '200': { description: 返回已持久化的原文、结果、提示词快照和时间 }
        '400': { description: 输入无效、已有 AI 请求执行中或真实 AI 上游失败 }
  /assistant/source-options:
    get:
      summary: AI 助手当前可用的群聊、发言人、项目和聊天日期范围
      responses:
        '200': { description: 选项全部来自真实配置与业务数据 }
  /assistant/conversations:
    get:
      summary: 当前成员最近更新的 AI 助手会话
      responses:
        '200': { description: 最多 50 条会话摘要 }
    post:
      summary: 为当前成员新建空白 AI 助手会话
      responses:
        '200': { description: 新会话摘要 }
  /assistant/conversations/{conversationId}:
    parameters:
      - { name: conversationId, in: path, required: true, schema: { type: string } }
    get:
      summary: 当前成员的一条会话及最近消息
      responses:
        '200': { description: 会话摘要与最近 200 条消息 }
        '404': { description: 会话不存在或不属于当前成员 }
    delete:
      summary: 删除当前成员的一条会话及消息
      responses:
        '200': { description: 已删除 }
        '400': { description: 会话仍有问答执行中 }
  /assistant/chat/stream:
    post:
      summary: 在成员会话中把页面问答交给本地 Codex Runner，并以 SSE 返回最终答复
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/AssistantChatRequest' } } }
      responses:
        '200': { description: text/event-stream，事件为 token / done / error }
        '400': { description: 节点离线、已有活动问答或参数不合法 }
  /ai/activities:
    get:
      summary: 分页读取首页统一 AI 活动
      parameters:
        - { name: type, in: query, schema: { type: string, enum: [ALL, FEATURE_DEVELOPMENT, AI_INSPECTION, CHAT_REVIEW], default: ALL } }
        - { name: status, in: query, schema: { type: string, enum: [ALL, SUCCEEDED, FAILED], default: ALL } }
        - { name: page, in: query, schema: { type: integer, minimum: 1, default: 1 } }
        - { name: size, in: query, schema: { type: integer, minimum: 8, maximum: 50, default: 20 } }
      responses:
        '200': { description: 功能开发、AI 巡检与聊天复盘按结束时间统一排序，按类型和结果返回真实总数与分页信息 }
  /memory/tokens:
    get:
      summary: 列出当前成员有效的 Codex 记忆 MCP 设备令牌元数据
      responses:
        '200': { description: 不含摘要和完整令牌的设备列表 }
    post:
      summary: 为当前成员签发一枚只显示一次明文的 MCP 设备令牌
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties: { name: { type: string, minLength: 1, maxLength: 80 } }
      responses:
        '200': { description: 令牌元数据与仅本次返回的 secret }
        '400': { description: 名称不合法或有效令牌已达到十枚 }
  /memory/entries:
    get:
      summary: 按当前成员列出个人记忆，不返回附件二进制
      parameters:
        - { name: query, in: query, required: false, schema: { type: string, maxLength: 500 } }
        - { name: category, in: query, required: false, schema: { type: string } }
      responses: { '200': { description: 最多 300 条当前成员自己的个人记忆 } }
    post:
      summary: 当前成员人工保存一条文字记忆
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/SavePersonalMemory' } } }
      responses: { '200': { description: 已保存，captureMode=manual、mediaType=text } }
  /memory/entries/upload:
    post:
      summary: 当前成员人工保存一份真实多模态原件及说明
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [category, file]
              properties:
                title: { type: string, maxLength: 120, description: 为空时使用安全文件名 }
                content: { type: string, maxLength: 20000 }
                category: { type: string, enum: [preference, responsibility, plan, decision, context, experience] }
                file: { type: string, format: binary, description: 单个不超过 50MB }
      responses: { '200': { description: 已保存原件与元数据 }, '400': { description: 文件为空、超限或分类不支持 } }
  /memory/entries/{memoryId}:
    patch:
      summary: 修改当前成员记忆的标题、说明和分类，附件原件保持不变
      parameters: [{ name: memoryId, in: path, required: true, schema: { type: string } }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/SavePersonalMemory' } } }
      responses: { '200': { description: 已更新 }, '404': { description: 记忆不存在或不属于当前成员 } }
    delete:
      summary: 删除当前成员记忆及附件原件
      parameters: [{ name: memoryId, in: path, required: true, schema: { type: string } }]
      responses: { '200': { description: 已删除 }, '404': { description: 记忆不存在或不属于当前成员 } }
  /memory/entries/{memoryId}/attachment:
    get:
      summary: 下载当前成员记忆的附件原件
      parameters: [{ name: memoryId, in: path, required: true, schema: { type: string } }]
      responses:
        '200': { description: 真实附件字节 }
        '404': { description: 记忆/附件不存在或不属于当前成员 }
  /memory/tokens/{tokenId}:
    delete:
      summary: 吊销当前成员的一枚 Codex 记忆 MCP 设备令牌
      parameters: [{ name: tokenId, in: path, required: true, schema: { type: string } }]
      responses:
        '200': { description: 已吊销 }
        '404': { description: 令牌不存在或不属于当前成员 }
  /mcp:
    post:
      summary: Codex 个人记忆的无状态 Streamable HTTP MCP JSON-RPC 端点
      security: [{ memoryBearer: [] }]
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, description: MCP JSON-RPC 请求 } } }
      responses:
        '200': { description: MCP JSON-RPC 结果；支持 initialize、ping、tools/list、tools/call }
        '202': { description: MCP notification 已接受 }
        '401': { description: 记忆令牌缺失、无效或已吊销 }
  /daily-guidance:
    get:
      summary: 读取当前成员今天已保存的情境建议或真实可用状态
      responses:
        '200': { description: 返回 ready / missing / unavailable 及建议正文或原因 }
    post:
      summary: 结合当前成员真实未完成任务生成今天的情境建议
      parameters:
        - { name: refresh, in: query, required: false, schema: { type: boolean, default: false } }
      responses:
        '200': { description: 返回并保存今天的真实 Codex 建议 }
        '400': { description: 本地 Codex 离线、已有问答执行或没有返回有效内容 }
  /members:
    get:
      summary: 成员列表
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/MemberListResponse' } } } }
  /members/{memberId}/password:
    patch:
      summary: 管理员重置成员本地登录密码
      parameters: [{ name: memberId, in: path, required: true, schema: { type: string } }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/ResetMemberPasswordRequest' } } }
      responses: { '200': { description: OK }, '400': { description: 密码不合法 }, '401': { description: 非管理员 } }
  /members/{memberId}/account:
    delete:
      summary: 管理员删除成员账号与登录凭据
      parameters: [{ name: memberId, in: path, required: true, schema: { type: string } }]
      responses: { '200': { description: OK }, '400': { description: 删除自己或最后管理员 }, '401': { description: 非管理员 } }
  /org:
    get:
      summary: 组织信息
      responses:
        '200': { description: OK }
  /areas:
    get:
      summary: 人生领域列表
      responses:
        '200': { description: OK }
  /projects:
    get:
      summary: 项目列表
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/ProjectListResponse' } } } }
    post:
      summary: 新建项目
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/CreateProjectRequest' } } }
      responses:
        '200': { description: OK }
        '400': { description: 参数不合法（code=40001） }
  /projects/{id}:
    get:
      summary: 项目详情
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: OK }
        '404': { description: 不存在（code=40400） }
    patch:
      summary: 局部更新项目（名称 / 领域 / 状态 / 目标 / 图标 / 通知开关 / 任务分组，空字段不改）
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/PatchProjectRequest' } } }
      responses:
        '200': { description: OK }
        '404': { description: 不存在（code=40400） }
    delete:
      summary: 删除项目
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: OK }
        '404': { description: 不存在（code=40400） }
  /projects/{id}/start:
    post:
      summary: 首次明确开始推进项目；状态与团队通知均幂等
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses: { '200': { description: 已进入进行中或返回既有推进状态 }, '404': { description: 项目不存在或不可见 } }
  /projects/{id}/brief-doc:
    post:
      summary: 幂等创建或返回项目说明文档，首次调用时才创建项目知识库
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses: { '200': { description: 项目说明文档 }, '404': { description: 项目不存在或不可见 } }
  /tasks:
    get:
      summary: 任务列表（跨项目）
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/TaskListResponse' } } } }
    post:
      summary: 新建任务
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/CreateTaskRequest' } } }
      responses:
        '200': { description: OK }
        '400': { description: 参数不合法 }
  /tasks/{id}:
    get:
      summary: 任务详情
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: OK }
        '404': { description: 不存在 }
    patch:
      summary: 局部更新任务（空字段不改，改动写入活动时间线）
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/PatchTaskRequest' } } }
      responses:
        '200': { description: OK }
        '404': { description: 不存在 }
    put:
      summary: 全量替换 / 新增任务（前端本地变更后的写透，upsert）
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/Task' } } }
      responses:
        '200': { description: OK }
  # 知识库域（关系表，见 docs/database/schema.md「知识库域」）
    delete:
      summary: 删除任务（连同其子任务、评论与活动）
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: OK }
        '404': { description: 不存在 }
  /tasks/{id}/comments:
    post:
      summary: 原子追加评论；普通评论按任务动态策略通知，真实 @成员按人工通知策略通知
      parameters: [ { name: id, in: path, required: true, schema: { type: string } } ]
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [text], properties: { text: { type: string } } } } }
      responses: { '200': { description: 返回新评论 }, '400': { description: 评论为空 }, '404': { description: 任务不存在 } }
  /tasks/{id}/notifications:
    post:
      summary: 当前成员明确把自己可见的任务通知到飞书群
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses:
        '200': { description: data 为是否真实发出卡片；策略、项目或 Webhook 关闭时为 false }
        '404': { description: 任务不存在或当前成员不可见 }
  /tasks/{id}/comments/{commentId}:
    patch:
      summary: 修改自己的评论（commentId 为评论 id；老评论没有 id 时传数组下标）
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - { name: commentId, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [text], properties: { text: { type: string } } } } }
      responses: { '200': { description: 返回更新后的评论 }, '400': { description: 正文为空或改的不是自己的评论 }, '404': { description: 任务或评论不存在 } }
    delete:
      summary: 删除自己的评论
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - { name: commentId, in: path, required: true, schema: { type: string } }
      responses: { '200': { description: OK }, '400': { description: 删的不是自己的评论 }, '404': { description: 任务或评论不存在 } }
  /kb-groups:
    get: { summary: 自建知识库分组列表, responses: { '200': { description: OK } } }
    post: { summary: 新建分组（归属当前登录成员）, responses: { '200': { description: OK } } }
  /kb-groups/{id}:
    patch: { summary: 重命名分组, parameters: [ { name: id, in: path, required: true, schema: { type: string } } ], responses: { '200': { description: OK }, '404': { description: 不存在 } } }
    delete: { summary: 删除分组（下属知识库回落为默认分组）, parameters: [ { name: id, in: path, required: true, schema: { type: string } } ], responses: { '200': { description: OK }, '404': { description: 不存在 } } }
  /kbs:
    get: { summary: 知识库列表, responses: { '200': { description: OK } } }
    post: { summary: 新建知识库（自带默认文件夹「文档」）, responses: { '200': { description: OK }, '400': { description: 参数不合法 } } }
  /kbs/{id}:
    get: { summary: 知识库详情, parameters: [ { name: id, in: path, required: true, schema: { type: string } } ], responses: { '200': { description: OK }, '404': { description: 不存在 } } }
    patch: { summary: 局部更新知识库（项目 / 自动化知识库的名称与简介不可改）, parameters: [ { name: id, in: path, required: true, schema: { type: string } } ], responses: { '200': { description: OK }, '404': { description: 不存在 } } }
    delete: { summary: 删除知识库（移入回收站，其下文件夹与文档一并带走；小记知识库不可删）, parameters: [ { name: id, in: path, required: true, schema: { type: string } } ], responses: { '200': { description: OK }, '400': { description: 小记知识库不可删除 }, '404': { description: 不存在 } } }
  /kbs/{id}/folders:
    post: { summary: 在知识库下新建文件夹, parameters: [ { name: id, in: path, required: true, schema: { type: string } } ], responses: { '200': { description: OK }, '404': { description: 知识库不存在 } } }
  /kbs/{id}/folders/{folderId}:
    patch: { summary: 重命名文件夹, parameters: [ { name: id, in: path, required: true, schema: { type: string } }, { name: folderId, in: path, required: true, schema: { type: string } } ], responses: { '200': { description: OK }, '404': { description: 不存在 } } }
    delete: { summary: 删除文件夹（移入回收站，其下文档一并带走）, parameters: [ { name: id, in: path, required: true, schema: { type: string } }, { name: folderId, in: path, required: true, schema: { type: string } } ], responses: { '200': { description: OK }, '404': { description: 不存在 } } }
  /kbs/{id}/document-order:
    put:
      summary: 原子保存知识库完整文档树顺序，支持同文件夹排序与跨文件夹移动
      description: 完整校验后用一条批量语句窄更新每篇文档的 folder_id / ord；即使命中 scoped 自动归档，也不回写正文、链接或 auto_sync_version、不签发归档序列。后续自动同步可将归档恢复到固定月目录
      parameters: [ { name: id, in: path, required: true, schema: { type: string } } ]
      responses: { '200': { description: OK }, '400': { description: 文件夹或文档缺失、重复或不属于该知识库 } }
  /docs:
    get: { summary: 文档列表（含正文块与动态计算的反向链接）, responses: { '200': { description: OK } } }
    post:
      summary: 新建文档（必须指定 kbId + folderId，创建即完成与知识库的关联）
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/CreateDocRequest' } } } }
      responses: { '200': { description: OK }, '404': { description: 知识库或文件夹不存在 } }
  /docs/{id}:
    get:
      summary: 文档详情
      parameters: [ { name: id, in: path, required: true, schema: { type: string } } ]
      responses: { '200': { description: OK }, '404': { description: 不存在 } }
    patch: { summary: 局部更新文档（标题 / 正文块 / 出链 / 所在文件夹）, parameters: [ { name: id, in: path, required: true, schema: { type: string } } ], responses: { '200': { description: OK }, '404': { description: 不存在 } } }
    delete: { summary: 删除文档（移入回收站，7 天内可恢复）, parameters: [ { name: id, in: path, required: true, schema: { type: string } } ], responses: { '200': { description: OK }, '404': { description: 不存在 } } }
  /docs/notes:
    post:
      summary: 兼容旧客户端的新建小记（服务端生成文档 ID）
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/CreateNoteRequest' } } } }
      responses: { '200': { description: OK } }
  /docs/notes/{id}:
    put:
      summary: 幂等创建或重试小记（按创建人归档；同一成员与文档 ID 不重复插入）
      parameters: [ { name: id, in: path, required: true, schema: { type: string, pattern: '^[A-Za-z0-9_-]{1,32}$' } } ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/CreateNoteRequest' } } } }
      responses: { '200': { description: 已创建或返回同一篇小记 }, '400': { description: 文档 ID 不合法或已被其他文档占用 } }
  /doc-templates:
    get:
      summary: 当前登录成员的文档模板列表
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/DocTemplateListResponse' } } } }
    post:
      summary: 把一篇文档的当前正文快照另存为当前成员模板（名称 128 字、说明 512 字、正文 5000 块且 JSON 1000000 字符以内）
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/CreateDocTemplateRequest' } } } }
      responses:
        '200': { description: 返回新模板, content: { application/json: { schema: { $ref: '#/components/schemas/DocTemplateResponse' } } } }
        '400': { description: 字段为空或超出长度与正文容量限制 }
        '404': { description: 来源文档不存在 }
  /doc-templates/{id}:
    patch:
      summary: 按更新时间版本修改当前成员模板的名称、使用说明与正文块快照
      description: null 字段不修改；expectedUpdatedAt 必须等于当前服务端版本，冲突时保留客户端草稿且不覆盖云端
      parameters: [ { name: id, in: path, required: true, schema: { type: string } } ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/PatchDocTemplateRequest' } } } }
      responses:
        '200': { description: 返回保存后的完整模板, content: { application/json: { schema: { $ref: '#/components/schemas/DocTemplateResponse' } } } }
        '400': { description: 字段为空、版本格式无效或超出长度与正文容量限制 }
        '409': { description: 模板已由其他窗口更新，本次请求没有覆盖云端 }
        '404': { description: 模板不存在或不属于当前成员 }
    delete: { summary: 删除当前成员模板；不影响已创建文档, parameters: [ { name: id, in: path, required: true, schema: { type: string } } ], responses: { '200': { description: OK }, '404': { description: 模板不存在或不属于当前成员 } } }
  # 文档协同在场（见 docs/adr/017-doc-realtime-collaboration-presence.md）
  /docs/{id}/presence:
    post:
      summary: 在场心跳：上报光标行，取回同刻的协作者；客户端 rev 落后时附带最新文档
      parameters: [ { name: id, in: path, required: true, schema: { type: string } } ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/DocPresenceRequest' } } } }
      responses: { '200': { description: OK }, '404': { description: 文档不存在 } }
    delete:
      summary: 离开文档（销掉自己的在场记录；不调用也会在在场窗口过期后自动消失）
      parameters: [ { name: id, in: path, required: true, schema: { type: string } } ]
      responses: { '200': { description: OK } }
  # 回收站（见 docs/adr/018-knowledge-trash-retention.md）
  /trash:
    get: { summary: 回收站列表（随父级一起被删的条目不单独列出）, responses: { '200': { description: OK } } }
  /trash/{type}/{id}/restore:
    post:
      summary: 恢复条目（父级也在回收站时一并恢复）
      parameters:
        - { name: type, in: path, required: true, schema: { type: string, enum: [kb, folder, doc] } }
        - { name: id, in: path, required: true, schema: { type: string } }
      responses: { '200': { description: OK }, '400': { description: 类型不合法 }, '404': { description: 不在回收站里 } }
  /trash/{type}/{id}:
    delete:
      summary: 立刻彻底删除，不等 7 天
      parameters:
        - { name: type, in: path, required: true, schema: { type: string, enum: [kb, folder, doc] } }
        - { name: id, in: path, required: true, schema: { type: string } }
      responses: { '200': { description: OK }, '400': { description: 类型不合法 } }
  # AI Run：页面端需要 WAO 会话；/ai/runner/* 使用本机节点令牌。
  /ai/projects/{projectId}/config:
    get:
      summary: 读取项目级 AI Run 配置
      parameters: [ { name: projectId, in: path, required: true, schema: { type: string } } ]
      responses: { '200': { description: OK }, '404': { description: 项目不存在 } }
    put:
      summary: 保存开关、仓库、分支、文件夹、默认 AI 工具、首选电脑、项目并发数与失败自动重试次数（0 到 5，默认 2）
      parameters: [ { name: projectId, in: path, required: true, schema: { type: string } } ]
      responses: { '200': { description: OK }, '400': { description: 配置不合法 } }
  /ai/skills/available:
    get: { summary: 返回市场当前可供项目启用的 Codex Skill 审核版本, responses: { '200': { description: OK } } }
  /ai/projects/{projectId}/skills:
    get:
      summary: 返回项目当前固定绑定的 Skill 版本
      parameters: [ { name: projectId, in: path, required: true, schema: { type: string } } ]
      responses: { '200': { description: OK }, '404': { description: 项目不存在 } }
    put:
      summary: 整体替换项目 Skill 固定版本绑定，最多十项
      parameters: [ { name: projectId, in: path, required: true, schema: { type: string } } ]
      responses: { '200': { description: 返回保存后的绑定 }, '400': { description: 版本未审核、已下架或超过十项 } }
  /ai/workflows:
    get: { summary: 各项目的 AI 工作流配置与运行统计（控制台「AI 工作流」视图）, responses: { '200': { description: OK } } }
  /ai/workflows/{projectId}:
    delete:
      summary: 删除 AI 工作流配置并保留历史运行记录
      parameters: [ { name: projectId, in: path, required: true, schema: { type: string } } ]
      responses:
        '200': { description: 工作流配置已删除 }
        '400': { description: 工作流还有排队或执行中的运行 }
        '404': { description: 工作流不存在或已经删除 }
  /ai/evolution:
    get:
      summary: 首页真实 Codex 会话/周额度、自主进化状态与功能提效导向的可执行改进建议
      description: 从真实资产挖掘的候选不包含以纯测试、纯文档或纯技术优化为主要结果的任务；生成和派发均确保目标带有用户价值验收契约。
      responses:
        '200':
          description: sessionQuotas 只返回 Codex 真实五小时主窗口，weeklyQuotas 只返回供应商真实七天窗口，并返回 intervalHours、batchSize 与结合十五分钟检查窗口计算的 nextTriggerAt；已知调度条件不足时 nextTriggerAt 为空，未知额度不返回额度记录，首页不渲染对应额度卡片
  /ai/evolution/schedule:
    put:
      summary: 保存自主进化空闲间隔与单次任务数并立即触发一次到期检查
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [intervalHours, batchSize]
              properties:
                intervalHours: { type: integer, minimum: 1, maximum: 168 }
                batchSize: { type: integer, minimum: 1, maximum: 5 }
      responses:
        '200': { description: 返回保存后的自主进化总览 }
        '400': { description: 间隔或单次任务数超出允许范围 }
  /ai/evolution/suggestions/refresh:
    post:
      summary: 从真实知识库与飞书同步归档挖掘并持久化最多五条新任务建议
      responses:
        '200': { description: 返回一至五条新建议，每条含可追溯的 sourceTitle 与 sourceUrl }
        '400': { description: 没有真实资料、本地 Codex 不可用、没有可靠新线索或返回格式不可靠 }
  /ai/evolution/suggestions/{suggestionId}/launch:
    post:
      summary: 把一条已持久化的真实资产建议交给指定的已启用 AI 工作流
      parameters: [ { name: suggestionId, in: path, required: true, schema: { type: string } } ]
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [projectId], properties: { projectId: { type: string } } } } }
      responses:
        '200': { description: 返回新建并已入队的 AI Run }
        '400': { description: 建议不存在、工作流未启用或执行条件不满足 }
  /ai/task-auto-run:
    get:
      summary: 读取空闲后批量推进最早待办的持久化策略与最近检查结果
      responses:
        '200': { description: 返回 enabled、idleHours、batchSize、项目、任务状态、通知群及真实调度状态 }
    put:
      summary: 保存空闲阈值、单次推进数、项目、任务状态与通知群并立即进入一次到期检查
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [enabled, idleHours, projectId, taskStatuses]
              properties:
                enabled: { type: boolean }
                idleHours: { type: integer, minimum: 1, maximum: 168 }
                batchSize: { type: integer, minimum: 1, maximum: 10, description: 不得超过所选项目的 maxParallelRuns；旧客户端省略时使用项目并发上限 }
                projectId: { type: string }
                taskStatuses: { type: array, minItems: 1, uniqueItems: true, items: { type: string, enum: [待办, 收集中, 进行中] } }
                notificationWebhookId: { type: string, nullable: true }
      responses:
        '200': { description: 返回保存后的策略及真实调度状态 }
        '400': { description: 数量超限、项目不可运行、任务状态不安全或通知群不可用 }
  /ai/runners:
    get: { summary: 执行电脑列表、接入的 AI 工具、在线状态与槽位占用, responses: { '200': { description: OK } } }
  /ai/runners/{runnerId}/log:
    get:
      summary: 按需读取一台执行电脑最近上报的已脱敏日志尾部
      parameters: [ { name: runnerId, in: path, required: true, schema: { type: string } } ]
      responses:
        '200': { description: 返回 runnerId、runnerName、content 与 updatedAt；尚未上报时 content 为空 }
        '404': { description: 执行电脑不存在 }
  /ai/runners/pair-code:
    post: { summary: 生成十分钟有效的一次性电脑配对码, responses: { '200': { description: OK } } }
  /ai/runners/{runnerId}:
    delete:
      summary: 解除一台执行电脑的接入；节点令牌立即作废，返回剩下的电脑列表
      description: |
        这台电脑还有 claimed/running 的运行时返回 400，先取消或等它跑完再解除。解除会把排队中
        点名它的运行改回自动分配，并清空把它设为首选电脑的项目配置；历史运行记录保留。
      parameters: [ { name: runnerId, in: path, required: true, schema: { type: string } } ]
      responses:
        '200': { description: 返回解除后剩下的执行电脑 }
        '400': { description: 这台电脑还有 AI 任务在执行 }
        '404': { description: 执行电脑不存在 }
  /ai/reviewable-tasks:
    get:
      summary: 当前成员可见的待验收任务与最近一次 AI Run 失败后需重试的任务
      description: |
        任务状态为“待验证”时 action 为 ACCEPTANCE；否则仅当尚未完成且最近一次真实 AI Run 为 failed 时
        action 为 RETRY。合并运行按 ai_task_run_task 分别派生，活动的新运行会覆盖更早的失败记录。
      responses:
        '200':
          description: 需重试项优先、同组内按最近运行结束时间倒序
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data: { type: array, items: { $ref: '#/components/schemas/ReviewableTask' } }
  /ai/runs:
    get:
      summary: 最近 100 条 AI 运行
      description: |
        已产出持久化 HTML 报告的运行带 reportUrl；托管页被删除后该字段为空。
        previewImages 最多返回任务正文前四张图片；历史 Base64 图片返回受控预览地址，列表本身不返回编码正文。
      parameters: [ { name: active, in: query, required: false, schema: { type: boolean } } ]
      responses: { '200': { description: OK } }
    post:
      summary: 批量把任务加入 AI 队列；可选子任务、工具、电脑、账号、Codex 模型与 Plan 模式，活动运行自动去重
      description: |
        subId 非空时只跑主任务下的这一条子任务（此时 taskIds 只能有一个任务），
        提示词地址指向 /share/tasks/{id}/subs/{subId}.md；主任务派工的提示词地址一律带
        openOnly=true，已完成和已经单独派过工的子任务不会再进入本次范围。
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/CreateAiRunsRequest' } } }
      responses:
        '200': { description: 返回实际创建的运行 }
        '400': { description: 项目未启用、未配置仓库、没有电脑接入所选 AI 工具，或按子任务派工时选了多个任务 }
        '404': { description: 任务或子任务不存在 }
  /ai/run-options:
    get:
      summary: 返回后台允许的 Codex 模型、推理强度、默认执行模式与固定服务档位
      responses:
        '200': { description: serviceTier 固定为 default，表示本次运行不启用 Fast }
    put:
      summary: 保存后续新建 Codex 运行默认选中的执行模式
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [defaultExecutionMode]
              properties:
                defaultExecutionMode: { type: string, enum: [direct, plan, goal] }
      responses:
        '200': { description: 返回更新后的完整运行选项 }
        '400': { description: 执行模式不在允许范围内 }
  /ai/goals:
    post:
      summary: 把长 Markdown 目标创建为任务并立即交给项目默认 AI 工作流
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [projectId, goal]
              properties:
                projectId: { type: string }
                goal: { type: string, minLength: 1, description: 不设 4000 字人为上限；图片应由编辑器上传图床后写入稳定 URL，旧客户端提交的 Base64 图片由服务端落入图床 }
                runnerId: { type: string, nullable: true, description: 本次指定的兼容执行电脑；为空时自动分配 }
                planMode: { type: boolean, default: false, description: 仅 Codex 生效；先形成计划再连续执行 }
                reasoningEffort: { type: string, nullable: true, enum: [high, medium, low], description: 仅 Codex 生效；留空使用后台默认值 }
      responses:
        '200': { description: 返回已创建并入队的运行 }
        '400': { description: 目标为空、项目未启用、未配置仓库或没有执行电脑 }
  /ai/runs/{runId}/images/{imageIndex}:
    get:
      summary: 预览历史 AI 任务遗留的内联 Base64 图片
      parameters:
        - { name: runId, in: path, required: true, schema: { type: string } }
        - { name: imageIndex, in: path, required: true, schema: { type: integer, minimum: 0 } }
      responses:
        '200': { description: 图片二进制正文 }
        '404': { description: 运行、任务或对应图片不存在 }
  /ai/runs/{runId}/rerun:
    post:
      summary: 基于一次失败运行重新排队；新运行会带上上次的报错交给 AI 继续修
      parameters: [ { name: runId, in: path, required: true, schema: { type: string } } ]
      responses:
        '200': { description: 返回新建的运行（retryOfRunId 指向被修复的那一次） }
        '400': { description: 该运行还没结束、任务已有运行在进行中，或项目未启用 AI Run }
  /ai/runs/{runId}/continue:
    post:
      summary: 向活动或已结束的 AI Run 追加提示词；活动回合立即转向，结束后固定派回原电脑恢复
      description: |
        queued 输入进入首次提示；running 输入让 Runner 结束当前回合并恢复同一 session/worktree。
        失败的运行用它补充信息接着修；成功但不符合预期的运行用它继续优化（见 ADR-027、ADR-111）。
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [input], properties: { input: { type: string, maxLength: 4000 } } } } }
      responses:
        '200': { description: 输入已进入活动运行的待接收状态，或结束的原运行已重新进入队列 }
        '400': { description: 上一条输入尚未接收，或结束的运行无法恢复原会话 }
        '404': { description: 运行不存在 }
  /ai/runner/pair:
    post: { summary: Runner 用一次性配对码换取只返回一次的本机令牌（含本机可用的 AI 工具）, responses: { '200': { description: OK }, '401': { description: 配对码无效 } } }
  /ai/runner/heartbeat:
    post:
      summary: Runner 心跳并更新本机并发数、可用 AI 工具与受限日志尾部
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                logTail: { type: string, maxLength: 30000, description: 已脱敏的最近 200 行诊断日志 }
      parameters:
        - { name: maxConcurrency, in: query, required: false, schema: { type: integer } }
        - { name: engines, in: query, required: false, schema: { type: string }, description: 逗号分隔，如 codex,claude }
        - { name: scriptHash, in: query, required: false, schema: { type: string, pattern: '^[0-9a-f]{64}$' }, description: Runner 脚本原始字节 SHA-256；必须与当前 API 构建打包脚本精确相同才能领取 assistant-v2 }
      responses: { '200': { description: OK }, '401': { description: 节点令牌无效 } }
  /ai/runner/claim:
    post: { summary: 按 AI 工具、指定电脑与并发限制领取下一条任务（重跑的任务会带上 previousFailure）, responses: { '200': { description: 无可领取任务时 data 为 null } } }
  /ai/runner/assistant-v2/claim:
    post:
      summary: 具备精确打包脚本哈希的 Codex Runner 领取一条无工具页面助手或内部安全只读任务
      description: >
        独立 v2 协议；旧 assistant 路由不存在，滚动发布期间不回退。内部任务从 secure_queued CAS 为 secure_running。
        响应的 claimToken 是本次 attempt 唯一凭据；maxRuntimeSeconds 由服务端硬超时扣除保护余量下发，Runner 用单调时钟执行。
      responses:
        '200': { description: 返回 AiAssistantClaim；无任务或哈希能力门禁不通过时 data 为 null }
        '401': { description: 节点令牌无效 }
  /ai/runner/assistant-v2/{runId}/complete:
    post:
      summary: Runner 用 attempt token 回传无工具问答或内部只读分析结果
      description: >
        只有 runId、Runner、claimToken 和当前执行中状态全部匹配时才 CAS 进入终态。旧 attempt 的迟到回传不覆盖终态；
        非零退出不保存部分 response。新 Runner 遇到旧 API 404 时只重试该 v2 路由，不降级。
      parameters: [ { name: runId, in: path, required: true, schema: { type: string } } ]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/CompleteAiAssistantRunRequest' } } }
      responses:
        '200': { description: 已接受当前 attempt，或幂等忽略已终态 / 迟到 attempt }
        '400': { description: claimToken 缺失或请求字段不合法 }
        '401': { description: 节点令牌无效或运行不属于当前节点 }
  /ai/runner/runs/{runId}/complete:
    post:
      summary: Runner 回传 AI CLI 退出码、摘要、会话 id、本次用量与实测执行耗时
      description: |
        用量字段（model / models / inputTokens / outputTokens / cachedInputTokens /
        totalTokens / costUsd）由 Runner 从 CLI 的结束事件里解析，见 ADR-026。
        Codex 不回传花费，costUsd 为 null；解析失败时全部为 0，服务端不会覆盖已记录的账单。
        aiExecutionDurationMs 只累计真实 AI 进程时间，不包含 Git 准备、报告上传和部署等待；续跑在同一条运行记录上累加。
      parameters: [ { name: runId, in: path, required: true, schema: { type: string } } ]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/CompleteAiRunRequest' } } }
      responses: { '200': { description: OK }, '401': { description: 运行不属于当前节点 } }
  /ai/runner/runs/{runId}/skills/{versionId}:
    get:
      summary: Runner 下载本次固化能力清单中的不可变 Skill 包
      parameters:
        - { name: runId, in: path, required: true, schema: { type: string } }
        - { name: versionId, in: path, required: true, schema: { type: string } }
      responses: { '200': { description: 二进制 ZIP 与 X-WAO-Skill-SHA256 }, '401': { description: 运行不属于节点或版本不在清单 } }
  /ai/runner/runs/{runId}/skill-candidates:
    post:
      summary: Runner 把成功运行产生的 Skill 候选收进发起人的未授权市场草稿
      parameters: [ { name: runId, in: path, required: true, schema: { type: string } } ]
      responses: { '200': { description: 返回新建或迭代后的市场草稿 }, '400': { description: 未设置发布身份或包扫描失败 } }
  /ai/runner/runs/{runId}/report:
    post:
      summary: Runner 上传本次运行生成的持久化单文件 HTML 报告
      description: |
        仅当前领取该运行的节点可在运行结束前上传。相同 runId 再次上传会更新同一托管页，
        响应返回的 url 同时出现在后续 AI Run DTO 的 reportUrl。
      parameters: [ { name: runId, in: path, required: true, schema: { type: string } } ]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [html]
              properties: { html: { type: string, format: binary, description: UTF-8 单文件 HTML，最大 10MB } }
      responses:
        '200': { description: 返回关联的 HostedPageDto }
        '400': { description: 文件无效、运行已结束或公开后缀冲突 }
        '401': { description: 运行不属于当前节点 }
  /ai/runner/runs/{runId}/control:
    get:
      summary: Runner 轮询暂停信号与尚未接收的运行中用户输入
      parameters: [ { name: runId, in: path, required: true, schema: { type: string } } ]
      responses:
        '200': { description: 返回 cancelled 与可空 continuationInput }
        '401': { description: 运行不属于当前节点 }
  /ai/runner/runs/{runId}/continuation/consume:
    post:
      summary: Runner 停止当前回合后精确确认消费用户输入
      parameters: [ { name: runId, in: path, required: true, schema: { type: string } } ]
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [input], properties: { input: { type: string, maxLength: 4000 } } } } }
      responses:
        '200': { description: 输入已清除，Runner 可恢复同一会话 }
        '400': { description: 输入已变化或运行已结束 }
        '401': { description: 运行不属于当前节点 }
  # 自动化域（关系表；cronExpr 非空且 handler 已登记的任务由服务端调度器按计划真实执行）
  /jobs:
    get: { summary: 自动化任务列表（运行时间按真实时间戳动态显示今天 / 昨天 / 绝对日期）, responses: { '200': { description: OK } } }
    post: { summary: 新建自动化任务, responses: { '200': { description: OK }, '400': { description: cronExpr 不是合法 Cron 表达式 } } }
  /jobs/{id}:
    get: { summary: 任务详情（运行记录包含稳定 id 及其创建的可选 aiRunId）, parameters: [ { name: id, in: path, required: true, schema: { type: string } } ], responses: { '200': { description: OK }, '404': { description: 不存在 } } }
    patch: { summary: 局部更新任务, parameters: [ { name: id, in: path, required: true, schema: { type: string } } ], responses: { '200': { description: OK }, '404': { description: 不存在 } } }
    delete: { summary: 删除任务（级联删除运行记录）, parameters: [ { name: id, in: path, required: true, schema: { type: string } } ], responses: { '200': { description: OK }, '404': { description: 不存在 } } }
  /jobs/{id}/run: { post: { summary: 手动触发真实执行器并记录当前会话成员、结果与实测耗时；执行器缺失时写明确失败记录, parameters: [ { name: id, in: path, required: true, schema: { type: string } } ], responses: { '200': { description: 返回含最新真实运行结果的任务 } } } }
  /jobs/{id}/pause: { post: { summary: 暂停（停止按计划自动执行）, parameters: [ { name: id, in: path, required: true, schema: { type: string } } ], responses: { '200': { description: OK } } } }
  /jobs/{id}/resume: { post: { summary: 恢复已暂停的任务, parameters: [ { name: id, in: path, required: true, schema: { type: string } } ], responses: { '200': { description: OK } } } }
  /jobs/{id}/reauth: { post: { summary: 重新授权（「待修复」恢复为「正常」）, parameters: [ { name: id, in: path, required: true, schema: { type: string } } ], responses: { '200': { description: OK } } } }
  /jobs/job-http-performance-ai-run/config:
    get: { summary: 读取 HTTP 性能 AI 巡检的真实计划、范围和启动通知配置, responses: { '200': { description: OK } } }
    put:
      summary: 保存巡检配置并立即更新 automation_job 的 Cron、状态和下次触发时间
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/HttpPerformanceInspectionConfig' } } } }
      responses: { '200': { description: 保存后的生效配置 }, '400': { description: 频率、时间、范围或通知目标无效 } }
  # 系统配置（全局唯一一份；密钥类字段只回脱敏形态，见 docs/adr/019-feishu-chat-sync-and-system-settings.md）
  /settings/webhooks:
    get:
      summary: 通用飞书自定义机器人列表；系统默认项在前，地址只返回脱敏形态
      responses:
        '200':
          description: OK
          content: { application/json: { schema: { $ref: '#/components/schemas/FeishuWebhookEndpointListResponse' } } }
    post:
      summary: 新增飞书自定义机器人；第一项自动成为现有系统通知默认目标
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/SaveFeishuWebhookEndpointRequest' } } }
      responses:
        '200':
          description: 返回不含明文地址的新配置
          content: { application/json: { schema: { $ref: '#/components/schemas/FeishuWebhookEndpointResponse' } } }
        '400': { description: 名称、数量或官方 HTTPS Webhook 地址不合法 }
  /settings/webhooks/{id}:
    put:
      summary: 编辑机器人；url 省略或留空表示保留服务端密文
      parameters: [ { name: id, in: path, required: true, schema: { type: string } } ]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/SaveFeishuWebhookEndpointRequest' } } }
      responses:
        '200':
          description: 返回脱敏配置
          content: { application/json: { schema: { $ref: '#/components/schemas/FeishuWebhookEndpointResponse' } } }
        '400': { description: 字段或默认路由不合法 }
        '404': { description: 配置不存在 }
    delete:
      summary: 删除机器人；删除系统默认项时自动提升一项剩余配置
      parameters: [ { name: id, in: path, required: true, schema: { type: string } } ]
      responses: { '200': { description: 已删除 }, '404': { description: 配置不存在 } }
  /settings/webhooks/{id}/test:
    post:
      summary: 用指定机器人发送测试卡片；不受业务启用开关影响
      parameters: [ { name: id, in: path, required: true, schema: { type: string } } ]
      responses: { '200': { description: 已发送 }, '404': { description: 配置不存在 }, '502': { description: 飞书不可达或返回错误，响应不含 Webhook 明文 } }
  /settings/feishu-webhook:
    get:
      summary: 飞书通知 webhook 配置（urlMask 脱敏 / urlSet / enabled）
      deprecated: true
      responses: { '200': { description: OK } }
    put:
      summary: 保存 webhook（url 省略表示不改地址，只切换 enabled）
      deprecated: true
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/SaveWebhookRequest' } } }
      responses: { '200': { description: OK } }
  /settings/feishu-webhook/test:
    post:
      summary: 用当前配置发一条测试通知
      deprecated: true
      responses: { '200': { description: OK }, '502': { description: webhook 不可达或返回错误（code=50203） }, '400': { description: 尚未配置地址（code=40000） } }
  /settings/site-info:
    get:
      summary: 读取网站名称、简介与 ICP 备案信息
      responses: { '200': { description: OK } }
    put:
      summary: 保存网站公开信息，所有页面页脚随下次读取生效
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/SiteInfo' } } }
      responses: { '200': { description: OK }, '400': { description: 字段为空、超长或备案查询链接不合法 } }
  /settings/network-outage-window:
    get:
      summary: 读取自动任务统一遵守的每日断网时段
      responses:
        '200':
          description: 未保存时默认启用上海时间 00:00–06:00
          content: { application/json: { schema: { $ref: '#/components/schemas/NetworkOutageWindow' } } }
    put:
      summary: 保存每日断网时段；开始包含、结束不包含，支持跨午夜
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/NetworkOutageWindow' } } }
      responses: { '200': { description: 保存后的规范化配置 }, '400': { description: 时间格式错误或起止相同 } }
  /settings/files:
    get: { summary: 读取普通文件、图床上传上限与公开下载算术验证码开关, responses: { '200': { description: OK } } }
    put:
      summary: 保存文件与图床设置；关闭算术题不会关闭一次性下载票据
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/FileSettings' } } } }
      responses: { '200': { description: 保存后的生效配置 }, '400': { description: 文件上限不在部署支持范围 } }
  /settings/navigation/media-agent:
    get:
      summary: 兼容旧前端：读取自媒体 Agent 的全局一级菜单配置
      deprecated: true
      responses:
        '200':
          description: 未保存时返回公共分组、排序值 20、显示中的默认配置
          content: { application/json: { schema: { $ref: '#/components/schemas/MediaAgentMenuConfig' } } }
    put:
      summary: 兼容旧前端：保存 Agent 菜单字段并写入通用注册表
      deprecated: true
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/MediaAgentMenuConfig' } } }
      responses: { '200': { description: OK }, '400': { description: 名称、分组或排序值不合法 } }
  /settings/navigation/external-apps:
    get:
      summary: 读取版本化外部应用菜单注册表；兼容 Agent 配置并过滤已退役的 wao-insight
      responses:
        '200':
          description: 当前完整注册表
          content: { application/json: { schema: { $ref: '#/components/schemas/ExternalAppRegistry' } } }
    put:
      summary: 整体保存外部应用注册表；wao-insight 已退役且不会写入
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/SaveExternalAppRegistryRequest' } } }
      responses: { '200': { description: OK }, '400': { description: 标识重复、字段格式或入口地址不安全 } }
  /settings/navigation/builtin-menus:
    get:
      summary: 读取 WAO 内置菜单注册表；配置缺失或损坏时返回代码默认菜单
      responses:
        '200':
          description: 当前内置菜单注册表
          content: { application/json: { schema: { $ref: '#/components/schemas/BuiltinMenuRegistry' } } }
    put:
      summary: 整体保存内置菜单名称、图标、分组、排序、显隐和打开方式；稳定标识与路由不可修改
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/BuiltinMenuRegistry' } } }
      responses: { '200': { description: OK }, '400': { description: 菜单数量、标识或字段不合法 } }
  /games/number-merge:
    get:
      summary: 读取当前成员的数字熔炉活动存档、长期统计和最近八局；首次进入自动开局
      responses:
        '200':
          description: 当前完整游戏快照
          content: { application/json: { schema: { $ref: '#/components/schemas/NumberMergeGame' } } }
  /games/number-merge/move:
    post:
      summary: 由服务端沿指定方向合并、计分、随机出牌并保存
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/GameMoveRequest' } } }
      responses: { '200': { description: 移动后的快照 }, '400': { description: 方向不合法 }, '409': { description: 存档已在另一页面更新 } }
  /games/number-merge/undo:
    post:
      summary: 撤销最近一次有效移动
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/GameRevisionRequest' } } }
      responses: { '200': { description: 撤销后的快照 }, '409': { description: 存档已在另一页面更新 } }
  /games/number-merge/restart:
    post:
      summary: 归档走过的当前棋盘并开始新一局
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/GameRevisionRequest' } } }
      responses: { '200': { description: 新一局快照 }, '409': { description: 存档已在另一页面更新 } }
  /games/memory-match:
    get:
      summary: 读取当前成员的服务端权威记忆翻牌牌局；首次进入自动洗牌
      responses:
        '200':
          description: 当前完整牌局快照
          content: { application/json: { schema: { $ref: '#/components/schemas/MemoryMatchGame' } } }
  /games/memory-match/flip:
    post:
      summary: 由服务端翻牌、判断配对、计步并保存当前牌局
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/MemoryMatchFlipRequest' } } }
      responses: { '200': { description: 翻牌后的权威快照 }, '400': { description: 位置或状态不合法 }, '409': { description: 牌局已在另一页面更新 } }
  /games/memory-match/restart:
    post:
      summary: 保留最佳步数并开始新的服务端牌序
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/GameRevisionRequest' } } }
      responses: { '200': { description: 新一局快照 }, '409': { description: 牌局已在另一页面更新 } }
  /public/site-info:
    get:
      summary: 免登录读取网站公开信息，供登录页、分享页与页脚展示
      security: []
      responses: { '200': { description: OK } }
  # 飞书群聊同步知识库
  /feishu/chat-sync/config:
    get:
      summary: 同步配置（appSecret 只回脱敏形态）
      description: App、群、知识库和发送者映射通过一次批量 SQL 读取为同一事务快照。
      responses: { '200': { description: OK } }
    put:
      summary: 保存同步配置（appSecret 省略表示保留原值）
      description: 多个 feishu.chat-sync.* 配置键在一个数据库事务中整体保存，不暴露半套新配置。
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/SaveChatSyncConfigRequest' } } }
      responses: { '200': { description: OK } }
  /feishu/chat-sync/chats:
    get:
      summary: 机器人所在的群列表
      responses: { '200': { description: OK }, '400': { description: 尚未填写应用凭据 }, '502': { description: 调用飞书失败（code=50203） } }
  /feishu/chat-sync/members:
    get:
      summary: 群成员列表（已套用现有的 ID → 人名映射）
      parameters:
        - { name: chatId, in: query, required: false, schema: { type: string } }
      responses: { '200': { description: OK }, '400': { description: 尚未选择群聊 } }
  /feishu/chat-sync/run:
    post:
      summary: 手动同步某一天（默认今天）或一段连续日期，批量时逐日覆盖各自当天的归档
      description: >
        每日消息查询前签发数据库单调版本；归档按知识库、chatId 和自然日唯一定位，只有同一身份的更新版本能 CAS 覆盖文档，旧快照失败。
        V77 migration 仅按执行时的当前群 / KB 回填旧日期标题：重复候选优先取未软删除文档中 id 最小的一篇，仅全部已删时回退至全体最小 id；运行时不认领无身份旧文档。软删除的同身份文档重同步时原地恢复，
        切换群后同日创建独立文档，不覆盖旧群来源链接。
        飞书图片走 SHA-256 唯一去重写入，并发冲突复用已落库图片；普通用户上传不启用该唯一去重键。
        飞书连接 / 读取超时分别为 10 秒 / 30 秒。
      parameters:
        - { name: day, in: query, required: false, schema: { type: string, format: date } }
        - { name: startDay, in: query, required: false, schema: { type: string, format: date }, description: 批量同步起始日期，须与 endDay 同时提供 }
        - { name: endDay, in: query, required: false, schema: { type: string, format: date }, description: 批量同步结束日期，须与 startDay 同时提供；一次最多 366 天 }
      responses: { '200': { description: OK }, '400': { description: 配置不完整 }, '502': { description: 调用飞书失败（code=50203） } }
  # 群聊快速收集：@机器人 记入发言人自己的任务列表（见 ADR-027、ADR-102）
  /feishu/quick-collect/config:
    get:
      summary: 快速收集配置（Verification Token / Encrypt Key 只回脱敏形态）
      responses: { '200': { description: OK } }
    put:
      summary: 保存快速收集配置与表情工作流（密文字段省略表示保留原值）
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/SaveQuickCollectConfigRequest' } } }
      responses: { '200': { description: OK } }
  /feishu/text-polish/config:
    get:
      summary: 群聊润色机器人配置；只返回 Webhook 稳定 id 和名称，不返回地址
      responses:
        '200':
          description: OK
          content: { application/json: { schema: { $ref: '#/components/schemas/FeishuTextPolishConfigResponse' } } }
    put:
      summary: 保存群聊润色开关、精确触发名称和出站 Webhook
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/SaveFeishuTextPolishConfigRequest' } } }
      responses:
        '200':
          description: 保存后的安全配置
          content: { application/json: { schema: { $ref: '#/components/schemas/FeishuTextPolishConfigResponse' } } }
        '400': { description: 触发名称为空/超长，或启用时未选择真实可用的 Webhook }
  /feishu/events:
    post:
      summary: 公开：飞书统一回调（URL 校验、链接预览、群消息与卡片交互）
      description: |
        免登录接口，请求真实性由 Verification Token / Encrypt Key 保证。
        不返回 ApiResponse 包装：url_verification 时按飞书协议回 { challenge }；url.preview.get 命中
        当前站点的任务/子任务、文档/小记或天人一卦公开分享地址时，返回 inline + raw card，外域、
        未知、无效或已删除地址回空对象；其余事件按各自飞书协议响应。
        普通群聊不处理。群里 @机器人 的文本 / 富文本消息会根据发言人已绑定的飞书身份，
        建成其本人的未排期任务；“记录任务”与“记录想法”前缀会被去除并区分来源标签。
        未绑定发言人时只回复绑定指引，不回退到默认负责人；事件结果持久化去重。
        语音条不做转写，回一句提示让发送者改用飞书的语音转文字。
      requestBody:
        required: false
        content: { application/json: { schema: { type: object } } }
      responses:
        '200': { description: URL 校验 challenge、链接预览内容、卡片反馈 toast 或空对象 }
        '400': { description: Verification Token 不匹配或事件解密失败 }
  # 开启快速收集或群聊润色时，服务端使用已配群聊归档 App 凭据每 15 秒主动读取目标群。
  # 快速收集精确匹配应用机器人 open_id，并主动读取人工派工表情和撤回状态；群聊润色精确匹配配置的 mention 名称。
  # 两条链路分别持久去重，表情派工仍校验任务创建者身份。
  /files:
    get:
      summary: 当前成员可见的文件元数据列表（含 contentType 与可空 projectId，不读取二进制正文）
      parameters: [ { name: projectId, in: query, required: false, schema: { type: string }, description: 指定时只返回该可见项目的文件 } ]
      responses: { '200': { description: OK }, '404': { description: 项目不存在或不可见 } }
    post:
      summary: 上传通用文件（单个不超过系统设置，且最大 50MB）
      requestBody: { required: true, content: { multipart/form-data: { schema: { type: object, required: [file], properties: { file: { type: string, format: binary }, projectId: { type: string, nullable: true } } } } } }
      responses: { '200': { description: 返回带直链的文件项 }, '400': { description: 空文件或超过限制 } }
  /files/{id}/meta:
    get: { summary: 公开：下载确认页要展示的文件信息（不含正文）, parameters: [ { name: id, in: path, required: true, schema: { type: string } } ], responses: { '200': { description: OK }, '404': { description: 不存在 } } }
  /files/{id}/challenge:
    post: { summary: 公开：取下载挑战；算术题关闭时题面为空，但 challengeId 仍只能兑换一次票据, parameters: [ { name: id, in: path, required: true, schema: { type: string } } ], responses: { '200': { description: 返回 challengeId、question 与 captchaEnabled }, '404': { description: 不存在 } } }
  /files/{id}/ticket:
    post:
      summary: 公开：用答案换一张一次性下载票据（120 秒内有效、用完即废）
      parameters: [ { name: id, in: path, required: true, schema: { type: string } } ]
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, properties: { challengeId: { type: string }, answer: { type: string } } } } }
      responses: { '200': { description: 返回 ticket }, '400': { description: 答案错误或验证已过期 }, '404': { description: 不存在 } }
  /files/{id}/download:
    get:
      summary: 下载文件正文；需带一次性票据，或本人已登录
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - { name: ticket, in: query, required: false, schema: { type: string }, description: '由 /files/{id}/ticket 换取，只能用一次' }
      responses:
        '200': { description: 文件字节流 }
        '401': { description: 没有票据也没有登录会话（code=40100） }
        '404': { description: 不存在 }
  /files/{id}/stream:
    get:
      summary: 登录后播放真实音频；支持单段 HTTP Range 和进度拖动
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - { name: Range, in: header, required: false, schema: { type: string }, example: 'bytes=0-1048575' }
      responses:
        '200': { description: 完整音频字节流，Content-Disposition 为 inline }
        '206': { description: 指定范围的音频字节流，带 Content-Range 与 Accept-Ranges }
        '400': { description: 文件不是受支持的音频 }
        '401': { description: 没有有效 WAO 登录会话 }
        '416': { description: Range 不合法或越界 }
  /files/{id}/preview:
    get:
      summary: 登录成员站内读取 2MB 以内的 UTF-8 Markdown 正文
      parameters: [ { name: id, in: path, required: true, schema: { type: string } } ]
      responses: { '200': { description: 返回 Markdown 原文，由前端净化渲染 }, '400': { description: 非 Markdown、超限或非 UTF-8 }, '404': { description: 不存在或所属项目不可见 } }
  /files/{id}:
    patch:
      summary: 修改文件在 WAO 内的展示名称，原始下载文件名保持不变
      parameters: [ { name: id, in: path, required: true, schema: { type: string } } ]
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [displayName], properties: { displayName: { type: string, minLength: 1, maxLength: 255 } } } } } }
      responses: { '200': { description: 返回更新后的文件项 }, '400': { description: 展示名为空或超长 }, '404': { description: 文件不存在或所属项目不可见 } }
    delete: { summary: 删除文件, parameters: [ { name: id, in: path, required: true, schema: { type: string } } ], responses: { '200': { description: OK }, '404': { description: 不存在 } } }
  # 单文件 HTML 托管（见 docs/adr/042-hosted-html-pages.md）
  /hosted-pages:
    get:
      summary: 按来源类型读取托管页元数据列表（不读取 HTML 与 icon 正文）
      parameters:
        - { name: sourceType, in: query, required: false, schema: { type: string, enum: [ALL, MANUAL_UPLOAD, AI_RUN_REPORT], default: ALL } }
        - { name: projectId, in: query, required: false, schema: { type: string }, description: 指定时只返回该可见项目的页面 }
      responses:
        '200': { description: 每项 sourceType 为人工上传或 AI Run 报告 }
        '400': { description: 来源类型不受支持 }
    post:
      summary: 上传 UTF-8 单文件 HTML 并配置唯一链接后缀、标题和可选 icon
      requestBody: { required: true, content: { multipart/form-data: { schema: { type: object, required: [html, slug, title], properties: { html: { type: string, format: binary }, slug: { type: string }, title: { type: string }, icon: { type: string, format: binary }, projectId: { type: string, nullable: true } } } } } }
      responses: { '200': { description: 已发布 }, '400': { description: 文件、后缀或标题无效 } }
  /hosted-pages/{id}:
    put:
      summary: 修改托管页；HTML 与 icon 不上传时保留原内容
      parameters: [ { name: id, in: path, required: true, schema: { type: string } } ]
      responses: { '200': { description: 已更新 }, '404': { description: 不存在 } }
    delete: { summary: 删除托管页并立即使公开链接失效, responses: { '200': { description: OK }, '404': { description: 不存在 } } }
  /pages/{slug}:
    get:
      summary: 公开直出隔离运行的托管 HTML
      security: []
      responses: { '200': { description: UTF-8 HTML }, '404': { description: 不存在 } }
  /pages/{slug}/icon:
    get: { summary: 公开读取托管页 icon, security: [], responses: { '200': { description: 图片正文 }, '404': { description: 未配置 icon 或页面不存在 } } }
  # 图床（见 docs/adr/012-markdown-rendering-and-image-store.md）
  /images:
    get:
      summary: 当前成员可见的图床列表；可按 projectId 读取项目图片
      parameters: [ { name: projectId, in: query, required: false, schema: { type: string } } ]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties: { data: { type: array, items: { $ref: '#/components/schemas/ImageItem' } } }
    post:
      summary: 上传图片（单张不超过系统设置且最大 10MB，仅 PNG/JPEG/GIF/WebP/SVG/BMP）
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: { type: string, format: binary }
                source: { type: string, description: 来源描述，如「任务 · 整理证件盒」 }
                projectId: { type: string, nullable: true, description: 可见项目归属 }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties: { data: { $ref: '#/components/schemas/ImageItem' } }
        '400': { description: 文件为空、类型不支持或超过大小上限 }
  /images/{id}/raw:
    get:
      summary: 直出图片正文（内容按 id 寻址且不可变，长期缓存）
      parameters: [ { name: id, in: path, required: true, schema: { type: string } } ]
      responses:
        '200': { description: 图片字节流, content: { image/*: { schema: { type: string, format: binary } } } }
        '404': { description: 不存在 }
  /images/{id}:
    delete:
      summary: 删除上传的图片
      parameters: [ { name: id, in: path, required: true, schema: { type: string } } ]
      responses: { '200': { description: OK } }
  # 任务分享（公开只读，免登录；见 docs/adr/013-public-task-share-links.md）
  /share/tasks/{id}:
    get:
      summary: 任务的公开分享视图（含子任务，不含负责人/评论/活动）
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - { name: openOnly, in: query, required: false, schema: { type: boolean, default: false }, description: 只带上未完成的子任务 }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties: { data: { $ref: '#/components/schemas/SharedTask' } }
        '404': { description: 任务不存在 }
  /share/tasks/{id}/subs/{subId}:
    get:
      summary: 单个子任务的公开分享视图（只含它自身的详情与描述）
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - { name: subId, in: path, required: true, schema: { type: string }, description: 子任务 id；历史数据用 `<taskId>#<下标>` }
      responses:
        '200': { description: OK }
        '404': { description: 任务或子任务不存在 }
  /share/tasks/{id}.md:
    get:
      summary: 任务全文的 Markdown 直读地址（供 AI 一次 GET 取全部上下文；图片为绝对地址）
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - { name: openOnly, in: query, required: false, schema: { type: boolean, default: false }, description: 只带上未完成的子任务 }
      responses:
        '200': { description: OK, content: { text/markdown: { schema: { type: string } } } }
        '404': { description: 任务不存在 }
  /share/tasks/{id}/subs/{subId}.md:
    get:
      summary: 子任务的 Markdown 直读地址
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - { name: subId, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: OK, content: { text/markdown: { schema: { type: string } } } }
        '404': { description: 任务或子任务不存在 }
  /share/docs/{id}:
    get:
      summary: 文档或小记的公开只读投影（不含作者、关联、反向链接和协同状态）
      parameters: [ { name: id, in: path, required: true, schema: { type: string } } ]
      responses: { '200': { description: OK }, '404': { description: 文档不存在或已删除 } }
  /share/docs/{id}.md:
    get:
      summary: 文档或小记的 Markdown 直读地址（站内图片和链接为绝对地址）
      parameters: [ { name: id, in: path, required: true, schema: { type: string } } ]
      responses:
        '200': { description: OK, content: { text/markdown: { schema: { type: string } } } }
        '404': { description: 文档不存在或已删除 }
  /share/tianren/{token}:
    get:
      summary: 以不可猜测凭据读取公开卦象及该卦最新一条 AI 自照投影
      parameters: [ { name: token, in: path, required: true, schema: { type: string, pattern: '^[0-9a-f]{32}$' } } ]
      responses: { '200': { description: OK }, '404': { description: 凭据无效或分享不存在 } }
  # 密钥库域（关系表；密码以 AES-256-GCM 服务端加密存储，见 docs/adr/009-vault-server-side-encryption.md）
  # 归属到人：所有 /vault/* 接口只在当前登录成员自己的分组范围内生效，别人的分组一律按 404 处理
  # （见 docs/adr/024-vault-per-member-ownership.md）。
  # 默认分组由分组上的 isDefault 标出，与名字无关：改名后它还是默认分组
  # （见 docs/adr/036-vault-default-group-identity.md）。
  /vault:
    get: { summary: 当前成员自己的密钥库分组及条目列表（分组带 isDefault；不含密码明文，仅 hasSecret 标记）, responses: { '200': { description: OK } } }
  /vault/groups:
    post: { summary: 新建分组（归属当前登录成员）, responses: { '200': { description: OK } } }
  /vault/groups/{id}:
    patch: { summary: 重命名分组, parameters: [ { name: id, in: path, required: true, schema: { type: string } } ], responses: { '200': { description: OK }, '404': { description: 不存在 } } }
    delete: { summary: 删除分组（级联删除条目；isDefault 的分组不可删，改过名也一样）, parameters: [ { name: id, in: path, required: true, schema: { type: string } } ], responses: { '200': { description: OK }, '400': { description: 默认分组不能删除 }, '404': { description: 不存在或不属于当前成员 } } }
  /vault/groups/order:
    put: { summary: 保存拖拽后的分组顺序, responses: { '200': { description: OK } } }
  /vault/items:
    post: { summary: 新建条目（groupId 可空，默认进入自己的默认分组；secret 落库前加密）, responses: { '200': { description: OK }, '404': { description: 分组不存在或不属于当前成员 } } }
  /vault/items/{id}:
    patch: { summary: 局部更新条目, parameters: [ { name: id, in: path, required: true, schema: { type: string } } ], responses: { '200': { description: OK }, '404': { description: 不存在 } } }
    delete: { summary: 删除条目, parameters: [ { name: id, in: path, required: true, schema: { type: string } } ], responses: { '200': { description: OK }, '404': { description: 不存在 } } }
  /vault/items/{id}/reveal:
    post: { summary: 解密并返回一次密码明文（未设置密码时 secret 为 null）, parameters: [ { name: id, in: path, required: true, schema: { type: string } } ], responses: { '200': { description: OK }, '404': { description: 不存在 } } }
  /calendar/events: { get: { summary: 日历事件列表, responses: { '200': { description: OK } } } }
  /schedule: { get: { summary: 今日日程列表, responses: { '200': { description: OK } } } }
  /suggestions: { get: { summary: AI 建议列表, responses: { '200': { description: OK } } } }
  /goals: { get: { summary: 目标胶囊列表, responses: { '200': { description: OK } } } }
components:
  securitySchemes:
    memoryBearer:
      type: http
      scheme: bearer
      bearerFormat: wao_mcp
  schemas:
    ReviewableTask:
      type: object
      required: [taskId, title, projectId, projectName, priority, taskStatus, action]
      properties:
        taskId: { type: string }
        title: { type: string }
        projectId: { type: string }
        projectName: { type: string }
        priority: { type: string, enum: [P0, P1, P2, P3] }
        taskStatus: { type: string }
        action: { type: string, enum: [ACCEPTANCE, RETRY] }
        runId: { type: string, nullable: true, description: 人工标记待验证且没有运行时为空 }
        deliveryStage: { type: string, nullable: true }
        resultPreview: { type: string, nullable: true, description: 最近运行结果摘要的首行，不伪造缺失内容 }
        finishedAt: { type: string, format: date-time, nullable: true }
    WorkspaceLink:
      type: object
      required: [id, title, url, description, environment, icon, order, favorite]
      properties:
        id: { type: string, maxLength: 32 }
        title: { type: string, minLength: 1, maxLength: 100 }
        url: { type: string, maxLength: 2048, description: 仅允许无账号密码的 http / https 地址 }
        description: { type: string, maxLength: 300 }
        environment: { type: string, maxLength: 30 }
        icon: { type: string, pattern: '^ri-[a-z0-9-]+$' }
        order: { type: integer, minimum: 0 }
        favorite: { type: boolean }
    WorkspaceGroup:
      type: object
      required: [id, name, icon, order, links]
      properties:
        id: { type: string, maxLength: 32 }
        name: { type: string, minLength: 1, maxLength: 40 }
        icon: { type: string, pattern: '^ri-[a-z0-9-]+$' }
        order: { type: integer, minimum: 0 }
        links: { type: array, items: { $ref: '#/components/schemas/WorkspaceLink' } }
    CreateWorkspaceRequest:
      type: object
      required: [name]
      properties:
        name: { type: string, minLength: 1, maxLength: 60 }
        description: { type: string, maxLength: 400 }
        projectId: { type: string, maxLength: 32, nullable: true, description: 必须是当前成员可见项目 }
    SaveWorkspaceRequest:
      allOf:
        - { $ref: '#/components/schemas/CreateWorkspaceRequest' }
        - type: object
          required: [groups]
          properties:
            groups: { type: array, maxItems: 12, items: { $ref: '#/components/schemas/WorkspaceGroup' } }
    AssistantChatRequest:
      type: object
      required: [message]
      properties:
        message: { type: string, minLength: 1, maxLength: 4000 }
        history:
          type: array
          maxItems: 10
          items:
            type: object
            required: [role, content]
            properties:
              role: { type: string, enum: [user, assistant] }
              content: { type: string, minLength: 1, maxLength: 4000 }
        pageContext: { type: string, maxLength: 10000 }
        conversationId: { type: string, maxLength: 32 }
        aiCapabilityId: { type: string, maxLength: 32, description: 可省略；默认 local-codex }
        sourceFilter: { $ref: '#/components/schemas/AssistantSourceFilter' }
    PolishTextRequest:
      type: object
      required: [text]
      properties:
        text: { type: string, minLength: 1, maxLength: 4000, description: 文档中明确选中的 Markdown 或纯文本 }
    AssistantSourceFilter:
      type: object
      properties:
        assetTypes:
          type: array
          maxItems: 5
          items: { type: string, enum: [memory, chat, knowledge, project, task] }
        chatIds:
          type: array
          maxItems: 20
          items: { type: string, maxLength: 128 }
        senders:
          type: array
          maxItems: 30
          items: { type: string, maxLength: 80 }
        dateFrom: { type: string, format: date }
        dateTo: { type: string, format: date }
        projectIds:
          type: array
          maxItems: 30
          items: { type: string, maxLength: 32 }
    ApiResponse:
      type: object
      properties:
        code: { type: integer, description: 0 为成功 }
        message: { type: string }
        data: {}
        timestamp: { type: integer, format: int64 }
    Member:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        initial: { type: string }
        color: { type: string }
        role: { type: string }
    ResetMemberPasswordRequest:
      type: object
      required: [password]
      properties:
        password: { type: string, minLength: 8, maxLength: 128 }
    Project:
      type: object
      description: 字段与前端 Project 一致（含 milestones/trend/blockers/activity 等嵌套）
      properties:
        id: { type: string }
        name: { type: string }
        icon: { type: string, description: remixicon 类名，如 ri-stack-line }
        area: { type: string }
        status: { type: string, enum: [进行中, 有风险, 规划中, 已完成, 已搁置] }
        health: { type: string }
        progress: { type: integer }
        owner: { type: string }
        members: { type: array, items: { type: string } }
        start: { type: string }
        due: { type: string }
        visibility: { type: string }
        updated: { type: string }
        goal: { type: string }
        notifyEnabled: { type: boolean, description: 这个项目的动静是否发飞书群；关掉后新建任务 / 状态变化 / 子任务 / 评论 / AI 执行都不发 }
        taskGroups:
          type: array
          description: 自定义任务分组（分组视图），最多 6 个；没建过分组时为空数组
          items: { $ref: '#/components/schemas/TaskGroup' }
    Task:
      type: object
      description: 字段与前端 Task 一致（含 steps/subs/comments/activity 等嵌套）
      properties:
        id: { type: string }
        title: { type: string }
        project: { type: string }
        status: { type: string, enum: [待办, 收集中, 进行中, AI 进行中, 待验证, 已完成] }
        pr: { type: string, enum: [P0, P1, P2, P3] }
        owner: { type: string }
        createdBy: { type: string, nullable: true, description: 创建人成员 ID；历史任务缺少可靠来源时为 null }
        createdAt: { type: string, nullable: true, description: 任务真实创建时间；V79 前且无法从稳定时间戳 id 回填的极早期任务为 null }
        groupId: { type: string, nullable: true, description: 所属任务分组 id；未归组时为 null，分组视图按第一个分组显示 }
        activity:
          type: array
          items: { $ref: '#/components/schemas/Activity' }
        start: { type: string, description: 开始日期 yyyy-MM-dd；未排期时为空 }
        due: { type: string }
        startAt: { type: string, nullable: true, description: '时间段开始，格式 yyyy-MM-ddTHH:mm；普通截止任务为 null' }
        endAt: { type: string, nullable: true, description: 时间段结束，必须晚于 startAt }
        desc: { type: string, description: 描述，Markdown 文本 }
        subs:
          type: array
          description: 子任务（内嵌，不是独立任务实体）
          items: { $ref: '#/components/schemas/Step' }
        steps:
          type: array
          items: { $ref: '#/components/schemas/Step' }
        files:
          type: array
          description: 关联文件；真实文件带 file_blob 的稳定 id，历史展示附件可能没有 id
          items: { $ref: '#/components/schemas/FileRef' }
        hostedPages:
          type: array
          description: 关联的人工上传 HTML 托管页 id；历史任务缺省为空数组
          items: { type: string }
        docs:
          type: array
          description: 关联知识文档 id
          items: { type: string }
        linkTasks:
          type: array
          description: 关联任务
          items: { $ref: '#/components/schemas/TaskLink' }
        images:
          type: array
          description: "内嵌图片（/api/images/{id}/raw、data: 或远程链接）"
          items: { $ref: '#/components/schemas/ImageRef' }
        pdcaCycles:
          type: array
          description: 历史兼容字段；按时间顺序保存既有 PDCA 轮次，前端已停止新增、编辑和展示
          items: { $ref: '#/components/schemas/PdcaCycle' }
    TaskGroup:
      type: object
      description: 项目内的任务分组（分组视图）；组内只关心做没做完
      properties:
        id: { type: string }
        name: { type: string, description: 分组名称，用户自己写，最长 20 字 }
    Activity:
      type: object
      description: 活动时间线条目
      properties:
        icon: { type: string }
        color: { type: string }
        text: { type: string, description: 事件描述。带 by 时不含主语（如「创建了任务」），由前端按看的人补上「你」或对方名字；历史数据里写死的「你创建了任务」不带 by }
        time: { type: string, description: '发生时刻（ISO 8601 带 +08:00）；历史数据可能是「刚刚」这类现成文案' }
        by: { type: string, nullable: true, description: 操作人成员 id；系统事件与历史数据为 null }
    Step:
      type: object
      description: 步骤 / 子任务条目；子任务可以有自己的描述与图片
      properties:
        text: { type: string }
        done: { type: boolean }
        id: { type: string, description: 稳定标识；历史数据可能缺失，此时按下标兜底 }
        desc: { type: string, description: 子任务描述，Markdown 文本 }
        images:
          type: array
          items: { $ref: '#/components/schemas/ImageRef' }
    ImageRef:
      type: object
      properties:
        name: { type: string }
        url: { type: string }
    FileRef:
      type: object
      properties:
        id: { type: string, nullable: true, description: 真实文件库 id；历史展示附件可能为空 }
        name: { type: string }
        size: { type: string }
        icon: { type: string }
    TaskLink:
      type: object
      properties:
        id: { type: string, description: 关联任务 id }
        rel: { type: string, description: 关系说明 }
    PdcaCycle:
      type: object
      description: 一轮任务 PDCA；reviewedAt 为空表示尚未闭环
      properties:
        id: { type: string, description: 稳定轮次标识 }
        plan: { type: string, description: P：目标与判定标准 }
        check: { type: string, description: C：实际结果、偏差与原因 }
        act: { type: string, description: A：下一轮保留、修正或尝试的行动 }
        outcome: { type: string, nullable: true, enum: [达成, 部分达成, 未达成] }
        startedAt: { type: string, description: ISO 8601 开始时间 }
        reviewedAt: { type: string, nullable: true, description: ISO 8601 闭环时间 }
    ImageItem:
      type: object
      description: 图床条目
      properties:
        id: { type: string, description: 上传的图片才有；内置演示数据为 null }
        name: { type: string }
        size: { type: string, description: 人类可读大小，如 640 KB }
        time: { type: string }
        from: { type: string, description: 来源描述 }
        url: { type: string, description: "上传的图为 /api/images/{id}/raw" }
        c1: { type: string }
        c2: { type: string }
        projectId: { type: string, nullable: true, description: 为空表示全局未分类 }
    FileItem:
      type: object
      description: 真实文件库元数据；列表不返回二进制正文
      properties:
        id: { type: string }
        name: { type: string }
        displayName: { type: string, nullable: true, description: WAO 内自定义展示名；为空时界面显示原始 name }
        contentType: { type: string, description: 上传时持久化的 MIME，用于识别音频等文件种类 }
        size: { type: string, description: 人类可读大小 }
        icon: { type: string }
        time: { type: string }
        createdAt: { type: string, nullable: true, description: 文件真实创建时间；time 仅作本地化展示 }
        by: { type: string, description: 上传人成员 id }
        link: { type: string, description: 既有附件下载地址 }
        projectId: { type: string, nullable: true, description: 为空表示全局未分类 }
    SharedTask:
      type: object
      description: 公开分享视图；刻意不含负责人、参与人、评论与活动时间线
      properties:
        kind: { type: string, enum: [task, sub] }
        id: { type: string }
        subId: { type: string, nullable: true }
        title: { type: string }
        status: { type: string }
        pr: { type: string, nullable: true }
        due: { type: string, nullable: true }
        project: { type: string }
        desc: { type: string }
        images:
          type: array
          items: { $ref: '#/components/schemas/ImageRef' }
        subs:
          type: array
          description: kind 为 sub 时为空
          items: { $ref: '#/components/schemas/Step' }
        pdcaCycles:
          type: array
          description: 历史兼容的主任务 PDCA 记录；kind 为 sub 时为空，公开网页和 Markdown 不再渲染
          items: { $ref: '#/components/schemas/PdcaCycle' }
    CreateProjectRequest:
      type: object
      required: [name]
      properties:
        name: { type: string }
        area: { type: string }
        goal: { type: string }
        visAll: { type: boolean }
        announce: { type: boolean, default: true, description: false 时静默收进想法箱，首次开始推进时再通知团队 }
    PatchProjectRequest:
      type: object
      description: 空字段不改
      properties:
        name: { type: string }
        area: { type: string }
        status: { type: string, enum: [进行中, 有风险, 规划中, 已完成, 已搁置] }
        goal: { type: string }
        icon: { type: string }
        notifyEnabled: { type: boolean, description: 通知开关；null 表示不改 }
        taskGroups:
          type: array
          nullable: true
          description: 任务分组的完整列表（整表替换）；null 表示不改，空数组表示清空。服务端会去掉空名、按 id 去重并截断到 6 个
          items: { $ref: '#/components/schemas/TaskGroup' }
    CreateTaskRequest:
      type: object
      required: [title, project]
      properties:
        title: { type: string }
        project: { type: string }
        pr: { type: string }
        owner: { type: string }
        due: { type: string, description: ISO 日期 }
        startAt: { type: string, nullable: true, description: '时间段开始，格式 yyyy-MM-ddTHH:mm' }
        endAt: { type: string, nullable: true, description: 时间段结束，必须晚于 startAt }
        desc: { type: string, description: 描述，Markdown 文本 }
        groupId: { type: string, nullable: true, description: 落进哪个任务分组（分组视图里的「+」带上它） }
        images:
          type: array
          items: { $ref: '#/components/schemas/ImageRef' }
        pdcaCycles:
          type: array
          description: 历史客户端兼容字段；当前前端不再提供 PDCA 新建入口
          items: { $ref: '#/components/schemas/PdcaCycle' }
    PatchTaskRequest:
      type: object
      properties:
        title: { type: string }
        status: { type: string }
        pr: { type: string }
        owner: { type: string }
        desc: { type: string }
        start: { type: string, description: "开始日期 yyyy-MM-dd；null 表示不改，空串表示清空" }
        due: { type: string, description: "截止日期 yyyy-MM-dd；null 表示不改，空串表示清空" }
    CreateDocRequest:
      type: object
      required: [kbId, folderId]
      description: kbId + folderId 建立文档与知识库的关联；作者不在请求体里，由服务端按当前会话署名；blocks 可用于一次原子导入成稿
      properties:
        kbId: { type: string }
        folderId: { type: string }
        title: { type: string }
        templateId: { type: string, description: 可选；从当前成员的该模板复制正文快照 }
        blocks: { type: array, maxItems: 5000, description: 可选；与 templateId 互斥，随新文档原子写入, items: { $ref: '#/components/schemas/DocTemplateBlock' } }
    DocTemplateBlock:
      type: object
      description: 模板正文块；服务端忽略未知字段并限制整份 JSON 序列化长度
      properties:
        call: { type: string, nullable: true }
        h: { type: string, nullable: true }
        p: { type: string, nullable: true }
        ul: { type: array, nullable: true, items: { type: string } }
        q: { type: array, nullable: true, items: { type: string } }
        hLevel: { type: integer, nullable: true, minimum: 1, maximum: 3 }
    CreateDocTemplateRequest:
      type: object
      required: [name, sourceDocId]
      properties:
        name: { type: string, minLength: 1, maxLength: 128 }
        description: { type: string, maxLength: 512 }
        sourceDocId: { type: string, minLength: 1 }
        blocks: { type: array, maxItems: 5000, items: { $ref: '#/components/schemas/DocTemplateBlock' } }
    PatchDocTemplateRequest:
      type: object
      required: [expectedUpdatedAt]
      properties:
        name: { type: string, maxLength: 128, nullable: true }
        description: { type: string, maxLength: 512, nullable: true }
        blocks: { type: array, maxItems: 5000, nullable: true, items: { $ref: '#/components/schemas/DocTemplateBlock' } }
        expectedUpdatedAt: { type: string, minLength: 1, maxLength: 40, description: 上次读取到的服务端本地 ISO-8601 updatedAt }
    DocTemplate:
      type: object
      required: [id, name, description, blocks, sourceDocId, createdAt, updatedAt]
      properties:
        id: { type: string }
        name: { type: string }
        description: { type: string }
        blocks: { type: array, items: { $ref: '#/components/schemas/DocTemplateBlock' } }
        sourceDocId: { type: string }
        createdAt: { type: string, description: 服务端本地 ISO-8601 日期时间，不携带 UTC 偏移 }
        updatedAt: { type: string, description: 服务端本地 ISO-8601 日期时间，不携带 UTC 偏移；也是 PATCH 的并发版本 }
    CreateNoteRequest:
      type: object
      description: 小记正文；title 留空时由正文首行推导
      properties:
        title: { type: string }
        blocks: { type: array, items: { type: object } }
    DocPresenceRequest:
      type: object
      description: 一次在场心跳
      properties:
        line: { type: integer, description: 光标所在的顶层块序号，-1 表示只在查看 }
        editing: { type: boolean, description: 上一个心跳周期内是否有输入 }
        rev: { type: integer, description: 客户端手上的正文版本号 }
    CompleteAiRunRequest:
      type: object
      description: Runner 回传的执行结果与本次用量（见 ADR-026）
      properties:
        exitCode: { type: integer, description: 0 为成功；非 0 时运行标记为 failed }
        resultSummary: { type: string, description: AI 的最终答复摘要 }
        sessionId: { type: string, description: CLI 会话 id，供后续原会话续跑 }
        model: { type: string, nullable: true, description: 本次输出 token 最多的模型 }
        models: { type: string, nullable: true, description: 本次用到的全部模型，逗号分隔 }
        inputTokens: { type: integer, format: int64, description: 非缓存输入 token }
        outputTokens: { type: integer, format: int64 }
        cachedInputTokens: { type: integer, format: int64, description: 缓存读取与缓存写入之和 }
        totalTokens: { type: integer, format: int64, description: 三类 token 合计 }
        aiExecutionDurationMs: { type: integer, format: int64, nullable: true, description: Runner 单调时钟实测的本回合 AI CLI / app-server 执行毫秒数 }
        costUsd: { type: number, nullable: true, description: 折算额度（美元）；Codex 不回传时为 null }
        skillAudits: { type: array, description: 固定 Skill 的实际 loaded / failed / incompatible 装配结果, items: { type: object } }
    CompleteAiAssistantRunRequest:
      type: object
      additionalProperties: false
      required: [claimToken, exitCode]
      description: assistant-v2 完成 attempt；非零退出时 Runner 必须将 response 置空，服务端也不保存部分输出
      properties:
        claimToken: { type: string, minLength: 1, maxLength: 64 }
        exitCode: { type: integer }
        response: { type: string, maxLength: 30000 }
        error: { type: string, maxLength: 2000, description: Runner 诊断字段；服务端只落库稳定有界错误 }
    AiRunUsage:
      type: object
      description: 运行详情里返回的用量账单
      properties:
        model: { type: string, nullable: true }
        models: { type: string, nullable: true }
        inputTokens: { type: integer, format: int64 }
        outputTokens: { type: integer, format: int64 }
        cachedInputTokens: { type: integer, format: int64 }
        totalTokens: { type: integer, format: int64 }
        costUsd: { type: number, nullable: true }
        recorded: { type: boolean, description: false 表示这次没记上账，不是「用了 0」 }
    CreateAiRunsRequest:
      type: object
      required: [taskIds]
      description: subId 非空时只跑这一条子任务，此时 taskIds 只能有一个任务
      properties:
        taskIds: { type: array, items: { type: string }, minItems: 1 }
        subId: { type: string, nullable: true, description: 子任务标识；历史数据没有 id 时形如 <taskId>#<下标> }
        engine: { type: string, nullable: true, enum: [codex, claude, qoder, auto], description: 留空沿用项目默认工具 }
        runnerId: { type: string, nullable: true, description: 留空表示由任意在线且支持该工具的电脑领取 }
        accountId: { type: string, nullable: true, description: 留空使用执行电脑本地登录态 }
        model: { type: string, nullable: true, enum: [gpt-5.6-sol, gpt-5.6-terra, gpt-5.6-luna], description: 仅 Codex 官方登录态生效；留空使用后台默认模型 }
        reasoningEffort: { type: string, nullable: true, enum: [high, medium, low], description: 仅 Codex 官方登录态生效；留空使用后台默认值 }
        planMode: { type: boolean, default: false, description: 仅 Codex 生效；先形成计划再连续执行，问题自动采用推荐项 }
        mergeTasks: { type: boolean, default: false, description: true 时把同一项目的多条主任务合并为一次运行；false 时逐条创建独立运行 }
    SaveQuickCollectConfigRequest:
      type: object
      description: 字段为 null 表示不修改；密文字段留空即保留已存的那一份
      properties:
        enabled: { type: boolean, description: 是否接收群里 @机器人 记入发言人本人任务列表 }
        projectId: { type: string, description: 落点项目；留空时自动找「Wa All in One」 }
        verificationToken: { type: string, description: 飞书事件订阅的 Verification Token }
        encryptKey: { type: string, description: 飞书事件订阅的 Encrypt Key }
        mentionOpenIds:
          type: array
          items: { type: string }
          description: 任务进入「收集中」时要 @ 的成员 open_id；操作人自己永远会被排除
        receivedEmoji:
          type: string
          enum: [GET, DONE, StatusInFlight, CheckMark]
          description: 任务已保存回执表情；默认 GET
        triggerEmoji:
          type: string
          enum: [GET, DONE, StatusInFlight, CheckMark]
          description: 成员手工派工及 AI Run 执行中表情；默认 StatusInFlight
        completedEmoji:
          type: string
          enum: [GET, DONE, StatusInFlight, CheckMark]
          description: AI Run 成功、任务待验收表情；默认 DONE
    SaveFeishuTextPolishConfigRequest:
      type: object
      properties:
        enabled: { type: boolean, description: 是否读取目标群中的 @润色机器人 消息 }
        webhookId: { type: string, description: 通用 Webhook 注册表稳定 id；接口不接受或返回地址明文 }
        mentionName: { type: string, minLength: 1, maxLength: 64, description: 群内自定义机器人精确显示名 }
    FeishuTextPolishConfig:
      type: object
      required: [enabled, webhookId, webhookName, mentionName]
      properties:
        enabled: { type: boolean }
        webhookId: { type: string }
        webhookName: { type: string, description: 当前稳定 id 对应的安全显示名；配置已删除时为空 }
        mentionName: { type: string, minLength: 1, maxLength: 64 }
    FeishuTextPolishConfigResponse:
      type: object
      required: [code, data]
      properties:
        code: { type: integer }
        data: { $ref: '#/components/schemas/FeishuTextPolishConfig' }
    SaveWebhookRequest:
      type: object
      deprecated: true
      description: 旧版单例兼容请求；url 省略表示不修改地址，明文只在服务端使用
      properties:
        url: { type: string, description: 飞书群机器人 webhook 地址 }
        enabled: { type: boolean }
    FeishuWebhookEndpoint:
      type: object
      required: [id, name, description, urlMask, urlSet, enabled, systemDefault, createdAt, updatedAt]
      description: 通用飞书机器人安全视图；任何响应都不含 Webhook 明文
      properties:
        id: { type: string }
        name: { type: string, maxLength: 64 }
        description: { type: string, maxLength: 255 }
        urlMask: { type: string, description: 仅保留官方域名与 token 末四位的脱敏地址 }
        urlSet: { type: boolean }
        enabled: { type: boolean }
        systemDefault: { type: boolean, description: 是否承接任务、评论和 AI 运行等现有系统通知 }
        createdAt: { type: string, description: 服务端本地 ISO-8601 日期时间，不携带 UTC 偏移 }
        updatedAt: { type: string, description: 服务端本地 ISO-8601 日期时间，不携带 UTC 偏移 }
    SaveFeishuWebhookEndpointRequest:
      type: object
      required: [name, enabled, systemDefault]
      description: 新增时 url 必填；编辑时省略或留空表示保留已加密地址
      properties:
        name: { type: string, minLength: 1, maxLength: 64 }
        description: { type: string, maxLength: 255 }
        url: { type: string, maxLength: 1024, description: 飞书 / Lark 官方 HTTPS 自定义机器人地址 }
        enabled: { type: boolean }
        systemDefault: { type: boolean }
    SiteInfo:
      type: object
      required: [siteName, description, icpNumber, icpUrl]
      properties:
        siteName: { type: string, maxLength: 64, example: WAO Life OS }
        description: { type: string, maxLength: 160, example: 个人事务与 AI 协作系统 }
        icpNumber: { type: string, maxLength: 64, example: 豫ICP备2024105476号-1 }
        icpUrl: { type: string, format: uri, maxLength: 255, example: 'https://beian.miit.gov.cn' }
    NetworkOutageWindow:
      type: object
      required: [enabled, startTime, endTime]
      properties:
        enabled: { type: boolean, description: 是否在该窗口暂停无人值守自动任务 }
        startTime: { type: string, pattern: '^(?:[01]\\d|2[0-3]):[0-5]\\d$', example: '00:00' }
        endTime: { type: string, pattern: '^(?:[01]\\d|2[0-3]):[0-5]\\d$', example: '06:00' }
    FileSettings:
      type: object
      required: [fileMaxMb, imageMaxMb, downloadCaptchaEnabled]
      properties:
        fileMaxMb: { type: integer, minimum: 1, maximum: 50 }
        imageMaxMb: { type: integer, minimum: 1, maximum: 10 }
        downloadCaptchaEnabled: { type: boolean, description: 只控制算术题；下载页与一次性票据始终启用 }
    HttpPerformanceInspectionConfig:
      type: object
      required: [enabled, frequency, time, windowHours, topN, maxEndpointsPerRun]
      properties:
        enabled: { type: boolean }
        frequency: { type: string, enum: [DAILY, WEEKDAYS, WEEKLY] }
        time: { type: string, pattern: '^(?:[01]\\d|2[0-3]):[0-5]\\d$', example: '06:30' }
        windowHours: { type: integer, minimum: 1, maximum: 168 }
        topN: { type: integer, minimum: 1, maximum: 20 }
        maxEndpointsPerRun: { type: integer, minimum: 1, maximum: 20, description: 必须小于等于 topN }
        notificationWebhookId: { type: string, nullable: true, description: 已启用通用 Webhook；空表示系统默认群 }
    MediaAgentMenuConfig:
      type: object
      required: [label, group, order, visible]
      properties:
        label: { type: string, minLength: 1, maxLength: 24, example: 自媒体 Agent }
        group: { type: string, enum: [PUBLIC, PERSONAL, TOOLS], description: 公共、个人或工具分组 }
        order: { type: integer, minimum: 0, maximum: 999, description: 同组内数值越小越靠前 }
        visible: { type: boolean, description: 是否显示在一级导航；隐藏不影响直接 URL 访问 }
    ExternalAppConfig:
      type: object
      required: [id, label, icon, group, order, visible, appUrl, healthUrl, openMode]
      properties:
        id: { type: string, pattern: '^[a-z0-9]+(?:-[a-z0-9]+)*$', maxLength: 40, example: media-agent }
        label: { type: string, minLength: 1, maxLength: 24, example: 自媒体 Agent }
        icon: { type: string, maxLength: 64, example: ri-sparkling-2-line }
        group: { type: string, enum: [PUBLIC, PERSONAL, TOOLS] }
        order: { type: integer, minimum: 0, maximum: 999 }
        visible: { type: boolean }
        appUrl: { type: string, maxLength: 255, example: /agent/, description: 站内绝对路径或 HTTPS 地址 }
        healthUrl: { type: string, maxLength: 255, example: /api/agent/health, description: 可留空；站内绝对路径或 HTTPS 地址 }
        openMode: { type: string, enum: [TAB, NEW_PAGE], default: TAB, description: 在 WAO 页签嵌入或直接打开浏览器新页面 }
    ExternalAppRegistry:
      type: object
      required: [version, apps]
      properties:
        version: { type: integer, minimum: 1, example: 3 }
        apps: { type: array, maxItems: 30, items: { $ref: '#/components/schemas/ExternalAppConfig' } }
    SaveExternalAppRegistryRequest:
      type: object
      required: [apps]
      properties:
        apps: { type: array, maxItems: 30, items: { $ref: '#/components/schemas/ExternalAppConfig' } }
    BuiltinMenuConfig:
      type: object
      required: [id, label, icon, group, order, visible, openMode]
      properties:
        id: { type: string, enum: [home, navigation, projects, skills, skill-connections, chat, todo, workday-rhythm, action-plans, calendar, weekly-report, life-review, workspaces, memory, knowledge, english-learning, vocabulary, drawings, vault, tianren, dashboard, automation, files, games, request-monitoring] }
        label: { type: string, maxLength: 24 }
        icon: { type: string, description: Remix Icon 类名 }
        group: { type: string, enum: [ROOT, PUBLIC, PERSONAL, TOOLS] }
        order: { type: integer, minimum: 0, maximum: 999 }
        visible: { type: boolean }
        openMode: { type: string, enum: [TAB, NEW_PAGE], default: TAB, description: 在 WAO 页签打开或通过浏览器新页面打开 }
    BuiltinMenuRegistry:
      type: object
      required: [version, menus]
      properties:
        version: { type: integer, minimum: 1 }
        menus: { type: array, minItems: 25, maxItems: 25, items: { $ref: '#/components/schemas/BuiltinMenuConfig' } }
    SavePersonalMemory:
      type: object
      required: [title, content, category]
      properties:
        title: { type: string, minLength: 1, maxLength: 120 }
        content: { type: string, maxLength: 20000 }
        category: { type: string, enum: [preference, responsibility, plan, decision, context, experience] }
    PersonalMemory:
      allOf:
        - { $ref: '#/components/schemas/SavePersonalMemory' }
        - type: object
          required: [id, captureMode, mediaType, createdAt, updatedAt]
          properties:
            id: { type: string }
            captureMode: { type: string, enum: [manual, ai] }
            mediaType: { type: string, enum: [text, image, audio, video, file] }
            fileName: { type: string, nullable: true }
            contentType: { type: string, nullable: true }
            byteSize: { type: integer, format: int64, nullable: true }
            downloadUrl: { type: string, nullable: true }
            createdAt: { type: string, format: date-time }
            updatedAt: { type: string, format: date-time }
    GameMoveRequest:
      type: object
      required: [direction, revision]
      properties:
        direction: { type: string, enum: [UP, DOWN, LEFT, RIGHT] }
        revision: { type: integer, minimum: 0 }
    GameRevisionRequest:
      type: object
      required: [revision]
      properties:
        revision: { type: integer, minimum: 0 }
    MemoryMatchFlipRequest:
      type: object
      required: [index, revision]
      properties:
        index: { type: integer, minimum: 0, maximum: 15 }
        revision: { type: integer, minimum: 0 }
    MemoryMatchGame:
      type: object
      required: [cards, matched, revealed, steps, finished, revision, updatedAt]
      properties:
        cards:
          type: array
          minItems: 16
          maxItems: 16
          description: 未翻开位置为 null，避免向浏览器泄露隐藏牌面
          items: { type: integer, nullable: true, minimum: 0, maximum: 7 }
        matched: { type: array, items: { type: integer, minimum: 0, maximum: 15 } }
        revealed: { type: array, items: { type: integer, minimum: 0, maximum: 15 } }
        steps: { type: integer, minimum: 0 }
        bestSteps: { type: integer, nullable: true, minimum: 8 }
        finished: { type: boolean }
        revision: { type: integer, minimum: 0 }
        updatedAt: { type: string, format: date-time }
    GameRunRecord:
      type: object
      required: [id, score, highestTile, moves, outcome, startedAt, endedAt]
      properties:
        id: { type: string }
        score: { type: integer, format: int64 }
        highestTile: { type: integer }
        moves: { type: integer }
        outcome: { type: string, enum: [WON, GAME_OVER, RESTARTED] }
        startedAt: { type: string, format: date-time }
        endedAt: { type: string, format: date-time }
    NumberMergeStats:
      type: object
      required: [bestScore, highestTile, gamesPlayed, totalMoves, wins]
      properties:
        bestScore: { type: integer, format: int64 }
        highestTile: { type: integer }
        gamesPlayed: { type: integer, format: int64 }
        totalMoves: { type: integer, format: int64 }
        wins: { type: integer, format: int64 }
    NumberMergeGame:
      type: object
      required: [board, score, moves, won, gameOver, canUndo, revision, startedAt, updatedAt, stats, recentRuns]
      properties:
        board: { type: array, minItems: 16, maxItems: 16, items: { type: integer, minimum: 0 } }
        score: { type: integer, format: int64 }
        moves: { type: integer, minimum: 0 }
        won: { type: boolean }
        gameOver: { type: boolean }
        canUndo: { type: boolean }
        revision: { type: integer, minimum: 0 }
        startedAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        stats: { $ref: '#/components/schemas/NumberMergeStats' }
        recentRuns: { type: array, maxItems: 8, items: { $ref: '#/components/schemas/GameRunRecord' } }
    FeishuSender:
      type: object
      description: 发言人映射，把飞书 open_id 对上 WAO 里显示的人名
      properties:
        id: { type: string, description: 飞书 open_id }
        name: { type: string, description: 显示名，如 娃哥 / 娃弟 / 机器人通知 }
    SaveChatSyncConfigRequest:
      type: object
      description: 字段为 null 表示不修改；appSecret 留空即保留已存的密钥
      properties:
        appId: { type: string }
        appSecret: { type: string }
        chatId: { type: string }
        chatName: { type: string }
        kbId: { type: string, description: 沉淀到哪个知识库 }
        senders: { type: array, items: { $ref: '#/components/schemas/FeishuSender' } }
    MemberListResponse:
      allOf:
        - $ref: '#/components/schemas/ApiResponse'
        - type: object
          properties: { data: { type: array, items: { $ref: '#/components/schemas/Member' } } }
    ProjectListResponse:
      allOf:
        - $ref: '#/components/schemas/ApiResponse'
        - type: object
          properties: { data: { type: array, items: { $ref: '#/components/schemas/Project' } } }
    TaskListResponse:
      allOf:
        - $ref: '#/components/schemas/ApiResponse'
        - type: object
          properties: { data: { type: array, items: { $ref: '#/components/schemas/Task' } } }
    FeishuWebhookEndpointResponse:
      allOf:
        - $ref: '#/components/schemas/ApiResponse'
        - type: object
          properties: { data: { $ref: '#/components/schemas/FeishuWebhookEndpoint' } }
    FeishuWebhookEndpointListResponse:
      allOf:
        - $ref: '#/components/schemas/ApiResponse'
        - type: object
          properties: { data: { type: array, items: { $ref: '#/components/schemas/FeishuWebhookEndpoint' } } }
    DocTemplateResponse:
      allOf:
        - $ref: '#/components/schemas/ApiResponse'
        - type: object
          properties: { data: { $ref: '#/components/schemas/DocTemplate' } }
    DocTemplateListResponse:
      allOf:
        - $ref: '#/components/schemas/ApiResponse'
        - type: object
          properties: { data: { type: array, items: { $ref: '#/components/schemas/DocTemplate' } } }
