openapi: 3.0.3
info:
  title: WAO 结构化周报 API
  version: 0.1.0
paths:
  /api/weekly-report/generate:
    post:
      operationId: generateWeeklyReport
      summary: 只根据当前成员提交的原始记录生成四段周报
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [records]
              properties:
                records:
                  type: string
                  minLength: 1
                  maxLength: 8000
                  description: 一句话或按行分隔的多条原始工作事实
      responses:
        "200":
          description: 四个字段都是非空字符串；信息不足时包含待补充标记
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WeeklyReportEnvelope"
        "400":
          description: 输入为空、Codex 不可用或返回结构不完整
components:
  schemas:
    WeeklyReportEnvelope:
      type: object
      required: [code, message, data, timestamp]
      properties:
        code:
          type: integer
          example: 0
        message:
          type: string
          example: success
        data:
          $ref: "#/components/schemas/WeeklyReport"
        timestamp:
          type: integer
          format: int64
    WeeklyReport:
      type: object
      additionalProperties: false
      required: [completed, progress, risks, nextPlan]
      properties:
        completed:
          type: string
          minLength: 1
          maxLength: 5000
        progress:
          type: string
          minLength: 1
          maxLength: 5000
        risks:
          type: string
          minLength: 1
          maxLength: 5000
        nextPlan:
          type: string
          minLength: 1
          maxLength: 5000
