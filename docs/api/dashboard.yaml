openapi: 3.0.3
info:
  title: WAO 数据仪表盘 API
  version: 0.1.0
paths:
  /api/dashboard/ai-runs:
    get:
      operationId: getAiRunTrend
      summary: 按运行创建日期统计每日 AI 使用频次与真实 Token 用量
      parameters:
        - in: query
          name: days
          description: 查询最近多少个自然日；服务端限制为 1 至 365 天
          schema:
            type: integer
            minimum: 1
            maximum: 365
            default: 30
      responses:
        "200":
          description: 包含无运行日期的连续日桶；未回传用量的运行只计入 total，不计入 recordedRuns
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AiRunTrendEnvelope"
  /api/dashboard/quota-history:
    get:
      operationId: getAiQuotaHistory
      summary: 查询真实 AI 额度采样形成的每日趋势与刷新记录
      parameters:
        - in: query
          name: days
          description: 查询最近多少个自然日；服务端限制为 1 至 90 天
          schema: { type: integer, minimum: 1, maximum: 90, default: 30 }
      responses:
        "200":
          description: 仅包含供应商或 Runner 已真实返回的脱敏额度；未知额度不补零
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AiQuotaHistoryEnvelope"
  /api/dashboard/usage-insights:
    get:
      operationId: getAiUsageInsights
      summary: 根据已落库 AI Run 返回有效交付单位消耗、质量、重试、记账覆盖与同类配置建议
      parameters:
        - in: query
          name: days
          description: 分析最近多少个自然日；服务端限制为 1 至 90 天
          schema: { type: integer, minimum: 1, maximum: 90, default: 30 }
      responses:
        "200":
          description: 有效交付按任务去重；配置仅在同活动类型且样本完整时返回帕累托候选
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AiUsageInsightsEnvelope"
components:
  schemas:
    AiRunTrendEnvelope:
      type: object
      required: [code, message, data, timestamp]
      properties:
        code:
          type: integer
          example: 0
        message:
          type: string
          example: success
        data:
          type: array
          items:
            $ref: "#/components/schemas/AiRunTrendItem"
        timestamp:
          type: integer
          format: int64
    AiRunTrendItem:
      type: object
      required:
        - date
        - total
        - succeeded
        - failed
        - cancelled
        - recordedRuns
        - inputTokens
        - outputTokens
        - cachedInputTokens
        - totalTokens
      properties:
        date:
          type: string
          format: date
        total:
          type: integer
          description: 当天创建的全部 AI 运行数
        succeeded:
          type: integer
        failed:
          type: integer
        cancelled:
          type: integer
        recordedRuns:
          type: integer
          description: CLI 真实回传了 Token 用量的运行数；只有模型或金额不算 Token 已记账
        inputTokens:
          type: integer
          format: int64
        outputTokens:
          type: integer
          format: int64
        cachedInputTokens:
          type: integer
          format: int64
          description: 缓存读取与缓存写入之和
        totalTokens:
          type: integer
          format: int64
    AiQuotaHistoryEnvelope:
      type: object
      required: [code, message, data, timestamp]
      properties:
        code: { type: integer }
        message: { type: string }
        timestamp: { type: integer, format: int64 }
        data:
          type: object
          required: [recordedSamples, series, refreshes]
          properties:
            recordedSamples: { type: integer, description: 查询窗口内保存的真实采样数 }
            series:
              type: array
              items:
                type: object
                required: [id, accountLabel, provider, windowLabel, points]
                properties:
                  id: { type: string, description: 不泄露账号来源键的稳定序列摘要 }
                  accountLabel: { type: string }
                  provider: { type: string }
                  windowLabel: { type: string }
                  points:
                    type: array
                    items:
                      type: object
                      required: [date, remainingPercent, decreasedPercent]
                      properties:
                        date: { type: string, format: date }
                        remainingPercent: { type: integer, minimum: 0, maximum: 100 }
                        decreasedPercent: { type: integer, minimum: 0, maximum: 100 }
            refreshes:
              type: array
              items:
                type: object
                required: [accountLabel, provider, windowLabel, beforeRemainingPercent, afterRemainingPercent, refreshedPercent, observedAt]
                properties:
                  accountLabel: { type: string }
                  provider: { type: string }
                  windowLabel: { type: string }
                  beforeRemainingPercent: { type: integer }
                  afterRemainingPercent: { type: integer }
                  refreshedPercent: { type: integer }
                  resetsAt: { type: string, nullable: true }
                  observedAt: { type: string }
    AiUsageInsightsEnvelope:
      type: object
      required: [code, message, data, timestamp]
      properties:
        code: { type: integer }
        message: { type: string }
        timestamp: { type: integer, format: int64 }
        data:
          type: object
          required: [windowDays, totalRuns, completedRuns, meteredRuns, timedRuns, deliveredRuns, deliveredTasks, verifiedTasks, totalTokens, failedTokens, retryRuns, retryTokens, advice]
          properties:
            windowDays: { type: integer }
            totalRuns: { type: integer }
            completedRuns: { type: integer }
            meteredRuns: { type: integer }
            timedRuns: { type: integer, description: 回传 AI 实际执行时长的已结束运行数 }
            deliveredRuns: { type: integer, description: 成功且部署和线上验收通过的运行数 }
            deliveredTasks: { type: integer, description: 有效交付运行覆盖并在窗口内去重的任务数 }
            verifiedTasks: { type: integer, description: 有效交付任务中当前已由成员标记已完成的数量 }
            totalTokens: { type: integer, format: int64, description: 窗口内全部已结束运行的真实 Token }
            failedTokens: { type: integer, format: int64, description: 未形成有效交付且已真实回传的 Token 小计 }
            tokensPerDeliveredTask: { type: integer, format: int64, nullable: true, description: 无有效交付或已结束运行记账不完整时为空 }
            retryRuns: { type: integer, description: retryOfRunId 非空的已结束运行数 }
            retryTokens: { type: integer, format: int64 }
            medianDurationSeconds: { type: integer, format: int64, nullable: true, description: 端到端时长中位，仅观察不参与模型比较 }
            medianAiExecutionSeconds: { type: integer, format: int64, nullable: true, description: Runner 单调时钟回传的 AI 实际执行时长中位 }
            advice:
              type: array
              items:
                type: object
                required: [category, title, recommendation, evidence, sufficientData]
                properties:
                  category: { type: string, enum: [OUTCOME, QUALITY, ROUTING, RETRY, ACCOUNTING] }
                  title: { type: string }
                  recommendation: { type: string }
                  evidence: { type: string }
                  sufficientData: { type: boolean }
