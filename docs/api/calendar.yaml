openapi: 3.0.3
info:
  title: WAO 节假日日历 API
  version: 0.4.0
  description: 当前成员维护公历/农历提醒事项、主动选择节日范围，并设置飞书私聊或群提醒。
servers:
  - url: /api
paths:
  /calendar/important-dates:
    get:
      summary: 当前成员的日历提醒事项、日期窗事件和飞书通道状态
      parameters:
        - { name: from, in: query, required: true, schema: { type: string, format: date } }
        - { name: to, in: query, required: true, schema: { type: string, format: date } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FamilyImportantDateCalendarResponse' }
        '400': { description: 日期格式错误、to 早于 from 或窗口超过 370 天 }
    post:
      summary: 新建当前成员每年重复的公历或农历提醒事项
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SaveFamilyImportantDate' }
      responses:
        '200': { description: OK }
        '400': { description: 字段不合法或开启提醒时飞书通道不可用 }
  /calendar/important-dates/date-conversion:
    get:
      summary: 公历与农历权威双向转换
      parameters:
        - { name: calendarType, in: query, required: true, schema: { type: string, enum: [SOLAR, LUNAR] } }
        - { name: solarDate, in: query, required: false, schema: { type: string, format: date } }
        - { name: lunarYear, in: query, required: false, schema: { type: integer, minimum: 1900, maximum: 2100 } }
        - { name: lunarMonth, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 12 } }
        - { name: lunarDay, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 30 } }
        - { name: lunarLeapMonth, in: query, required: false, schema: { type: boolean, default: false } }
      responses:
        '200': { description: 同一天的公历、农历字段和中文标签 }
        '400': { description: 日期不存在、字段缺失或超出支持范围 }
  /calendar/important-dates/{id}:
    put:
      summary: 修改当前成员拥有的日历提醒事项
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SaveFamilyImportantDate' }
      responses:
        '200': { description: OK }
        '404': { description: 资源不存在或不属于当前成员 }
    delete:
      summary: 删除当前成员拥有的日历提醒事项及其投递记录
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: OK }
        '404': { description: 资源不存在或不属于当前成员 }
  /calendar/holidays:
    get:
      summary: 当前成员日期窗内的节日与年度来源状态
      parameters:
        - { name: from, in: query, required: true, schema: { type: string, format: date } }
        - { name: to, in: query, required: true, schema: { type: string, format: date } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HolidayCalendarResponse' }
        '400': { description: 日期格式错误、to 早于 from 或窗口超过 370 天（code=40001） }
  /calendar/holidays/settings:
    get:
      summary: 当前成员的国际节日范围和提醒通道状态
      responses:
        '200': { description: OK }
    put:
      summary: 保存当前成员主动选择的国际节日类别
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [selectedInternationalCategories]
              properties:
                selectedInternationalCategories:
                  type: array
                  maxItems: 10
                  items: { type: string, enum: [FAMILY, WESTERN_POPULAR, CHRISTIAN, NORTH_AMERICA] }
      responses:
        '200': { description: OK；关闭类别时同步关闭该类别提醒 }
  /calendar/holidays/{holidayCode}/reminder:
    put:
      summary: 创建、修改或关闭当前成员的年度节日提醒
      parameters:
        - { name: holidayCode, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [enabled]
              properties:
                enabled: { type: boolean }
                reminderTime: { type: string, format: time, nullable: true, example: '08:30' }
      responses:
        '200': { description: OK }
        '400': { description: 节日未知、类别未订阅、未选择时间或飞书提醒通道不可用 }
components:
  schemas:
    SaveFamilyImportantDate:
      type: object
      required: [name, eventDate, reminderEnabled, reminderDaysBefore, calendarType, notificationType]
      properties:
        name: { type: string, maxLength: 64, example: 妈妈生日 }
        eventDate: { type: string, format: date, example: '1990-05-10' }
        note: { type: string, nullable: true, maxLength: 200, example: 记得提前订花 }
        reminderEnabled: { type: boolean }
        reminderDaysBefore: { type: integer, minimum: 0, maximum: 30, example: 3 }
        reminderTime: { type: string, format: time, nullable: true, example: '08:30' }
        calendarType: { type: string, enum: [SOLAR, LUNAR] }
        lunarMonth: { type: integer, nullable: true, minimum: 1, maximum: 12 }
        lunarDay: { type: integer, nullable: true, minimum: 1, maximum: 30 }
        lunarLeapMonth: { type: boolean, default: false }
        notificationType: { type: string, enum: [DIRECT, GROUP] }
        chatId: { type: string, nullable: true, maxLength: 128 }
        chatName: { type: string, nullable: true, maxLength: 128 }
    FamilyImportantDate:
      allOf:
        - type: object
          required: [id]
          properties:
            id: { type: string }
            solarDateLabel: { type: string }
            lunarDateLabel: { type: string }
        - { $ref: '#/components/schemas/SaveFamilyImportantDate' }
    FamilyImportantDateEvent:
      type: object
      required: [id, importantDateId, date, name, reminderEnabled, reminderDaysBefore, calendarType, solarDateLabel, lunarDateLabel, notificationType]
      properties:
        id: { type: string }
        importantDateId: { type: string }
        date: { type: string, format: date }
        name: { type: string }
        note: { type: string, nullable: true }
        reminderEnabled: { type: boolean }
        reminderDaysBefore: { type: integer }
        reminderTime: { type: string, nullable: true }
        calendarType: { type: string, enum: [SOLAR, LUNAR] }
        solarDateLabel: { type: string }
        lunarDateLabel: { type: string }
        notificationType: { type: string, enum: [DIRECT, GROUP] }
        chatName: { type: string, nullable: true }
    FamilyImportantDateCalendar:
      type: object
      required: [items, events, reminderChannelAvailable, reminderChannelHint, groupChannelAvailable, groupChannelHint]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/FamilyImportantDate' }
        events:
          type: array
          items: { $ref: '#/components/schemas/FamilyImportantDateEvent' }
        reminderChannelAvailable: { type: boolean }
        reminderChannelHint: { type: string }
        groupChannelAvailable: { type: boolean }
        groupChannelHint: { type: string }
    FamilyImportantDateCalendarResponse:
      type: object
      properties:
        code: { type: integer, example: 0 }
        message: { type: string, example: ok }
        timestamp: { type: integer, format: int64 }
        data: { $ref: '#/components/schemas/FamilyImportantDateCalendar' }
    HolidayEvent:
      type: object
      required: [id, code, date, year, name, category, dayType, sourceName, remindable, reminderEnabled]
      properties:
        id: { type: string }
        code: { type: string, example: international.mothers-day }
        date: { type: string, format: date }
        year: { type: integer, example: 2026 }
        name: { type: string, example: 母亲节 }
        category: { type: string, enum: [CHINA, INTERNATIONAL] }
        dayType: { type: string, enum: [FESTIVAL, DAY_OFF, ADJUSTED_WORKDAY] }
        internationalCategory: { type: string, nullable: true, enum: [FAMILY, WESTERN_POPULAR, CHRISTIAN, NORTH_AMERICA] }
        sourceName: { type: string }
        sourceUrl: { type: string, nullable: true }
        remindable: { type: boolean }
        reminderEnabled: { type: boolean }
        reminderTime: { type: string, nullable: true, example: '08:30' }
    HolidayYearSource:
      type: object
      required: [year, officialScheduleAvailable, sourceName, sourceUrl, message]
      properties:
        year: { type: integer }
        officialScheduleAvailable: { type: boolean }
        sourceName: { type: string }
        sourceUrl: { type: string }
        message: { type: string }
    HolidayCalendar:
      type: object
      properties:
        events:
          type: array
          items: { $ref: '#/components/schemas/HolidayEvent' }
        years:
          type: array
          items: { $ref: '#/components/schemas/HolidayYearSource' }
    HolidayCalendarResponse:
      type: object
      properties:
        code: { type: integer, example: 0 }
        message: { type: string, example: ok }
        timestamp: { type: integer, format: int64 }
        data: { $ref: '#/components/schemas/HolidayCalendar' }
