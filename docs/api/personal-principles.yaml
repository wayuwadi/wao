openapi: 3.0.3
info:
  title: WAO Personal Principles API
  version: 1.0.0
  description: 当前成员创建多人准则，受邀人分别确认；每人的记录只返回给本人。
paths:
  /api/personal-principles:
    get:
      summary: 读取当前成员自建或受邀准则
      parameters: [{ name: date, in: query, schema: { type: string, format: date } }]
      responses:
        '200': { description: 只附当前成员本人的记录与判断 }
    post:
      summary: 创建准则并邀请适用成员
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/SavePrinciple' } } }
      responses:
        '200': { description: 发起人本人目标自动接受；其余目标待本人确认 }
        '400': { description: 字段或成员列表不合法 }
  /api/personal-principles/{id}:
    put:
      summary: 发起人带版本号修改准则并保存历史快照
      parameters: [{ $ref: '#/components/parameters/PrincipleId' }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/SavePrinciple' } } }
      responses:
        '200': { description: 修改后的版本 }
        '403': { description: 当前成员不是发起人 }
        '409': { description: 版本过期，需要刷新核对 }
  /api/personal-principles/{id}/consent:
    put:
      summary: 适用成员本人接受或撤回
      parameters: [{ $ref: '#/components/parameters/PrincipleId' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [consent]
              properties: { consent: { type: string, enum: [ACCEPTED, DECLINED] } }
      responses: { '200': { description: 更新后的本人状态 }, '403': { description: 非适用成员 } }
  /api/personal-principles/{id}/checkins/{date}:
    put:
      summary: 本人记录最近 30 天的一天
      parameters:
        - { $ref: '#/components/parameters/PrincipleId' }
        - { name: date, in: path, required: true, schema: { type: string, format: date } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status: { type: string, enum: [DONE, NEEDS_WORK, EXCEPTION] }
                note: { type: string, maxLength: 500 }
      responses: { '200': { description: 已返回本人的最新记录 }, '403': { description: 未由本人接受 } }
  /api/personal-principles/{id}/revisions:
    get:
      summary: 查看可访问准则的版本文本
      parameters: [{ $ref: '#/components/parameters/PrincipleId' }]
      responses: { '200': { description: 版本 JSON 快照列表，不含成员记录 }, '403': { description: 当前成员无权访问 } }
components:
  parameters:
    PrincipleId: { name: id, in: path, required: true, schema: { type: string, format: uuid } }
  schemas:
    SavePrinciple:
      type: object
      required: [title, category, targetMemberIds, triggerText, desiredAction, evidenceSource]
      properties:
        title: { type: string, maxLength: 240 }
        category: { type: string, enum: [RED_LINE, MUST, MORE, LESS, ALLOWED, AVOID, ADVICE] }
        targetMemberIds: { type: array, minItems: 1, items: { type: string } }
        triggerText: { type: string, maxLength: 240 }
        desiredAction: { type: string, maxLength: 500 }
        exceptionText: { type: string, maxLength: 500 }
        reminderTime: { type: string, format: time, nullable: true }
        evidenceSource: { type: string, enum: [MANUAL, SCREEN_TIME], description: SCREEN_TIME 当前仅保留待数据状态 }
        paused: { type: boolean }
        version: { type: integer, minimum: 1, description: 修改时必填，创建时省略 }
