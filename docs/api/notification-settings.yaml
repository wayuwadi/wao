openapi: 3.0.3
info:
  title: WAO 通知设置 API
  version: 0.1.0
paths:
  /api/public/notification-settings/jenkins-failure:
    get:
      summary: 返回 Jenkins 失败群通知当前是否允许发送
      responses:
        '200':
          description: 只返回最终门禁结论与原因，不公开完整系统策略
  /api/notification-settings:
    get:
      summary: 读取管理员共享群通知策略与当前成员站内偏好
      responses:
        '200':
          description: 返回权限标记与两层真实配置
          content: { application/json: { schema: { $ref: '#/components/schemas/NotificationSettingsResponse' } } }
    put:
      summary: 保存当前成员偏好；管理员可同时保存系统策略
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/SaveNotificationSettingsRequest' } } }
      responses:
        '200': { description: 返回保存后的有效配置 }
        '401': { description: 非管理员尝试修改系统策略 }
  /api/notification-reminders:
    get:
      summary: 读取固定时刻群提醒及每日/工作日规则
      responses:
        '200':
          description: 返回真实自动化提醒与当前成员管理权限
    post:
      summary: 新增每日群提醒
      responses:
        '200': { description: 返回已保存提醒；新提醒默认每日发送 }
        '401': { description: 只有管理员可以新增 }
  /api/notification-reminders/{id}:
    put:
      summary: 保存提醒标题、正文、时间和启停状态
      description: 系统预置的工作日规则只读，编辑后继续保留。
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: 返回已保存提醒 }
        '401': { description: 只有管理员可以修改 }
    delete:
      summary: 删除提醒及其运行记录
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: 已删除 }
  /api/notification-reminders/{id}/test:
    post:
      summary: 管理员主动真实试发提醒
      description: 主动试发不受工作日门禁影响，仍受组织通知策略和真实飞书配置约束。
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: 返回包含真实运行结果的提醒 }
components:
  schemas:
    NotificationSettingsResponse:
      type: object
      required: [code, data]
      properties:
        code: { type: integer, example: 0 }
        data: { $ref: '#/components/schemas/NotificationSettings' }
    NotificationSettings:
      type: object
      required: [canManageSystem, system, personal]
      properties:
        canManageSystem: { type: boolean }
        system: { $ref: '#/components/schemas/SystemNotificationPolicy' }
        personal: { $ref: '#/components/schemas/PersonalNotificationPolicy' }
    SaveNotificationSettingsRequest:
      type: object
      required: [personal]
      properties:
        system: { $ref: '#/components/schemas/SystemNotificationPolicy' }
        personal: { $ref: '#/components/schemas/PersonalNotificationPolicy' }
    SystemNotificationPolicy:
      type: object
      required: [enabled, quietHoursEnabled, quietStart, quietEnd, taskActivity, taskSuccess, aiRunSuccess, aiRunFailure, manualTask, reminders, deliveryFailure, automation]
      properties:
        enabled: { type: boolean }
        quietHoursEnabled: { type: boolean }
        quietStart: { type: string, pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]$', example: '22:00' }
        quietEnd: { type: string, pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]$', example: '08:00' }
        taskActivity: { type: boolean }
        taskSuccess: { type: boolean }
        aiRunSuccess: { type: boolean }
        aiRunFailure: { type: boolean }
        manualTask: { type: boolean }
        reminders: { type: boolean }
        deliveryFailure: { type: boolean }
        automation: { type: boolean }
    PersonalNotificationPolicy:
      type: object
      required: [enabled, taskCreated, taskCompleted, aiRunSuccess, aiRunFailure, loginActivity]
      properties:
        enabled: { type: boolean }
        taskCreated: { type: boolean }
        taskCompleted: { type: boolean }
        aiRunSuccess: { type: boolean }
        aiRunFailure: { type: boolean }
        loginActivity: { type: boolean }
    NotificationReminder:
      type: object
      required: [id, title, content, time, enabled, workdayOnly, lastResult]
      properties:
        id: { type: string }
        title: { type: string }
        content: { type: string }
        time: { type: string, pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]$' }
        enabled: { type: boolean }
        workdayOnly: { type: boolean, description: true 表示自动触发仅在中国工作日发送；只读 }
        lastResult: { type: string }
        nextFireAt: { type: string, format: date-time, nullable: true }
