openapi: 3.0.3
info:
  title: WAO Crawler Capability API
  version: 1.0.0
paths:
  /api/crawler-capabilities:
    get:
      summary: 按更新时间倒序列出组织爬虫源码资产
      responses:
        '200': { description: 爬虫能力列表 }
    post:
      summary: 新建爬虫能力
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SaveCrawlerCapability' }
      responses:
        '200': { description: 已创建的爬虫能力 }
        '400': { description: 名称、语言或源码不合法 }
  /api/crawler-capabilities/{id}:
    put:
      summary: 按 revision 更新爬虫能力
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SaveCrawlerCapability' }
      responses:
        '200': { description: 已更新且 revision 递增的爬虫能力 }
        '404': { description: 爬虫能力不存在 }
        '409': { description: revision 已过期，拒绝覆盖 }
    delete:
      summary: 按 revision 删除爬虫能力
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - { name: revision, in: query, required: true, schema: { type: integer, minimum: 1 } }
      responses:
        '200': { description: 已删除 }
        '404': { description: 爬虫能力不存在 }
        '409': { description: revision 已过期，拒绝删除 }
components:
  schemas:
    SaveCrawlerCapability:
      type: object
      required: [name, language, sourceCode, enabled]
      properties:
        name: { type: string, maxLength: 128 }
        description: { type: string, maxLength: 512 }
        language: { type: string, enum: [PYTHON, JAVASCRIPT] }
        sourceCode: { type: string, maxLength: 262144 }
        enabled: { type: boolean }
        revision: { type: integer, nullable: true, minimum: 1 }
