openapi: 3.0.3
info:
  title: WAO 天人一卦 API
  version: 0.1.0
paths:
  /api/tianren/readings/today:
    get:
      operationId: getTodayTianrenReading
      summary: 读取当前成员今日已经起出的卦
      responses:
        "200":
          description: 未起卦时 data 为 null
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadingEnvelope"
    post:
      operationId: createTodayTianrenReading
      summary: 服务端生成或返回当前成员今日唯一卦象
      responses:
        "200":
          description: 调用成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadingEnvelope"
  /api/tianren/readings:
    get:
      operationId: listTianrenReadings
      summary: 返回当前成员最近的每日卦象
      parameters:
        - in: query
          name: limit
          schema:
            type: integer
            minimum: 1
            maximum: 60
            default: 14
      responses:
        "200":
          description: 调用成功
  /api/tianren/readings/today/interpret/stream:
    post:
      operationId: interpretTodayTianrenReading
      summary: 用成员私有的本地 Codex 会话解读今日卦象
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                focus:
                  type: string
                  maxLength: 500
      responses:
        "200":
          description: token / done / error SSE 事件
          content:
            text/event-stream:
              schema:
                type: string
  /api/tianren/readings/{id}/share:
    post:
      operationId: createTianrenReadingShare
      summary: 为当前成员拥有的一份卦象生成或复用公开分享凭据
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        "200":
          description: 返回 32 位不可猜测分享凭据
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ShareTokenEnvelope"
  /api/tianren/readings/{id}/notification:
    parameters:
      - in: path
        name: id
        required: true
        schema: { type: string }
    get:
      operationId: getTianrenNotification
      summary: 只读返回当前成员该卦的群卡片投递状态
      responses:
        "200":
          description: 状态及目标显示名，不包含卡片快照或凭据
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotificationEnvelope"
        "404": { description: 卦象不存在或不属于当前成员 }
  /api/tianren/readings/{id}/notification/retry:
    parameters:
      - in: path
        name: id
        required: true
        schema: { type: string }
    post:
      operationId: retryTianrenNotification
      summary: 重新安排失败的原群卡片快照，已发送记录不重发
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                confirmNotReceived:
                  type: boolean
                  default: false
                  description: UNKNOWN 状态必须为 true，确认群中未收到后才可重试
      responses:
        "200":
          description: 当前投递状态
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotificationEnvelope"
        "400": { description: 未确认未知结果、策略阻止、目标改变或没有可重试记录 }
        "404": { description: 卦象不存在或不属于当前成员 }
  /api/share/tianren/{token}:
    get:
      operationId: getSharedTianrenReading
      summary: 免登录读取卦象与最新 AI 自照的公开投影
      parameters:
        - in: path
          name: token
          required: true
          schema:
            type: string
            pattern: "^[0-9a-f]{32}$"
      responses:
        "200":
          description: 分享结果
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SharedReadingEnvelope"
        "404":
          description: 分享凭据无效
components:
  schemas:
    NotificationEnvelope:
      type: object
      properties:
        code: { type: integer }
        message: { type: string }
        data:
          type: object
          required: [state, targetName, message, retryable]
          properties:
            state:
              type: string
              enum: [DISABLED, CONFIGURATION_REQUIRED, INTERPRETING, INTERPRETATION_FAILED, WAITING, PENDING, SENDING, SENT, FAILED, SKIPPED, UNKNOWN]
            targetName: { type: string }
            message: { type: string }
            retryable: { type: boolean }
    ReadingEnvelope:
      type: object
      required: [code, message, timestamp]
      properties:
        code:
          type: integer
          example: 0
        message:
          type: string
          example: success
        data:
          nullable: true
          allOf:
            - $ref: "#/components/schemas/TianrenReading"
        timestamp:
          type: integer
          format: int64
    ShareTokenEnvelope:
      type: object
      required: [code, message, data, timestamp]
      properties:
        code:
          type: integer
          example: 0
        message:
          type: string
          example: success
        data:
          type: object
          required: [token]
          properties:
            token:
              type: string
              pattern: "^[0-9a-f]{32}$"
        timestamp:
          type: integer
          format: int64
    SharedReadingEnvelope:
      type: object
      required: [code, message, data, timestamp]
      properties:
        code:
          type: integer
          example: 0
        message:
          type: string
          example: success
        data:
          $ref: "#/components/schemas/SharedTianrenReading"
        timestamp:
          type: integer
          format: int64
    TianrenReading:
      type: object
      required: [id, date, lines, changingLines, primary, createdAt]
      properties:
        id:
          type: string
        date:
          type: string
          format: date
        lines:
          type: array
          minItems: 6
          maxItems: 6
          items:
            type: integer
            enum: [6, 7, 8, 9]
          description: 初爻到上爻
        changingLines:
          type: array
          items:
            type: integer
            minimum: 1
            maximum: 6
        primary:
          $ref: "#/components/schemas/Hexagram"
        relating:
          nullable: true
          allOf:
            - $ref: "#/components/schemas/Hexagram"
        conversationId:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time
    SharedTianrenReading:
      type: object
      description: 包含卦象所绑定会话的最新 assistant 回复；不包含成员、内部存档 id、关注点原文、用户消息或会话 id
      required: [date, lines, changingLines, primary, createdAt]
      properties:
        date:
          type: string
          format: date
        lines:
          type: array
          minItems: 6
          maxItems: 6
          items:
            type: integer
            enum: [6, 7, 8, 9]
        changingLines:
          type: array
          items:
            type: integer
            minimum: 1
            maximum: 6
        primary:
          $ref: "#/components/schemas/Hexagram"
        relating:
          nullable: true
          allOf:
            - $ref: "#/components/schemas/Hexagram"
        interpretation:
          type: string
          nullable: true
          description: 当前最新一条 AI 自照 Markdown；尚无成功 AI 回复时为 null
        createdAt:
          type: string
          format: date-time
    Hexagram:
      type: object
      required: [number, name, symbol, upper, lower]
      properties:
        number:
          type: integer
          minimum: 1
          maximum: 64
        name:
          type: string
        symbol:
          type: string
        upper:
          $ref: "#/components/schemas/Trigram"
        lower:
          $ref: "#/components/schemas/Trigram"
    Trigram:
      type: object
      required: [name, nature, symbol]
      properties:
        name:
          type: string
        nature:
          type: string
        symbol:
          type: string
