openapi: 3.0.3
info:
  title: WAO 云端 AI 会话
  version: 1.0.0
  description: 按登录成员项目权限管理既有 AiRun 会话；实际执行仍由配对的 Runner 负责。响应统一 ApiResponse 包装。
paths:
  /api/ai/sessions:
    get:
      summary: 分页搜索会话摘要，先按可见项目过滤
      parameters:
        - {in: query, name: q, schema: {type: string, maxLength: 160}, description: 名称或 session ID 或运行 ID}
        - {in: query, name: status, schema: {type: string, enum: ['', active, succeeded, failed, cancelled]}}
        - {in: query, name: engine, schema: {type: string, enum: ['', codex, claude, qoder]}}
        - {in: query, name: archived, schema: {type: boolean, default: false}}
        - {in: query, name: page, schema: {type: integer, minimum: 1, default: 1}}
      responses:
        '200': {description: 'data 为 items、total、page、size；每页 25 条，无进度正文。置顶优先，其次最近活动倒序。'}
    post:
      summary: 创建任务并派发新会话，复用 AiRun 节点与运行模式
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [projectId, goal]
              properties:
                projectId: {type: string}
                goal: {type: string}
                runnerId: {type: string, nullable: true}
                planMode: {type: boolean}
                goalMode: {type: boolean}
                reasoningEffort: {type: string, enum: [low, medium, high]}
      responses:
        '200': {description: 'data 为已创建的 AiRunDto，可直接使用 id 打开会话。'}
  /api/ai/sessions/workflows:
    get:
      summary: 当前成员可见且已配置的真实项目工作流
      responses:
        '200': {description: data 为 AiWorkflowDto 数组}
  /api/ai/sessions/{id}:
    parameters:
      - {$ref: '#/components/parameters/runId'}
    get:
      summary: 读取原运行、个人整理偏好和初始任务要求
      responses:
        '200': {description: 'data 为 run（AiRunDto）、preference、prompt。'}
        '404': {description: 会话不存在或项目不可见}
  /api/ai/sessions/{id}/preference:
    parameters:
      - {$ref: '#/components/parameters/runId'}
    put:
      summary: 保存个人会话名称、置顶和归档；不停止执行，不删除历史
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [pinned, archived]
              properties:
                title: {type: string, nullable: true, maxLength: 160, description: 留空恢复任务名称}
                pinned: {type: boolean}
                archived: {type: boolean}
      responses:
        '200': {description: data 为保存后的偏好}
  /api/ai/sessions/{id}/conversation:
    parameters:
      - {$ref: '#/components/parameters/runId'}
    get:
      summary: 补读更早的消息和执行过程
      parameters:
        - {in: query, name: before, schema: {type: string}, description: 本会话已加载最早消息的 id}
      responses:
        '200': {description: 'data 为 items、nextCursor；每页 50 条，游标严格属于本会话。'}
  /api/ai/sessions/{id}/continue:
    parameters:
      - {$ref: '#/components/parameters/runId'}
    post:
      summary: 在原节点和原 session 追加输入或继续执行
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [input]
              properties:
                input: {type: string, minLength: 1, maxLength: 4000}
      responses:
        '200': {description: 更新后的 AiRunDto；等待执行电脑消费输入}
  /api/ai/sessions/{id}/pause:
    parameters:
      - {$ref: '#/components/parameters/runId'}
    post:
      summary: 暂停原运行，保留可恢复会话
      responses:
        '200': {description: 更新后的 AiRunDto}
components:
  parameters:
    runId: {in: path, name: id, required: true, schema: {type: string}, description: AiRun id，而不是模型 sessionId}
