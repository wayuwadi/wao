openapi: 3.0.3
info:
  title: WAO 通知中心 API
  version: 0.2.0
paths:
  /api/notification-center:
    get:
      summary: 读取最近真实系统事件、当前成员未读数和团队登录频率
      parameters:
        - name: includeInternal
          in: query
          schema: { type: boolean, default: false }
          description: 新前端声明支持 INTERNAL 事件；个人内部通知按当前成员过滤
      responses:
        '200':
          description: 最多 30 条倒序事件；首次未读范围为最近 7 天
  /api/notification-center/read:
    put:
      summary: 将当前成员通知已读水位推进到服务端当前时间
      responses:
        '200':
          description: 返回新的已读时间
components:
  schemas:
    NotificationCenter:
      type: object
      required: [events, loginUsage, unreadCount]
      properties:
        events:
          type: array
          items:
            $ref: '#/components/schemas/NotificationEvent'
        loginUsage:
          type: array
          items:
            $ref: '#/components/schemas/MemberLoginUsage'
        unreadCount:
          type: integer
          format: int64
        readAt:
          type: string
          format: date-time
          nullable: true
    NotificationEvent:
      type: object
      required: [id, type, title, detail, occurredAt]
      properties:
        id: { type: string }
        type: { type: string, enum: [TASK_CREATED, TASK_COMPLETED, AI_RUN, LOGIN, INTERNAL] }
        title: { type: string }
        detail: { type: string }
        actorName: { type: string, nullable: true }
        occurredAt: { type: string, format: date-time }
        targetPath: { type: string, nullable: true }
        severity: { type: string, enum: [INFO, SUCCESS, WARNING] }
    MemberLoginUsage:
      type: object
      required: [memberId, memberName, color, count7Days, count30Days]
      properties:
        memberId: { type: string }
        memberName: { type: string }
        color: { type: string }
        count7Days: { type: integer, format: int64 }
        count30Days: { type: integer, format: int64 }
        lastLoginAt: { type: string, format: date-time, nullable: true }
