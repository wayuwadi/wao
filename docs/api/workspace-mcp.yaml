openapi: 3.0.3
info:
  title: WAO 工作区 MCP 与设备令牌
  version: 1.0.0
paths:
  /api/workspace-mcp/tokens:
    get:
      summary: 列出当前成员的工作区 MCP 设备令牌元数据
      security: [{ waoSession: [] }]
      responses:
        '200': { description: 不包含明文或摘要的令牌列表 }
    post:
      summary: 签发只读或可读写令牌，明文仅返回一次
      security: [{ waoSession: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, canWrite]
              properties:
                name: { type: string, maxLength: 80 }
                canWrite: { type: boolean }
      responses:
        '200': { description: 包含 token 元数据和一次性 secret }
  /api/workspace-mcp/tokens/{id}:
    delete:
      summary: 吊销当前成员的一枚工作区令牌
      security: [{ waoSession: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        '200': { description: 已吊销 }
        '404': { description: 令牌不存在或不属于当前成员 }
  /api/mcp/workspace:
    post:
      summary: 无状态 Streamable HTTP JSON-RPC 端点
      description: 支持 initialize、ping、tools/list、tools/call；每次请求重新验证专用 Bearer。
      security: [{ workspaceBearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object }
      responses:
        '200': { description: JSON-RPC 结果 }
        '202': { description: 已接受 notification }
        '401': { description: 令牌无效、已吊销或误用了记忆令牌 }
components:
  securitySchemes:
    waoSession:
      type: apiKey
      in: cookie
      name: WAO_SESSION
    workspaceBearer:
      type: http
      scheme: bearer
