openapi: 3.0.3
info:
  title: WAO 今日节奏 API
  version: 0.1.0
paths:
  /api/workday-rhythm/dashboard:
    get:
      summary: 读取当前成员指定日期的每日面板
      parameters:
        - { name: date, in: query, required: true, schema: { type: string, format: date } }
      responses:
        "200": { description: 返回工作日判断、当日及跨午夜清单、文档和面板设置 }
  /api/workday-rhythm/settings:
    get:
      summary: 读取大小周联动、每日文档与卦象模块设置
      responses:
        "200": { description: OK }
    put:
      summary: 保存大小周联动、每日文档与卦象模块设置
      responses:
        "200": { description: 已按当前成员保存 }
        "400": { description: 文档目标或标题格式不合法 }
  /api/workday-rhythm/checklist-items:
    get:
      summary: 读取当前成员的每日必做模板
      responses:
        "200": { description: 首次读取会幂等补齐三个默认系统项 }
    post:
      summary: 新增自定义每日必做项
      responses:
        "200": { description: 已创建 }
        "400": { description: 适用日、时间窗或通知配置不合法 }
  /api/workday-rhythm/checklist-items/{id}:
    patch:
      summary: 修改当前成员的清单模板，不允许改变系统行为类型
      responses:
        "200": { description: 已保存；当天未完成且未投递项同步新快照 }
        "404": { description: 项目不存在或不属于当前成员 }
    delete:
      summary: 软删除自定义项；系统项只能停用
      responses:
        "200": { description: 已删除，历史实例保留 }
        "400": { description: 试图删除系统联动项 }
  /api/workday-rhythm/days/{date}/workday-status:
    put:
      summary: 设置当天工作状态覆盖；active 为 null 时恢复自动判断
      responses:
        "200": { description: 返回刷新后的当天面板 }
  /api/workday-rhythm/days/{date}/focus:
    put:
      summary: 保存今日重点并联动计划必做项
      responses:
        "200": { description: 至少三项非空时计划项自动完成 }
        "400": { description: 栏位少于 3 个、超过 20 个或单项超过 100 字 }
  /api/workday-rhythm/occurrences/{id}/completion:
    put:
      summary: 完成或撤销一条当日必做
      responses:
        "200": { description: 返回完成时间、准时结果和当前状态 }
        "404": { description: 实例不存在或不属于当前成员 }
  /api/workday-rhythm/days/{date}/document:
    put:
      summary: 首次真实输入时幂等创建或返回当天唯一文档
      responses:
        "200": { description: 返回可继续使用文档自动保存接口的真实文档 }
        "400": { description: 未配置知识库/文件夹或目标已失效 }
  /api/workday-rhythm/history:
    get:
      summary: 按日期范围读取当前成员已经保存的今日节奏历史
      parameters:
        - { name: from, in: query, required: true, schema: { type: string, format: date } }
        - { name: to, in: query, required: true, schema: { type: string, format: date } }
      responses:
        "200":
          description: 按日期倒序返回真实存档；没有保存的日期不会补零
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/WorkdayRhythmHistory" }
        "400": { description: 日期倒置或范围超过 366 天 }
  /api/workday-rhythm/energy-notifications:
    post:
      summary: 把当前成员已经保存的精力补给动作发送到本人配置的飞书通知目标
      description: >-
        服务端从会话确定成员，并重新读取 workday-rhythm-config-v1 与指定日期的成员偏好；
        请求不接受成员 id、Webhook 配置 id、目标群、项目名称、次数或完成状态。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [action, date]
              properties:
                action:
                  type: string
                  minLength: 1
                  maxLength: 40
                  pattern: "^[A-Za-z0-9_-]+$"
                  description: 当前成员精力补给配置中的稳定项目标识
                date: { type: string, format: date }
      responses:
        "200":
          description: 返回是否实际投递；总开关或动作开关关闭时 sent 为 false
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/EnergyNotificationResult"
        "400": { description: 配置损坏、缺少目标群、飞书应用未配置或当天动作尚未保存 }
        "502": { description: 飞书开放平台拒绝请求或暂不可达 }
  /api/workday-rhythm/focus-notifications:
    post:
      summary: 把当前成员已保存的今日重点发到本人通知目标
      description: >-
        请求只接收日期；服务端从会话确定成员，重新读取成员的通知目标和指定日期已落库的非空重点。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [date]
              properties:
                date: { type: string, format: date }
      responses:
        "200": { description: 返回是否实际投递；总开关或重点开关关闭时 sent 为 false }
        "400": { description: 少于三个重点完整落库、配置损坏或通知目标不可用 }
        "502": { description: 飞书开放平台拒绝请求或暂不可达 }
components:
  schemas:
    WorkdayRhythmHistory:
      type: object
      required: [from, to, items, skippedCount]
      properties:
        from: { type: string, format: date }
        to: { type: string, format: date }
        skippedCount: { type: integer, minimum: 0 }
        items:
          type: array
          items: { $ref: "#/components/schemas/WorkdayRhythmHistoryDay" }
    WorkdayRhythmHistoryDay:
      type: object
      required: [date, workdayActive, focus, energyItems, checklist]
      properties:
        date: { type: string, format: date }
        workdayActive: { type: boolean }
        focus:
          type: array
          maxItems: 20
          items: { type: string }
        energyItems:
          type: array
          items: { $ref: "#/components/schemas/WorkdayRhythmHistoryEnergy" }
        checklist:
          type: array
          items:
            type: object
            required: [title, category]
            properties:
              title: { type: string }
              category: { type: string, enum: [WORK, LIFE] }
              completedAt: { type: string, format: date-time, nullable: true }
              completedOnTime: { type: boolean, nullable: true }
        documentId: { type: string, nullable: true }
        documentKbId: { type: string, nullable: true }
        documentTitle: { type: string, nullable: true }
    WorkdayRhythmHistoryEnergy:
      type: object
      required: [id, title, mode, count]
      properties:
        id: { type: string }
        title: { type: string }
        mode: { type: string, enum: [COUNT, DAILY_ONCE] }
        count: { type: integer, minimum: 0, maximum: 99 }
    EnergyNotificationResult:
      type: object
      required: [sent, chatName]
      properties:
        sent: { type: boolean }
        chatName: { type: string }
