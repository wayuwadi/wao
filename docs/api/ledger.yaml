openapi: 3.0.3
info:
  title: WAO 账务本 API
  version: 1.0.0
  description: 基于浏览器登录会话；账本默认私人，共享成员须由创建者明确邀请。
paths:
  /api/ledger/books:
    get:
      summary: 列出当前成员可访问的账本
      responses:
        '200': { description: ApiResponse<List<Book>> }
        '401': { description: 未登录 }
    post:
      summary: 新建默认私人的账本
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [title]
              properties:
                title: { type: string, maxLength: 128 }
      responses:
        '200': { description: ApiResponse<Book> }
  /api/ledger/books/{bookId}:
    get:
      summary: 读取账本、成员、账目、结算历史与汇总
      parameters: [{ name: bookId, in: path, required: true, schema: { type: string } }]
      responses:
        '200': { description: ApiResponse<BookDetail>；汇总只含已确认的未结金额 }
        '404': { description: 不存在或无权访问 }
  /api/ledger/books/{bookId}/members/{memberId}:
    put:
      summary: 创建者邀请成员或更新其权限
      parameters:
        - { name: bookId, in: path, required: true, schema: { type: string } }
        - { name: memberId, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [role]
              properties:
                role: { type: string, enum: [EDITOR, VIEWER] }
      responses:
        '200': { description: 成员权限已保存 }
        '403': { description: 非创建者 }
    delete:
      summary: 创建者撤销受邀成员访问
      parameters:
        - { name: bookId, in: path, required: true, schema: { type: string } }
        - { name: memberId, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: 已撤销 }
  /api/ledger/books/{bookId}/entries:
    post:
      summary: 新建一笔明账
      parameters: [{ name: bookId, in: path, required: true, schema: { type: string } }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EntryInput' }
      responses:
        '200': { description: ApiResponse<Entry> }
  /api/ledger/books/{bookId}/entries/{entryId}:
    patch:
      summary: 按版本修改账目并追加修改历史；作废也通过此接口
      parameters:
        - { name: bookId, in: path, required: true, schema: { type: string } }
        - { name: entryId, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EntryInput' }
      responses:
        '200': { description: ApiResponse<Entry> }
        '409': { description: 版本冲突，请刷新后核对草稿 }
  /api/ledger/books/{bookId}/entries/{entryId}/settlements:
    post:
      summary: 追加一次结算，不提供删除
      parameters:
        - { name: bookId, in: path, required: true, schema: { type: string } }
        - { name: entryId, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [amount, settledOn]
              properties:
                amount: { type: number, multipleOf: 0.01, minimum: 0.01 }
                settledOn: { type: string, format: date }
                note: { type: string, maxLength: 500 }
      responses:
        '200': { description: ApiResponse<Entry> }
        '400': { description: 金额超过未结余额或账目已作废 }
components:
  schemas:
    EntryInput:
      type: object
      required: [title, counterparty, category, direction, status, amount]
      properties:
        title: { type: string, maxLength: 160 }
        counterparty: { type: string, maxLength: 160 }
        category: { type: string, enum: [OLD, BAD, FUTURE] }
        direction: { type: string, enum: [RECEIVE, PAY] }
        status: { type: string, enum: [TO_VERIFY, CONFIRMED, DISPUTED, VOID] }
        amount: { type: number, multipleOf: 0.01, minimum: 0.01 }
        occurredOn: { type: string, format: date, nullable: true }
        dueOn: { type: string, format: date, nullable: true }
        evidence: { type: string, maxLength: 1000, nullable: true, description: 已确认状态必填 }
        disputeNote: { type: string, maxLength: 1000, nullable: true, description: 有争议状态必填 }
        nextAction: { type: string, maxLength: 1000, nullable: true }
        version: { type: integer, minimum: 1, nullable: true, description: 修改时必填；新建时留空 }
