openapi: 3.0.3
info:
  title: WAO Account Authentication API
  version: 0.1.0
paths:
  /api/auth/session:
    get:
      summary: 获取当前服务端会话
      responses:
        "200": { description: 已登录 }
        "401": { description: 未登录 }
  /api/auth/jenkins:
    get:
      summary: 为 Nginx 内部鉴权子请求返回当前成员的 Jenkins 身份与固定角色组
      responses:
        "200":
          description: 会话有效；X-WAO-Jenkins-User 和 X-WAO-Jenkins-Groups 响应头可供受信任代理读取
        "401": { description: WAO 会话缺失或已过期 }
  /api/auth/email/register:
    post:
      summary: 以邮箱、密码和昵称注册并登录
      responses:
        "200": { description: 注册成功 }
        "409": { description: 邮箱已绑定 }
  /api/auth/email/login:
    post:
      summary: 邮箱密码登录
      responses:
        "200": { description: 登录成功 }
        "401": { description: 凭据错误或账号不可用 }
  /api/auth/logout:
    post:
      summary: 注销当前会话
      responses:
        "200": { description: 已注销 }
  /api/auth/feishu/authorize:
    get:
      summary: 获取飞书扫码、授权或绑定场景的签名授权地址
      parameters:
        - in: query
          name: scene
          schema: { type: string, enum: [qr, authorization, workbench, browser, link] }
      responses:
        "200": { description: 返回 authorizationUrl }
        "400": { description: 场景不合法 }
  /api/auth/feishu/exchange:
    post:
      summary: 交换飞书授权码并登录、绑定或进入成员认领
      responses:
        "200": { description: 返回统一账号或待认领结果 }
  /api/auth/wechat/authorize:
    get:
      summary: 获取微信开放平台网站应用扫码授权地址
      responses:
        "200": { description: 返回 authorizationUrl }
        "502": { description: 微信网站应用尚未配置 }
  /api/auth/wechat/exchange:
    post:
      summary: 交换微信授权码并登录、绑定或进入成员认领
      responses:
        "200": { description: 返回统一账号或待认领结果 }
  /api/auth/wechat/official/sessions:
    post:
      summary: 创建微信公众号带参二维码和四位验证码登录会话
      responses:
        "200": { description: 返回五分钟有效的二维码、验证码、会话 id 和过期时间 }
        "502": { description: 认证公众号未配置或微信官方接口不可用 }
  /api/auth/wechat/official/sessions/{sessionId}:
    get:
      summary: 轮询当前浏览器发起的公众号扫码与验证码状态
      parameters:
        - in: path
          name: sessionId
          required: true
          schema: { type: string }
      responses:
        "200": { description: 返回 WAITING_SCAN、WAITING_CODE、COMPLETED 或 EXPIRED，完成时签发 WAO 会话 }
        "401": { description: 会话不属于当前浏览器 }
  /api/auth/wechat/official/callback:
    get:
      summary: 验证微信公众号服务器地址签名并回显 echostr
      responses:
        "200": { description: 签名有效 }
        "401": { description: 签名无效 }
    post:
      summary: 接收已验签的公众号扫码、关注和文本验证码 XML 消息
      responses:
        "200": { description: 返回微信公众号被动回复 XML 或 success }
        "401": { description: 签名无效 }
  /api/settings/login/wechat-official:
    get:
      summary: 读取系统级微信公众号登录配置，密钥只返回脱敏状态
      responses:
        "200": { description: 返回开关、App ID、密钥脱敏值、完整状态与回调路径 }
        "401": { description: 未登录 }
    put:
      summary: 保存微信公众号登录配置并立即用于后续登录会话
      responses:
        "200": { description: 已加密保存并返回脱敏配置 }
        "400": { description: 启用时缺少 App ID、App Secret 或回调 Token }
        "401": { description: 未登录 }
  /api/settings/login/wechat-official/verify:
    post:
      summary: 通过微信稳定版令牌接口验证当前公众号凭据与主节点出口 IP 白名单
      responses:
        "200": { description: 微信真实接口验证通过并预热共享 access token }
        "401": { description: 未登录 }
        "502": { description: 返回精确的 App ID、App Secret、账号权限或出口 IP 白名单诊断 }
  /api/account/email:
    put:
      summary: 为当前账号绑定邮箱并设置或修改密码
      responses:
        "200": { description: 已更新 }
        "401": { description: 未登录或当前密码错误 }
        "409": { description: 邮箱已属于其他账号 }
  /api/account/profile:
    put:
      summary: 修改当前账号对应的持久化成员名称和头像文字
      responses:
        "200": { description: 返回更新后的统一账号会话 }
        "401": { description: 未登录 }
  /api/auth/claim:
    post:
      summary: 将本次已验证第三方身份认领到一个尚未绑定的既有成员
      responses:
        "200": { description: 认领并登录成功 }
        "409": { description: 成员已经被认领 }
  /api/account/identities/{provider}:
    delete:
      summary: 解绑当前账号的一种登录身份，且至少保留一种
      parameters:
        - in: path
          name: provider
          required: true
          schema: { type: string, enum: [email, feishu, wechat] }
      responses:
        "200": { description: 解绑成功 }
        "400": { description: 解绑后将没有可用登录方式 }
