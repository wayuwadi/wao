openapi: 3.0.3
info:
  title: WAO Account Authentication API
  version: 0.1.0
paths:
  /api/auth/session:
    get:
      summary: 获取当前服务端会话
      responses:
        "200": { description: 已登录 }
        "401": { description: 未登录 }
  /api/auth/jenkins:
    get:
      summary: 为 Nginx 内部鉴权子请求返回当前成员的 Jenkins 身份与固定角色组
      responses:
        "200":
          description: 会话有效；X-WAO-Jenkins-User 和 X-WAO-Jenkins-Groups 响应头可供受信任代理读取
        "401": { description: WAO 会话缺失或已过期 }
  /api/auth/email/register:
    post:
      summary: 以邮箱、密码和昵称注册并登录
      responses:
        "200": { description: 注册成功 }
        "409": { description: 邮箱已绑定 }
  /api/auth/email/login:
    post:
      summary: 邮箱密码登录
      responses:
        "200": { description: 登录成功 }
        "401": { description: 凭据错误或账号不可用 }
  /api/auth/logout:
    post:
      summary: 注销当前会话
      responses:
        "200": { description: 已注销 }
  /api/auth/feishu/authorize:
    get:
      summary: 获取飞书扫码、授权或绑定场景的签名授权地址
      parameters:
        - in: query
          name: scene
          schema: { type: string, enum: [qr, authorization, workbench, browser, link] }
      responses:
        "200": { description: 返回 authorizationUrl }
        "400": { description: 场景不合法 }
  /api/auth/feishu/exchange:
    post:
      summary: 交换飞书授权码并登录、绑定或进入成员认领
      responses:
        "200": { description: 返回统一账号或待认领结果 }
  /api/auth/feishu/callback:
    get:
      summary: 接收飞书登录或个人表情授权回调
      parameters:
        - { in: query, name: state, required: true, schema: { type: string } }
        - { in: query, name: code, schema: { type: string } }
      responses:
        "302": { description: 普通登录跳转前端回调页，行为不变 }
        "303": { description: 个人表情授权处理后跳转 /api/auth/feishu/reactions/result，不在地址中保留授权码 }
  /api/auth/feishu/reactions/result:
    get:
      summary: 查看当前浏览器最近十分钟内的个人表情授权结果
      description: 返回 HTML；刷新不会再次兑换授权码，无结果或结果过期时展示授权入口。禁止缓存及向外传递来源地址。
      responses:
        "200": { description: 个人授权结果或授权入口，不改变 WAO 登录身份 }
  /api/account/email:
    put:
      summary: 为当前账号绑定邮箱并设置或修改密码
      responses:
        "200": { description: 已更新 }
        "401": { description: 未登录或当前密码错误 }
        "409": { description: 邮箱已属于其他账号 }
  /api/account/profile:
    put:
      summary: 修改当前账号对应的持久化成员名称和头像文字
      responses:
        "200": { description: 返回更新后的统一账号会话 }
        "401": { description: 未登录 }
  /api/auth/claim:
    post:
      summary: 将本次已验证第三方身份认领到一个尚未绑定的既有成员
      responses:
        "200": { description: 认领并登录成功 }
        "409": { description: 成员已经被认领 }
  /api/account/identities/{provider}:
    delete:
      summary: 解绑当前账号的一种登录身份，且至少保留一种
      parameters:
        - in: path
          name: provider
          required: true
          schema: { type: string, enum: [email, feishu] }
      responses:
        "200": { description: 解绑成功 }
        "400": { description: 解绑后将没有可用登录方式 }
