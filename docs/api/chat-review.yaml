openapi: 3.0.3
info:
  title: WAO 共享聊天复盘 API
  version: 0.1.0
  description: >
    对当前唯一配置的飞书群执行“静默按日同步→精确核对两位发言人→只读 Codex 分析→共享保存”。
    所有接口都需要 WAO 登录会话，所有已登录成员读写同一份配置、全局活动运行和历史；运行内部快照群与知识库，
    每日来源按知识库、群 id 和自然日稳定定位，切换群不会覆盖旧报告链接指向的归档。
security:
  - cookieAuth: []
paths:
  /api/chat-reviews/config:
    get:
      operationId: getChatReviewConfig
      summary: 读取当前群聊、可选发言人和已固定的两人
      description: 当前飞书群、知识库及 feishu.chat-sync.senders 由服务端一次批量 SQL 读取为同一配置快照；不在本请求中实时调用飞书成员 API。
      responses:
        "200":
          description: 不包含飞书 App Secret
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ChatReviewConfigEnvelope" }
    put:
      operationId: saveChatReviewConfig
      summary: 为当前唯一群固定两位分析对象
      description: >
        请求体必须恰好是一份 JSON 对象，不允许空正文、重复键或首个 JSON 值后的尾随 token；
        只接受当前 feishu.chat-sync.senders 已配置成员映射中的两个不同 open_id，不实时调用飞书成员 API。
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SaveChatReviewConfigRequest" }
      responses:
        "200":
          description: 已用当前群发言人配置重新校验并保存
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ChatReviewConfigEnvelope" }
        "400":
          description: 空正文、重复键、尾随 token、非法 JSON、缺失或额外字段、speakerIds 不是恰好两个不同字符串，或当前飞书同步配置不完整
        "415": { description: Content-Type 不是 application/json }

  /api/chat-reviews:
    post:
      operationId: createChatReview
      summary: 提交一次非阻塞聊天复盘
      description: >
        请求体必须恰好是一份 JSON 对象，不允许空正文、重复键或首个 JSON 值后的尾随 token。
        服务端只持久化 WAITING 运行并立即返回；运行同时快照当前群和知识库，不在本 HTTP 请求中等待飞书或 Codex。
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateChatReviewRequest" }
      responses:
        "202":
          description: 已入队
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ChatReviewCreatedEnvelope" }
        "400":
          description: >
            空正文、重复键、尾随 token、非法 JSON、缺失或额外字段、日期早于 1970-01-01、日期倒置、超过 31 天、endDate 晚于上海今天、focus 为 null / 非字符串或超过 1000 字，
            或共享配置尚未完成 / 已失效
        "409":
          description: 全局已有活动运行（即使当前群配置已切换）；使用统一错误包，不额外返回 activeRunId
        "415": { description: Content-Type 不是 application/json }
    get:
      operationId: listChatReviews
      summary: 读取共享活动运行和最近历史
      description: 不按当前 chatId 过滤；切换群或知识库配置后仍返回旧活动运行，直至其进入终态。
      responses:
        "200":
          description: 全局活动运行最多一条；历史最多 60 条，包含成功报告与失败尝试
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ChatReviewListEnvelope" }

  /api/chat-reviews/shared:
    post:
      operationId: createSharedChatReview
      summary: 从共享聊天真实消息范围创建复盘
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateSharedChatReviewRequest" }
      responses:
        "202": { description: 已固化消息快照、AI 能力与手动触发来源并入队 }
        "400": { description: 范围、关注重点或 AI 能力无效，或没有真实消息 }
        "409": { description: 全局已有活动复盘 }

  /api/chat-reviews/automation:
    get:
      operationId: getChatReviewAutomation
      summary: 读取全局自动复盘策略与下次触发时间
      responses:
        "200": { description: 返回数据库持久化的完整策略 }
    put:
      operationId: saveChatReviewAutomation
      summary: 原子保存自动复盘完整策略
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ChatReviewAutomation" }
      responses:
        "200": { description: 已从数据库当前时间重算下次计划点 }
        "400": { description: 间隔、范围、关注重点或 AI 能力无效 }

  /api/chat-reviews/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, maxLength: 32 }
    get:
      operationId: getChatReview
      summary: 读取一次共享运行的阶段、进度、报告与来源
      responses:
        "200":
          description: 返回服务端持久化权威状态；未成功时 report 为 null
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ChatReviewDetailEnvelope" }
        "404": { description: 运行不存在 }

  /api/chat-reviews/{id}/retry:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, maxLength: 32 }
    post:
      operationId: retryChatReview
      summary: 复制失败运行的原参数并创建新运行
      description: 请求体必须为空；新运行复制原群、知识库、两位发言人、日期与 focus 快照并从第一天重新同步；表内 retry_of_id 指回原失败记录，原记录不修改。
      responses:
        "202":
          description: 已创建新 WAITING 运行
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ChatReviewCreatedEnvelope" }
        "400": { description: 请求携带任何非空正文、原运行不是 FAILED，或当前飞书同步群 / 知识库与原快照不同 }
        "404": { description: 原运行不存在 }
        "409": { description: 全局已有活动运行 }

  /api/chat-reviews/{id}/rerun:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, maxLength: 32 }
    post:
      operationId: rerunChatReview
      summary: 按成功报告保存的原参数创建新运行
      description: 请求体必须为空；复制原运行的群、知识库、两位发言人、日期和 focus 快照，新建 WAITING 运行，旧报告保留。
      responses:
        "202":
          description: 已创建新 WAITING 运行
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ChatReviewCreatedEnvelope" }
        "400": { description: 请求携带任何非空正文、原运行不是 SUCCEEDED，或当前飞书同步群 / 知识库与原快照不同 }
        "404": { description: 原运行不存在 }
        "409": { description: 全局已有活动运行 }

components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: WAO_SESSION
  schemas:
    SaveChatReviewConfigRequest:
      type: object
      additionalProperties: false
      required: [speakerIds]
      properties:
        speakerIds:
          type: array
          minItems: 2
          maxItems: 2
          uniqueItems: true
          items: { type: string, minLength: 1, maxLength: 128 }
          description: 恰好两个当前 feishu.chat-sync.senders 已配置成员 id（飞书 open_id）

    CreateChatReviewRequest:
      type: object
      additionalProperties: false
      required: [startDate, endDate]
      properties:
        startDate: { type: string, format: date, description: 上海自然日，包含；不得早于 1970-01-01 }
        endDate: { type: string, format: date, description: 上海自然日，包含；不得早于 1970-01-01 或晚于上海今天 }
        focus:
          type: string
          maxLength: 1000
          description: 可省略，但不接受 null；去掉首尾空白后为空时按未填处理；仅改变分析关注点

    CreateSharedChatReviewRequest:
      type: object
      additionalProperties: false
      required: [rangeKind, rangeValue]
      properties:
        rangeKind: { type: string, enum: [MESSAGES, HOURS] }
        rangeValue: { type: integer, description: MESSAGES 为 5～100；HOURS 为 1～168 }
        focus: { type: string, maxLength: 1000 }
        aiCapabilityId: { type: string, maxLength: 32, description: 可省略；默认 local-codex }

    ChatReviewAutomation:
      type: object
      additionalProperties: false
      required: [enabled, intervalSeconds, rangeKind, rangeValue, aiCapabilityId]
      properties:
        enabled: { type: boolean }
        intervalSeconds: { type: integer, minimum: 300, maximum: 604800 }
        rangeKind: { type: string, enum: [MESSAGES, HOURS] }
        rangeValue: { type: integer, description: MESSAGES 为 5～100；HOURS 为 1～168 }
        focus: { type: string, maxLength: 1000, nullable: true }
        aiCapabilityId: { type: string, maxLength: 32 }
        nextFireAt: { type: string, format: date-time, nullable: true, readOnly: true }
        lastRunId: { type: string, maxLength: 32, nullable: true, readOnly: true }
        updatedAt: { type: string, format: date-time, nullable: true, readOnly: true }

    ChatReviewSpeaker:
      type: object
      additionalProperties: false
      required: [id, name]
      properties:
        id: { type: string, minLength: 1, maxLength: 128, description: 飞书 open_id }
        name: { type: string, minLength: 1, maxLength: 128 }

    ChatReviewConfig:
      type: object
      additionalProperties: false
      required: [chatConfigured, configured, chatId, chatName, availableSpeakers, selectedSpeakers, message]
      properties:
        chatConfigured: { type: boolean, description: 飞书 App、唯一群和归档知识库是否完整 }
        configured: { type: boolean, description: 两位分析对象是否仍在当前群配置中有效 }
        chatId: { type: string, maxLength: 128 }
        chatName: { type: string, maxLength: 255 }
        availableSpeakers:
          type: array
          description: 当前 feishu.chat-sync.senders 已配置成员映射，不代表一次实时飞书成员查询
          items: { $ref: "#/components/schemas/ChatReviewSpeaker" }
        selectedSpeakers:
          type: array
          minItems: 0
          maxItems: 2
          items: { $ref: "#/components/schemas/ChatReviewSpeaker" }
        message: { type: string, maxLength: 500 }

    ChatReviewCreated:
      type: object
      additionalProperties: false
      required: [runId]
      properties:
        runId: { type: string, maxLength: 32 }

    ChatReviewStage:
      type: string
      enum: [WAITING, SYNCING, VERIFYING, ANALYZING, SUCCEEDED, FAILED]

    ChatReviewRunSummary:
      type: object
      additionalProperties: false
      required:
        - id
        - sourceKind
        - aiCapabilityId
        - triggerKind
        - startDate
        - endDate
        - focus
        - stage
        - progressCurrent
        - progressTotal
        - currentDate
        - failedStage
        - failedDate
        - error
        - messageCount
        - createdById
        - createdByName
        - createdAt
        - startedAt
        - finishedAt
      properties:
        id: { type: string, maxLength: 32 }
        sourceKind: { type: string, enum: [FEISHU_ARCHIVE, SHARED_CHAT] }
        aiCapabilityId: { type: string, maxLength: 32 }
        triggerKind: { type: string, enum: [MANUAL, AUTOMATIC] }
        rangeKind: { type: string, enum: [MESSAGES, HOURS], nullable: true }
        rangeValue: { type: integer, nullable: true }
        startDate: { type: string, format: date, nullable: true }
        endDate: { type: string, format: date, nullable: true }
        focus: { type: string, maxLength: 1000, nullable: true }
        stage: { $ref: "#/components/schemas/ChatReviewStage" }
        progressCurrent: { type: integer, minimum: 0, maximum: 31, description: 已完成同步日数；全范围同步后在分析和终态仍保留 N }
        progressTotal: { type: integer, minimum: 1, maximum: 31, description: 所选范围总日数 N，包含 0 条有效消息的日期 }
        currentDate: { type: string, format: date, nullable: true }
        failedStage: { allOf: [{ $ref: "#/components/schemas/ChatReviewStage" }], nullable: true }
        failedDate: { type: string, format: date, nullable: true }
        error: { type: string, maxLength: 2000, nullable: true }
        messageCount: { type: integer, minimum: 0 }
        createdById: { type: string, maxLength: 32 }
        createdByName: { type: string, maxLength: 128 }
        createdAt: { type: string, format: date-time, description: "MySQL 签发后按上海时区返回，RFC 3339 +08:00" }
        startedAt: { type: string, format: date-time, nullable: true, description: "MySQL 签发后按上海时区返回，RFC 3339 +08:00；未开始时为 null" }
        finishedAt: { type: string, format: date-time, nullable: true, description: "MySQL 签发后按上海时区返回，RFC 3339 +08:00；非终态时为 null" }

    ChatReviewRunDetail:
      type: object
      additionalProperties: false
      required:
        - id
        - sourceKind
        - aiCapabilityId
        - triggerKind
        - startDate
        - endDate
        - focus
        - stage
        - progressCurrent
        - progressTotal
        - currentDate
        - failedStage
        - failedDate
        - error
        - messageCount
        - createdById
        - createdByName
        - createdAt
        - startedAt
        - finishedAt
        - chatId
        - chatName
        - speakers
        - aiRunId
        - sources
        - report
      properties:
        id: { type: string, maxLength: 32 }
        sourceKind: { type: string, enum: [FEISHU_ARCHIVE, SHARED_CHAT] }
        aiCapabilityId: { type: string, maxLength: 32 }
        triggerKind: { type: string, enum: [MANUAL, AUTOMATIC] }
        rangeKind: { type: string, enum: [MESSAGES, HOURS], nullable: true }
        rangeValue: { type: integer, nullable: true }
        startDate: { type: string, format: date, nullable: true }
        endDate: { type: string, format: date, nullable: true }
        focus: { type: string, maxLength: 1000, nullable: true }
        stage: { $ref: "#/components/schemas/ChatReviewStage" }
        progressCurrent: { type: integer, minimum: 0, maximum: 31, description: 已完成同步日数；全范围同步后在分析和终态仍保留 N }
        progressTotal: { type: integer, minimum: 1, maximum: 31, description: 所选范围总日数 N，包含 0 条有效消息的日期 }
        currentDate: { type: string, format: date, nullable: true }
        failedStage: { allOf: [{ $ref: "#/components/schemas/ChatReviewStage" }], nullable: true }
        failedDate: { type: string, format: date, nullable: true }
        error: { type: string, maxLength: 2000, nullable: true }
        messageCount: { type: integer, minimum: 0 }
        createdById: { type: string, maxLength: 32 }
        createdByName: { type: string, maxLength: 128 }
        createdAt: { type: string, format: date-time, description: "MySQL 签发后按上海时区返回，RFC 3339 +08:00" }
        startedAt: { type: string, format: date-time, nullable: true, description: "MySQL 签发后按上海时区返回，RFC 3339 +08:00；未开始时为 null" }
        finishedAt: { type: string, format: date-time, nullable: true, description: "MySQL 签发后按上海时区返回，RFC 3339 +08:00；非终态时为 null" }
        chatId: { type: string, maxLength: 128 }
        chatName: { type: string, maxLength: 255 }
        speakers:
          type: array
          minItems: 2
          maxItems: 2
          items: { $ref: "#/components/schemas/ChatReviewSpeaker" }
        aiRunId: { type: string, maxLength: 32, nullable: true }
        sources:
          type: array
          maxItems: 31
          description: >
            全范围同步成功并完成核对后，包含所选范围每个日期的最新归档元数据，按日期升序编号；
            messageCount 可为 0，但只有大于 0 的来源会送入 AI 并允许被报告引用。来源文档按知识库、群 id、日期稳定定位，
            不会因后来切换配置群而被新群内容覆盖。
          items: { $ref: "#/components/schemas/ChatReviewSource" }
        report: { allOf: [{ $ref: "#/components/schemas/ChatReviewReport" }], nullable: true }

    ChatReviewSource:
      type: object
      additionalProperties: false
      required: [id, date, kbId, documentId, url, messageCount]
      properties:
        id: { type: string, pattern: "^S[1-9][0-9]*$", example: S1 }
        date: { type: string, format: date }
        kbId: { type: string, maxLength: 32 }
        documentId: { type: string, maxLength: 32 }
        url: { type: string, maxLength: 500, example: "/kb/kb1?doc=d1", description: 当次群与日期归档文档的站内链接；切换群后不会重用该文档身份 }
        messageCount:
          type: integer
          minimum: 0
          description: 当日精确匹配两位发言人的有效消息数；0 表示仅用于核对同步覆盖，不得被报告引用

    ChatReviewReport:
      type: object
      additionalProperties: false
      required: [discussionProcess, discussionDirections, conclusions, recommendations]
      description: 四段都拒绝 Markdown 图片 / 链接、URL、HTML 和引用式链接定义，避免展示 AI 结果时发起外联请求
      properties:
        discussionProcess: { type: string, minLength: 1, maxLength: 6000, description: "至少一个 messageCount > 0 的有效 [S编号]" }
        discussionDirections: { type: string, minLength: 1, maxLength: 6000, description: "至少一个 messageCount > 0 的有效 [S编号]" }
        conclusions:
          type: string
          minLength: 1
          maxLength: 6000
          description: >
            至少一个 messageCount > 0 的有效 [S编号]；必须含“已明确：”“暂定：”“未解决：”三个分类且各自后接非空内容。
            分类可位于开头、句界、Markdown 列表项或标题，正文中仅提到三个词不算通过。
        recommendations:
          type: string
          minLength: 1
          maxLength: 6000
          description: 必须以“AI 建议：”或同名 Markdown 标题开头并后接非空内容

    ChatReviewList:
      type: object
      additionalProperties: false
      required: [activeRun, history]
      properties:
        activeRun: { allOf: [{ $ref: "#/components/schemas/ChatReviewRunSummary" }], nullable: true }
        history:
          type: array
          maxItems: 60
          items: { $ref: "#/components/schemas/ChatReviewRunSummary" }

    ChatReviewConfigEnvelope:
      type: object
      additionalProperties: false
      required: [code, message, data, timestamp]
      properties:
        code: { type: integer, example: 0 }
        message: { type: string, example: success }
        data: { $ref: "#/components/schemas/ChatReviewConfig" }
        timestamp: { type: integer, format: int64 }

    ChatReviewCreatedEnvelope:
      type: object
      additionalProperties: false
      required: [code, message, data, timestamp]
      properties:
        code: { type: integer, example: 0 }
        message: { type: string, example: success }
        data: { $ref: "#/components/schemas/ChatReviewCreated" }
        timestamp: { type: integer, format: int64 }

    ChatReviewListEnvelope:
      type: object
      additionalProperties: false
      required: [code, message, data, timestamp]
      properties:
        code: { type: integer, example: 0 }
        message: { type: string, example: success }
        data: { $ref: "#/components/schemas/ChatReviewList" }
        timestamp: { type: integer, format: int64 }

    ChatReviewDetailEnvelope:
      type: object
      additionalProperties: false
      required: [code, message, data, timestamp]
      properties:
        code: { type: integer, example: 0 }
        message: { type: string, example: success }
        data: { $ref: "#/components/schemas/ChatReviewRunDetail" }
        timestamp: { type: integer, format: int64 }
