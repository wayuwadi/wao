openapi: 3.0.3
info:
  title: WAO WeKnora 内容同步
  version: 1.1.0
paths:
  /api/weknora-sync:
    get:
      summary: 已登录成员可读取共享配置、本人可见来源数量及近期运行记录；不返回密钥
      responses:
        '200': {description: ApiResponse，data 包含 ownerId、configured、settings、catalog、runs、items、totals}
        '401': {description: 未登录}
    put:
      summary: 仅系统管理员可 CAS 保存并验证连接；apiKey 为空保留现有加密密钥
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [kbId, modules, batchLimit, syncDeletes, enabled, time, revision]
              properties:
                kbId: {type: string, format: uuid}
                apiKey: {type: string, writeOnly: true}
                modules: {type: array, items: {type: string}}
                batchLimit: {type: integer, minimum: 1, maximum: 100}
                syncDeletes: {type: boolean}
                enabled: {type: boolean}
                liveSync: {type: boolean, description: 知识类内容每分钟检查开关；省略保持原配置，未配置时默认开启}
                time: {type: string, example: '02:00'}
                revision: {type: integer}
      responses:
        '200': {description: 已保存，已验证 Wiki-only 目标库可访问}
        '409': {description: 版本冲突、同步正在执行或已有副本不允许改绑}
  /api/weknora-sync/run:
    post:
      summary: 持久化手动入队，重复触发返回同一活动任务 ID
      responses:
        '200': {description: ApiResponse data.id；此时仅表示入队，不表示已同步}
  /api/weknora-sync/progress:
    get:
      summary: 最近 20 次运行和最近 100 项处理结果，供轮询使用
      responses:
        '200': {description: ApiResponse data.runs 与 data.items}
  /api/weknora-sync/source:
    get:
      summary: 在同一权限边界内查看当前来源分段
      parameters:
        - {name: key, in: query, required: true, schema: {type: string}}
      responses:
        '200': {description: ApiResponse data 包含 key、module、title、url、content、hash、originalUrl（文档的原文路由）}
        '404': {description: 来源已删除或不在所选范围}

  /api/weknora-sync/knowledge-run:
    post:
      summary: 手动入队，仅同步已选知识库、小记及记忆；复用活动队列
      responses:
        '200': {description: ApiResponse data.id；仅表示入队}
  /api/weknora-sync/documents:
    get:
      summary: 按服务器当前正文指纹批量核对文档全部分段，不返回正文
      parameters:
        - {name: ids, in: query, required: true, schema: {type: array, minItems: 1, maxItems: 100, items: {type: string}}, description: 逗号分隔的文档 id}
      responses:
        '200': {description: 'ApiResponse data 数组；每项 id、state、message、sourceUrl、knowledgeUrl。无权访问的 id 不返回。state 为 unconfigured/excluded/pending/processing/processed/failed；processed 只表示解析摘要完成，不保证 Wiki 或问答。'}
        '400': {description: 空列表或超过 100 个 id}
        '401': {description: 未登录}
