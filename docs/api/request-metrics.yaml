openapi: 3.0.3
info:
  title: WAO HTTP 请求体验监控 API
  version: 0.1.0
paths:
  /api/request-metrics/batch:
    post:
      summary: 批量写入当前成员浏览器测得的 HTTP 请求指标
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [metrics]
              properties:
                metrics:
                  type: array
                  minItems: 1
                  maxItems: 100
                  items: { $ref: '#/components/schemas/RequestMetricInput' }
      responses:
        "200": { description: 返回实际写入条数 }
        "400": { description: 批次或字段不符合约束 }
  /api/request-metrics/overview:
    get:
      summary: 查询当前成员指定时间窗口的请求体验概览
      parameters:
        - name: hours
          in: query
          schema: { type: integer, minimum: 1, maximum: 168, default: 24 }
      responses:
        "200": { description: 聚合指标、按接口统计和最近请求明细 }
  /api/request-metrics:
    delete:
      summary: 清空当前成员的全部 HTTP 请求体验历史
      responses:
        "200":
          description: 返回实际删除条数；成员身份只从服务端会话解析
components:
  schemas:
    RequestMetricInput:
      type: object
      additionalProperties: false
      required: [method, path, durationMs, startedAt]
      properties:
        method: { type: string, maxLength: 8, example: GET }
        path: { type: string, maxLength: 255, example: /api/projects }
        statusCode: { type: integer, minimum: 100, maximum: 599, nullable: true }
        durationMs: { type: integer, minimum: 0, maximum: 600000 }
        networkType: { type: string, maxLength: 16, nullable: true, example: 4g }
        retryAttempt: { type: integer, minimum: 0, maximum: 3, default: 0 }
        startedAt: { type: string, format: date-time }
