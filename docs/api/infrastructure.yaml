openapi: 3.0.3
info:
  title: WAO 基础设施总览
  version: 1.0.0
paths:
  /api/auth/infrastructure:
    get:
      summary: Nginx 管理员会话准入检查
      responses:
        '200': { description: 当前账号为管理员或超级管理员 }
        '401': { description: 未登录 }
        '403': { description: 非管理员 }
  /api/infrastructure/overview:
    get:
      summary: 只读三节点资源、部署清单与趋势
      description: 经 Nginx 管理员鉴权，响应为 code/message/data/timestamp。完整数据字段及数值单位见 phase-1-infrastructure-overview.md。不接受节点地址或命令参数。
      parameters:
        - in: query
          name: hours
          schema: { type: integer, enum: [1, 24, 168], default: 24 }
      responses:
        '200':
          description: 真实采集快照；失败节点保留旧值并标记 error/stale
        '400': { description: 不支持的时间范围 }
        '401': { description: 未登录 }
        '403': { description: 非管理员 }
        '502': { description: 采集服务或隧道不可用 }
