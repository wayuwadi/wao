openapi: 3.0.3
info:
  title: WAO 个人草图 API
  version: 1.1.0
paths:
  /api/drawings:
    get:
      summary: 列出当前成员的草图文件元数据
      responses:
        '200': { description: OK }
    post:
      summary: 新建当前成员的空草图
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                title: { type: string, maxLength: 128 }
      responses:
        '200': { description: OK }
        '400': { description: 名称不合法 }
  /api/drawings/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string }
    get:
      summary: 读取当前成员的草图完整场景
      responses:
        '200': { description: OK }
        '404': { description: 文件不存在或不属于当前成员 }
    put:
      summary: 按 revision 乐观锁保存 Excalidraw 场景
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [sceneJson, revision]
              properties:
                sceneJson: { type: string, description: Excalidraw 开放 JSON 场景 }
                revision: { type: integer, minimum: 1 }
      responses:
        '200': { description: 保存后的新版本 }
        '400': { description: 场景 JSON 不合法 }
        '404': { description: 文件不存在或不属于当前成员 }
        '409': { description: 客户端 revision 已过期，服务端不覆盖新版本 }
    patch:
      summary: 重命名当前成员的草图
      responses:
        '200': { description: OK }
        '404': { description: 文件不存在或不属于当前成员 }
    delete:
      summary: 删除当前成员的草图
      responses:
        '200': { description: OK }
        '404': { description: 文件不存在或不属于当前成员 }
  /api/drawings/{id}/versions:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string }
    get:
      summary: 列出当前成员草图最近三个有效版本
      responses:
        '200': { description: 按版本号倒序返回，不含场景正文 }
        '404': { description: 文件不存在或不属于当前成员 }
  /api/drawings/{id}/versions/{revision}/restore:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string }
      - name: revision
        in: path
        required: true
        schema: { type: integer, minimum: 1 }
    post:
      summary: 把历史场景恢复为一个新的当前版本
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [revision]
              properties:
                revision: { type: integer, minimum: 1, description: 客户端当前所见版本 }
      responses:
        '200': { description: 恢复后新生成的当前版本 }
        '404': { description: 文件或历史版本不存在，或不属于当前成员 }
        '409': { description: 客户端当前版本已过期 }
