openapi: 3.0.3
info:
  title: WAO 参考图库接口
  version: 1.0.0
paths:
  /api/reference-images:
    get:
      summary: 列出当前成员最近 500 张私有参考图
      responses:
        '200':
          description: ApiResponse 包裹的 ReferenceImage 数组，不含图片正文
    post:
      summary: 免表单收进单张截图；同成员同内容返回已有记录
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: { type: string, format: binary, description: 'PNG/JPEG/GIF/WebP；单张不超过 10MB' }
      responses:
        '200': { description: ApiResponse 包裹的 ReferenceImage }
        '400': { description: 格式不支持、空文件或超出上限 }
  /api/reference-images/{id}/raw:
    get:
      summary: 当前成员读取自己的私有原图
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: 图片原始字节，Cache-Control no-store }
        '404': { description: 不存在或不属于当前成员 }
  /api/assistant/chat/stream:
    post:
      summary: AI 问答可选附最多四张当前成员参考图
      description: '沿用既有请求体，新增 referenceImageIds: string[]；带图时只允许 local-codex，原图由 Runner 领取后作为 --image 附件输入。'
      responses:
        '200': { description: 现有 token/done/error SSE }
        '400': { description: 图片数量、重复 ID 或 AI 能力不兼容 }
        '404': { description: 图片不存在或不属于当前成员 }
  /api/ai/runner/assistant-v2/{runId}/reference-images/{index}:
    get:
      summary: 本次已领取问答的 Runner 获取一张私有原图
      description: 必须同时提供 X-WAO-Runner-Token 和本次 claimToken；仅运行期间有效。
      parameters:
        - { name: runId, in: path, required: true, schema: { type: string } }
        - { name: index, in: path, required: true, schema: { type: integer, minimum: 0, maximum: 3 } }
        - { name: claimToken, in: query, required: true, schema: { type: string } }
      responses:
        '200': { description: 图片原始字节，Cache-Control no-store }
        '401': { description: Runner/领取令牌不匹配或运行已结束 }
        '404': { description: 图片索引无效 }
