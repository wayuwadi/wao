openapi: 3.0.3
info:
  title: WAO 组织共享聊天 API
  version: 0.2.0
  description: 所有接口需要 WAO 登录会话；消息对组织成员共享，飞书状态只来自真实开放 API 或事件。
security:
  - cookieAuth: []
paths:
  /api/chat/messages:
    get:
      operationId: listSharedChatMessages
      summary: 读取最近 100 条消息或游标后的增量消息
      parameters:
        - { name: after, in: query, required: false, schema: { type: string, maxLength: 32 } }
      responses:
        "200": { description: 按 createdAt、id 正序返回，含当前成员已读与表情状态 }
        "400": { description: 游标已经失效 }
    post:
      operationId: createSharedChatMessage
      summary: 保存 Markdown 图文或引用回复，并尝试发送普通飞书富文本
      description: 消息先落库；同成员与 clientToken 去重，消息 id 同时作为飞书 uuid。
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateMessageRequest" }
      responses:
        "200": { description: 返回含飞书同步终态的已保存消息 }
        "400": { description: 消息为空、超过 2000 字、token 或引用非法 }
  /api/chat/messages/read:
    post:
      operationId: markSharedChatRead
      summary: 把最近消息标记为当前 WAO 成员已读
      parameters:
        - { name: through, in: query, required: true, schema: { type: string, maxLength: 32 } }
      responses:
        "200": { description: 已读事实已幂等保存 }
  /api/chat/messages/{id}/retry-feishu:
    post:
      operationId: retrySharedChatFeishu
      summary: 以相同飞书 uuid 重试一条 WAO 消息
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, maxLength: 32 } }
      responses:
        "200": { description: 返回最新投递状态 }
        "404": { description: 消息不存在 }
  /api/chat/messages/{id}/reactions/{emojiType}:
    post:
      operationId: toggleSharedChatReaction
      summary: 切换当前成员的表情回复
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, maxLength: 32 } }
        - { name: emojiType, in: path, required: true, schema: { type: string, enum: [THUMBSUP, HEART, SMILE, DONE] } }
      responses:
        "200": { description: 飞书操作成功后返回最新聚合；没有飞书消息 id 时只保存 WAO 状态 }
  /api/chat/config:
    get:
      operationId: getSharedChatConfig
      summary: 读取当前共享聊天飞书群目标
      responses:
        "200": { description: 不包含飞书应用密钥 }
    put:
      operationId: saveSharedChatConfig
      summary: 保存机器人真实所在群；空 chatId 明确停用桥接
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties: { chatId: { type: string, maxLength: 128 } }
      responses:
        "200": { description: 返回已验证并保存的群目标 }
        "400": { description: 群不在当前应用真实群列表或应用未配置 }
  /api/chat/feishu-chats:
    get:
      operationId: listSharedChatFeishuGroups
      summary: 列出自建应用机器人真实所在群
      responses:
        "200": { description: 飞书开放 API 实时群列表 }
components:
  securitySchemes:
    cookieAuth: { type: apiKey, in: cookie, name: WAO_SESSION }
  schemas:
    CreateMessageRequest:
      type: object
      required: [clientToken, content]
      properties:
        clientToken: { type: string, minLength: 8, maxLength: 64, pattern: "^[A-Za-z0-9_-]+$" }
        content: { type: string, maxLength: 2000, description: Markdown 原文 }
        imageId: { type: string, maxLength: 32, nullable: true, deprecated: true }
        replyToId: { type: string, maxLength: 32, nullable: true }
    Member:
      type: object
      required: [id, name, initial, color, role]
      properties:
        id: { type: string }
        name: { type: string }
        initial: { type: string }
        color: { type: string }
        role: { type: string }
    Reaction:
      type: object
      required: [emojiType, emoji, count, reacted, names]
      properties:
        emojiType: { type: string }
        emoji: { type: string }
        count: { type: integer, minimum: 1 }
        reacted: { type: boolean }
        names: { type: array, items: { type: string } }
    Reply:
      type: object
      required: [id, authorName, preview]
      properties:
        id: { type: string }
        authorName: { type: string }
        preview: { type: string }
    Message:
      type: object
      required: [id, author, content, source, deleted, read, readCount, feishuReadCount, reactions, feishuStatus, createdAt]
      properties:
        id: { type: string, maxLength: 32 }
        author: { $ref: "#/components/schemas/Member" }
        content: { type: string, description: WAO 主动发送最多 2000 字；飞书入站不截断 }
        imageId: { type: string, nullable: true }
        imageName: { type: string, nullable: true }
        imageUrl: { type: string, nullable: true }
        source: { type: string, enum: [WAO, FEISHU] }
        replyTo: { allOf: [{ $ref: "#/components/schemas/Reply" }], nullable: true }
        deleted: { type: boolean }
        read: { type: boolean, description: 当前 WAO 成员是否已读 }
        readCount: { type: integer, minimum: 0 }
        feishuReadCount: { type: integer, minimum: 0, description: 仅统计官方已读事件 }
        reactions: { type: array, items: { $ref: "#/components/schemas/Reaction" } }
        feishuStatus: { type: string, enum: [PENDING, SENT, FAILED, UNAVAILABLE, RECEIVED] }
        feishuError: { type: string, nullable: true }
        createdAt: { type: string, format: date-time }
