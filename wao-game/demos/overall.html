function safeRecord(raw){if(typeof raw!=='string'||new Blob([raw]).size>65536)throw Error('文件过大，上限64KB（设计预览）');let v;try{v=JSON.parse(raw)}catch{throw Error("文件损坏，无法解析记忆")};if(v.format!=='wao-design-preview'||v.formatVersion!==1||v.rulesVersion!==1)throw Error('这不是 A2 设计预览记忆，或版本不兼容');if(!Number.isInteger(v.revision)||v.revision<0||v.revision>1e9||typeof v.savedAt!=='string'||!Number.isFinite(Date.parse(v.savedAt)))throw Error('保存信息无效');if(!Array.isArray(v.games)||v.games.length<1||v.games.length>7)throw Error('游戏数量无效');const seen=new Set();for(const p of v.games){if(!p||!games.some(g=>g.id===p.gameId)||seen.has(p.gameId)||!Number.isInteger(p.choice)||p.choice<0||p.choice>2)throw Error('游戏标识或进度字段无效');seen.add(p.gameId)}return{format:v.format,formatVersion:1,rulesVersion:1,savedAt:v.savedAt,revision:v.revision,games:v.games.map(p=>({gameId:p.gameId,choice:p.choice}))}}

function persist(){if(saveMode==='session'){status('设计预览 · 仅本次，可随时导出');return}if(conflict){status('另一页已有修改 · 请导出本页或读取另一页');return}status('设计预览 · 保存中');try{const old=localStorage.getItem(key);if(old&&safeRecord(old).revision!==revision){conflict=true;throw Error('conflict')}revision++;localStorage.setItem(key,JSON.stringify(record()));status('设计预览 · 已保存到本机')}catch(e){if(!conflict)revision=Math.max(0,revision-1);status(conflict?'另一页已有修改 · 本页选择保留，请打开游戏记忆':'保存失败 · 选择仍在本页，请重试或导出')}}
