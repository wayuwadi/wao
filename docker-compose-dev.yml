name: wao-dev

services:
  mysql-dev:
    image: mysql:9.0
    restart: unless-stopped
    ports:
      - "127.0.0.1:3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASS:?Run python scripts/local-dev.py init first}
      MYSQL_DATABASE: ${DB_NAME:-wao}
      MYSQL_USER: ${DB_USER:-wao_app}
      MYSQL_PASSWORD: ${DB_PASS:?Run python scripts/local-dev.py init first}
      TZ: Asia/Shanghai
    volumes:
      - mysql-dev-data:/var/lib/mysql
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent",
        ]
      interval: 10s
      timeout: 5s
      retries: 15
    networks: [wao-dev]

  redis-dev:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:6379:6379"
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASS:?Run python scripts/local-dev.py init first}"]
    volumes:
      - redis-dev-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASS}", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10
    networks: [wao-dev]

  nacos-dev:
    image: nacos/nacos-server:v2.4.3
    restart: unless-stopped
    ports:
      - "127.0.0.1:8848:8848"
      - "127.0.0.1:9848:9848"
    environment:
      MODE: standalone
      NACOS_AUTH_ENABLE: "false"
      JVM_XMS: 512m
      JVM_XMX: 512m
      JVM_XMN: 256m
    networks: [wao-dev]

volumes:
  mysql-dev-data:
  redis-dev-data:

networks:
  wao-dev:
    name: wao-dev
